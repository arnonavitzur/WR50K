<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vermont 50K — Training Plan</title>
<meta name="description" content="Training plan and FIT file analysis for the Vermont 50K.">

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WR50K">

<!-- Fonts: must be a link, not an @import inside <style> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="fit-analysis.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; }
  body { 
    font-family: -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  #root { min-height: 100%; }
  ::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }
  @keyframes wr-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    @keyframes wr-spin { to { transform: none; } }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ── Design tokens ─────────────────────────────────────────────
const A = {
  bg: '#000000',
  surface: '#0e0e10',
  surface2: '#17171a',
  surface3: '#222227',
  border: 'rgba(255,255,255,0.08)',
  borderStrong: 'rgba(255,255,255,0.16)',
  text: '#ffffff',
  textDim: 'rgba(255,255,255,0.62)',
  textFaint: 'rgba(255,255,255,0.38)',
  accent: '#ff5a3c',
};
const SANS = '"Inter", -apple-system, system-ui, sans-serif';
const MONO = '"JetBrains Mono", ui-monospace, monospace';
const DISPLAY = '"Inter", system-ui, sans-serif';

// ── Color maps ────────────────────────────────────────────────
const RUN_COLORS = {
  tempo:       { hue: '#ff5a3c', name: 'TEMPO',       bg: 'rgba(255,90,60,0.12)',   ring: '#ff5a3c' },
  easy:        { hue: '#4ade80', name: 'EASY',        bg: 'rgba(74,222,128,0.12)',  ring: '#4ade80' },
  power_climb: { hue: '#ffb020', name: 'POWER CLIMB', bg: 'rgba(255,176,32,0.12)',  ring: '#ffb020' },
  shakeout:    { hue: '#60a5fa', name: 'SHAKEOUT',    bg: 'rgba(96,165,250,0.12)',  ring: '#60a5fa' },
  long:        { hue: '#c084fc', name: 'LONG',        bg: 'rgba(192,132,252,0.12)', ring: '#c084fc' },
  rest:        { hue: '#71717a', name: 'REST',        bg: 'rgba(113,113,122,0.12)', ring: '#71717a' },
  default:     { hue: '#a3a3a3', name: 'RUN',         bg: 'rgba(163,163,163,0.12)', ring: '#a3a3a3' },
};
const STRENGTH_COLORS = {
  lower:   { hue: '#a78bfa', name: 'LOWER',    bg: 'rgba(167,139,250,0.12)', ring: '#a78bfa' },
  upper:   { hue: '#22d3ee', name: 'UPPER',    bg: 'rgba(34,211,238,0.12)',  ring: '#22d3ee' },
  default: { hue: '#a78bfa', name: 'STRENGTH', bg: 'rgba(167,139,250,0.12)', ring: '#a78bfa' },
};
const runColor = (s) => RUN_COLORS[s] || RUN_COLORS.default;
const strColor = (s) => STRENGTH_COLORS[s] || STRENGTH_COLORS.default;

const PHASE_STYLE = {
  Base:      { label: 'BASE',    hue: '#4ade80' },
  Build:     { label: 'BUILD',   hue: '#ff5a3c' },
  Peak:      { label: 'PEAK',    hue: '#ffb020' },
  Taper_1:   { label: 'TAPER',   hue: '#60a5fa' },
  Taper_2:   { label: 'TAPER',   hue: '#60a5fa' },
  Race_week: { label: 'RACE WK', hue: '#c084fc' },
};
const phaseStyle = (p) => PHASE_STYLE[p] || { label: (p||'PHASE').toUpperCase(), hue: A.textDim };

// ── Helpers ───────────────────────────────────────────────────
const formatDayLong = (iso) => new Date(iso+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
const dayShort = (iso) => new Date(iso+'T00:00:00').toLocaleDateString('en-US',{weekday:'short'}).slice(0,3).toUpperCase();
const dayNum = (iso) => new Date(iso+'T00:00:00').getDate();
// Local calendar date as YYYY-MM-DD. toISOString() alone is UTC, which rolls
// over to tomorrow during the evening in western timezones.
const todayIso = () => {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
};
const weekActive = (rangeStr, week) => {
  if (!rangeStr) return true;
  const parts = rangeStr.split('-').map(Number);
  return week >= parts[0] && week <= (parts[1]||parts[0]);
};
// Scrolls an element to just under the sticky day header inside #app-scroll.
const scrollUnderHeader = (el, extra = 12) => {
  const sc = document.getElementById('app-scroll');
  if (!sc || !el) return;
  const headerH = document.getElementById('day-header')?.offsetHeight || 0;
  const top = sc.scrollTop + el.getBoundingClientRect().top - sc.getBoundingClientRect().top - headerH - extra;
  sc.scrollTo({top: Math.max(0, top), behavior:'smooth'});
};
const resolveToday = (plan) => {
  const dates = Object.keys(plan.days).sort();
  const today = todayIso();
  if (plan.days[today]) return today;
  let best = dates[0], bestDiff = Infinity;
  for (const d of dates) {
    const diff = Math.abs(new Date(d) - new Date(today));
    if (diff < bestDiff) { bestDiff = diff; best = d; }
  }
  return best;
};

// ── SVG Icons ─────────────────────────────────────────────────
function Icon({name, size=16, color='currentColor', stroke=2}) {
  const s = {width:size,height:size,fill:'none',stroke:color,strokeWidth:stroke,strokeLinecap:'round',strokeLinejoin:'round',display:'block',flexShrink:0};
  switch(name) {
    case 'run': return <svg {...s} viewBox="0 0 24 24"><circle cx="13" cy="4" r="2"/><path d="M4 22l3-7 4-2-2-4 4-2 4 5h3"/><path d="M9 13l2 5"/></svg>;
    case 'mountain': return <svg {...s} viewBox="0 0 24 24"><path d="M2 20l6-12 4 7 3-5 7 10z"/></svg>;
    case 'dumbbell': return <svg {...s} viewBox="0 0 24 24"><path d="M2 9v6M5 7v10M19 7v10M22 9v6M5 12h14"/></svg>;
    case 'pill': return <svg {...s} viewBox="0 0 24 24"><rect x="2" y="9" width="20" height="6" rx="3"/><path d="M12 9v6"/></svg>;
    case 'stretch': return <svg {...s} viewBox="0 0 24 24"><path d="M3 12c4-6 14-6 18 0M3 12c4 6 14 6 18 0"/></svg>;
    case 'clock': return <svg {...s} viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>;
    case 'down': return <svg {...s} viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>;
    case 'flame': return <svg {...s} viewBox="0 0 24 24"><path d="M12 22c4 0 7-3 7-7 0-4-4-6-3-10-3 1-7 4-7 9 0-2-1-3-2-4-1 2-2 3-2 5 0 4 3 7 7 7z"/></svg>;
    case 'drop': return <svg {...s} viewBox="0 0 24 24"><path d="M12 3l5 7a6 6 0 11-10 0z"/></svg>;
    case 'route': return <svg {...s} viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h6a4 4 0 000-8h-4a4 4 0 010-8h6"/></svg>;
    case 'list': return <svg {...s} viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>;
    case 'back': return <svg {...s} viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>;
    case 'heart': return <svg {...s} viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0112 6a5.5 5.5 0 019.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>;
    case 'analyze': return <svg {...s} viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 5-7"/></svg>;
    default: return null;
  }
}

// ── Day strip ─────────────────────────────────────────────────
function DayStrip({dates, selected, onSelect, plan}) {
  const ref = useRef(null);
  const today = todayIso();
  useEffect(() => {
    if (!ref.current) return;
    const el = ref.current.querySelector(`[data-day="${selected}"]`);
    if (el) el.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
  }, [selected]);
  return (
    <div ref={ref} style={{display:'flex',gap:8,overflowX:'auto',padding:'4px 16px 12px',scrollbarWidth:'none'}}>
      {dates.map(d => {
        const day = plan.days[d];
        const isSel = d === selected;
        const isToday = d === today;
        const run = day.run?.sessions?.[0];
        const str = day.strength?.sessions?.[0];
        const dots = [];
        if (run) dots.push(runColor(run.subtype).hue);
        if (str) dots.push(strColor(str.subtype).hue);
        if (!dots.length) dots.push(A.textFaint);
        return (
          <button key={d} data-day={d} onClick={()=>onSelect(d)} style={{
            flex:'0 0 auto', minWidth:54, height:72, padding:'8px 6px',
            borderRadius:14, border:`1.5px solid ${isSel ? A.text : A.border}`,
            background: isSel ? A.surface2 : isToday ? 'rgba(255,255,255,0.07)' : 'transparent',
            color: A.text, cursor:'pointer', fontFamily:SANS,
            display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'space-between',
            transition:'all .18s ease', WebkitTapHighlightColor:'transparent',
          }}>
            <span style={{fontSize:9,letterSpacing:1.2,fontWeight:600,color:isSel?A.text:A.textFaint,fontFamily:MONO}}>
              {dayShort(d)}
            </span>
            <span style={{fontSize:20,fontWeight:700,fontFamily:DISPLAY,lineHeight:1,color:isSel?A.text:A.textDim}}>
              {dayNum(d)}
            </span>
            <span style={{display:'flex',gap:3,alignItems:'center',height:6}}>
              {dots.map((c,i) => <span key={i} style={{width:6,height:6,borderRadius:3,background:c}}/>)}
            </span>
          </button>
        );
      })}
    </div>
  );
}

// ── Filter chips ──────────────────────────────────────────────
function FilterChips({filter, setFilter}) {
  const opts = [{id:'all',label:'Focus'},{id:'workouts',label:'Workouts'},{id:'nutrition',label:'Nutrition'},{id:'routines',label:'Routines'}];
  return (
    <div style={{display:'flex',gap:6,padding:'0 16px 14px',overflowX:'auto',scrollbarWidth:'none'}}>
      {opts.map(o => {
        const isSel = o.id === filter;
        return (
          <button key={o.id} onClick={()=>setFilter(o.id)} style={{
            padding:'7px 14px', borderRadius:100,
            border:`1px solid ${isSel ? A.text : A.border}`,
            background: isSel ? A.text : 'transparent',
            color: isSel ? A.bg : A.textDim,
            fontSize:12, fontWeight:600, fontFamily:SANS, letterSpacing:0.2,
            cursor:'pointer', whiteSpace:'nowrap', flexShrink:0,
            transition:'all .15s', WebkitTapHighlightColor:'transparent',
          }}>{o.label}</button>
        );
      })}
    </div>
  );
}

// ── Big stat ──────────────────────────────────────────────────
function BigStat({label, value, unit, color, mono, size}) {
  return (
    <div>
      <div style={{fontSize:9,color:A.textFaint,fontFamily:MONO,letterSpacing:1.2,fontWeight:700,marginBottom:4}}>{label}</div>
      <div style={{display:'flex',alignItems:'baseline',gap:3}}>
        <span style={{fontSize:size||22,fontWeight:800,color:color||A.text,fontFamily:mono?MONO:DISPLAY,letterSpacing:-0.4,lineHeight:1}}>{value}</span>
        {unit && <span style={{fontSize:11,color:A.textDim,fontFamily:MONO}}>{unit}</span>}
      </div>
    </div>
  );
}

// ── Session stat row ──────────────────────────────────────────
// Shared by the hero card (collapsed header / top of expanded) and the
// All-tab minimal card, so both always show the same set of stats.
const terrainLabel = t => String(t).replace(/_or_/g, '/').replace(/_/g, ' ')
  .replace(/(^|[\s/])([a-z])/g, (_, sep, c) => sep + c.toUpperCase());

function SessionStats({session, kind}) {
  const stats = [];
  if (kind === 'run') {
    if (session.distance_mi != null) stats.push({label:'DISTANCE', value:session.distance_mi, unit:'mi'});
    if (session.duration_min != null) stats.push({label:'DURATION', value:session.duration_min, unit:'min'});
    if (session.elevation_gain_ft > 0) stats.push({label:'VERT', value:session.elevation_gain_ft.toLocaleString(), unit:'ft'});
    if (session.terrain) {
      const t = terrainLabel(session.terrain);
      // Shrink long terrain names ("ROAD/FIREROAD") so they fit a 4-up column at 390px
      stats.push({label:'TERRAIN', value:t, mono:true, size:t.length<=6?22:t.length<=9?17:13});
    }
  } else {
    if (session.duration_min != null) stats.push({label:'DURATION', value:session.duration_min, unit:'min'});
    stats.push({label:'EXERCISES', value:(session.exercises||[]).length, unit:'moves'});
  }
  if (!stats.length) return null;
  return (
    <div style={{display:'grid',gridTemplateColumns:`repeat(${Math.max(stats.length,3)},1fr)`,padding:'0 18px 18px',gap:stats.length>3?8:12}}>
      {stats.map(s => <BigStat key={s.label} {...s}/>)}
    </div>
  );
}

// ── Hero Workout Card ─────────────────────────────────────────
// ── Workout fueling collapsible ───────────────────────────────
function WorkoutFueling({preFuel, postFuel, workoutLabel, color}) {
  const [open, setOpen] = useState(false);
  if (!preFuel && !postFuel) return null;
  return (
    <div style={{background:A.surface2,borderRadius:14,overflow:'hidden',border:`1px solid ${A.border}`,marginBottom:8}}>
      <button onClick={()=>setOpen(o=>!o)} style={{
        width:'100%',padding:'12px 14px',background:'transparent',border:'none',
        display:'flex',alignItems:'center',gap:10,cursor:'pointer',
        WebkitTapHighlightColor:'transparent',
      }}>
        <div style={{width:28,height:28,borderRadius:7,background:'rgba(255,176,32,0.14)',border:'1px solid rgba(255,176,32,0.3)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          <Icon name="flame" size={13} color="#ffb020"/>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:9,color:'#ffb020',fontFamily:MONO,letterSpacing:1.2,fontWeight:700}}>{workoutLabel} FUELING</div>
          <div style={{fontSize:12,color:A.textDim}}>{[preFuel,postFuel].filter(Boolean).length} windows</div>
        </div>
        <span style={{transform:open?'rotate(180deg)':'rotate(0)',transition:'transform .2s'}}>
          <Icon name="down" size={14} color={A.textFaint}/>
        </span>
      </button>
      {open && (
        <div style={{borderTop:`1px solid ${A.border}`,padding:'4px 14px 14px'}}>
          {preFuel && <FuelChip fuel={preFuel} label="PRE" color="#60a5fa"/>}
          {postFuel && <div style={{marginTop:preFuel?8:0}}><FuelChip fuel={postFuel} label="POST" color="#4ade80"/></div>}
        </div>
      )}
    </div>
  );
}

function HeroWorkout({session, kind, isSecondary, fueling, prePost, workoutLabel, focusNonce, onFocusDone}) {
  const [collapsed, setCollapsed] = useState(false);
  const rootRef = useRef(null);
  // A focus request from the Focus tab: expand this card and scroll it into view.
  useEffect(() => {
    if (focusNonce == null) return;
    setCollapsed(false);
    // Deferred so the tab switch and the expand have both laid out before we measure.
    const t = setTimeout(() => {
      scrollUnderHeader(rootRef.current);
      onFocusDone && onFocusDone();
    }, 0);
    return () => clearTimeout(t);
  }, [focusNonce]);
  const color = kind === 'run' ? runColor(session.subtype) : strColor(session.subtype);
  const preFuel = (fueling||[]).find(f => {
    const ls = f.linked_session || {};
    if (ls.position !== 'pre') return false;
    if (ls.type && ls.type !== kind) return false;
    if (ls.subtype && ls.subtype !== session.subtype) return false;
    return true;
  }) || (fueling||[]).find(f => f.linked_session?.position==='pre' && f.linked_session?.type===kind && !f.linked_session?.subtype);
  const postFuel = (fueling||[]).find(f => {
    const ls = f.linked_session || {};
    if (ls.position !== 'post') return false;
    if (ls.type && ls.type !== kind) return false;
    if (ls.subtype && ls.subtype !== session.subtype) return false;
    return true;
  }) || (fueling||[]).find(f => f.linked_session?.position==='post' && f.linked_session?.type===kind && !f.linked_session?.subtype);
  const label = workoutLabel || (kind === 'run' ? color.name : color.name);

  return (
    <div ref={rootRef} style={{background:`color-mix(in srgb, ${color.hue} 6%, ${A.surface})`,borderRadius:20,overflow:'hidden',border:`1px solid color-mix(in srgb, ${color.hue} 20%, ${A.border})`}}>
      <div style={{height:3,background:color.hue}}/>

      {/* Tappable header — always visible, toggles collapse */}
      <button onClick={()=>setCollapsed(c=>!c)} style={{
        width:'100%',padding:'18px 18px 0',background:'transparent',border:'none',
        textAlign:'left',cursor:'pointer',color:A.text,fontFamily:SANS,
        WebkitTapHighlightColor:'transparent',
      }}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
          <span style={{padding:'3px 8px',borderRadius:4,fontSize:10,fontWeight:700,letterSpacing:1.4,color:color.hue,background:color.bg,fontFamily:MONO}}>
            {color.name}
          </span>
          {kind==='run' && session.poles && <span style={{fontSize:10,color:A.textDim,fontFamily:MONO,letterSpacing:1}}>+ POLES</span>}
          <div style={{flex:1}}/>
          <span style={{transform:collapsed?'rotate(0)':'rotate(180deg)',transition:'transform .2s',display:'flex',alignItems:'center'}}>
            <Icon name="down" size={14} color={A.textFaint}/>
          </span>
        </div>
        <div style={{fontSize:22,fontWeight:700,color:A.text,fontFamily:DISPLAY,letterSpacing:-0.4,lineHeight:1.1,marginBottom:14}}>{session.title}</div>
      </button>

      {/* Stats — always visible */}
      <SessionStats session={session} kind={kind}/>

      {/* Expanded content */}
      {!collapsed && (
        <>
          {kind==='run' && (
            <>
              {session.hr_cap_bpm && (
                <div style={{margin:'0 18px 16px',background:A.surface2,borderRadius:10,padding:'10px 12px',border:`1px solid ${A.border}`}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
                    <span style={{fontSize:9,color:A.textFaint,fontFamily:MONO,letterSpacing:1.2,fontWeight:700}}>HR TARGET</span>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      <span style={{fontSize:16,fontWeight:700,color:color.hue,fontFamily:DISPLAY}}>≤{session.hr_cap_bpm}</span>
                      <span style={{fontSize:10,color:A.textDim,fontFamily:MONO}}>bpm</span>
                      {session.hr_zone && <span style={{fontSize:9,padding:'2px 6px',borderRadius:3,background:color.bg,color:color.hue,fontFamily:MONO,fontWeight:700,letterSpacing:1}}>{session.hr_zone}</span>}
                    </div>
                  </div>
                  <div style={{height:4,borderRadius:2,background:A.surface3,overflow:'hidden'}}>
                    <div style={{height:'100%',width:'70%',background:`linear-gradient(90deg,${color.hue}88,${color.hue})`,borderRadius:2}}/>
                  </div>
                </div>
              )}
              {session.pace_target && (
                <div style={{margin:'0 18px 16px',display:'flex',gap:12,alignItems:'center'}}>
                  <div style={{fontSize:9,color:A.textFaint,fontFamily:MONO,letterSpacing:1.2,fontWeight:700}}>PACE</div>
                  <div style={{fontSize:13,color:A.textDim,fontFamily:MONO}}>{session.pace_target.min_per_mi_fast}–{session.pace_target.min_per_mi_slow} /mi</div>
                </div>
              )}
              {session.key_cue && (
                <div style={{margin:'0 18px 14px',padding:'10px 12px',background:'rgba(255,255,255,0.03)',borderRadius:8,border:`1px solid ${A.border}`}}>
                  <div style={{fontSize:9,color:color.hue,fontFamily:MONO,letterSpacing:1.2,fontWeight:700,marginBottom:4}}>KEY CUE</div>
                  <div style={{fontSize:12,color:A.text,lineHeight:1.5,fontFamily:SANS,fontStyle:'italic'}}>{session.key_cue}</div>
                </div>
              )}
              {session.notes && (
                <div style={{margin:'0 18px 14px',padding:'10px 12px',background:'rgba(255,255,255,0.03)',borderRadius:8,border:`1px solid ${A.border}`}}>
                  <div style={{fontSize:9,color:A.textDim,fontFamily:MONO,letterSpacing:1.2,fontWeight:700,marginBottom:4}}>DETAILS</div>
                  <div style={{fontSize:12,color:A.textDim,lineHeight:1.6,fontFamily:SANS}}>{session.notes}</div>
                </div>
              )}
            </>
          )}

          {kind==='strength' && (
            <div style={{padding:'0 18px 4px'}}>
              {/* Exercises — PrePostCard style */}
              <ExercisesCollapsible exercises={session.exercises||[]} color={color}/>
            </div>
          )}

          {/* Warm-up / Cool-down (passed as prePost prop) */}
          {prePost && (
            <div style={{padding:'0 18px 4px'}}>
              {prePost}
            </div>
          )}

          {/* Workout fueling — last */}
          <div style={{padding:'0 18px 4px'}}>
            <WorkoutFueling preFuel={preFuel} postFuel={postFuel} workoutLabel={label} color={color}/>
          </div>
          <div style={{height:14}}/>
        </>
      )}
      {collapsed && <div style={{height:4}}/>}
    </div>
  );
}

// ── Supplements ───────────────────────────────────────────────
function Supplements({supplements, weekNumber}) {
  const slots = {morning:[],pre_run:[],post_run:[],evening:[]};
  const labels = {morning:'MORNING',pre_run:'PRE-WORKOUT',post_run:'POST-WORKOUT',evening:'EVENING'};
  const icons = {morning:'🌅',pre_run:'↑',post_run:'↓',evening:'🌙'};
  for (const s of supplements) {
    if (s.active_weeks && !weekActive(s.active_weeks, weekNumber)) continue;
    const slot = s.timing_slot || 'morning';
    if (slots[slot]) slots[slot].push(s);
  }
  const [open, setOpen] = useState(false);
  const totalCount = Object.values(slots).flat().length;
  return (
    <div style={{background:A.surface2,borderRadius:14,overflow:'hidden',border:`1px solid ${A.border}`,marginBottom:8}}>
      <button onClick={()=>setOpen(o=>!o)} style={{

        WebkitTapHighlightColor:'transparent',
      }}>
        <div style={{width:28,height:28,borderRadius:7,background:'rgba(34,211,238,0.1)',border:'1px solid rgba(34,211,238,0.25)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>

          <div style={{fontSize:12,color:A.textDim}}>{totalCount} supplement{totalCount!==1?'s':''} · 4 timing windows</div>
        </div>
        <span style={{transform:open?'rotate(180deg)':'rotate(0)',transition:'transform .2s'}}>
          <Icon name="down" size={14} color={A.textFaint}/>
        </span>
      </button>
      {open && (
        <div style={{borderTop:`1px solid ${A.border}`,padding:'4px 14px 14px'}}>
      {Object.entries(slots).map(([slot, items]) => {
        if (!items.length) return null;
        return (
          <div key={slot} style={{marginBottom:14}}>
            <div style={{fontSize:9,color:A.textFaint,fontFamily:MONO,letterSpacing:1.4,fontWeight:700,marginBottom:8,display:'flex',alignItems:'center',gap:6}}>
              <span style={{width:18,height:18,borderRadius:4,background:'rgba(34,211,238,0.08)',border:'1px solid rgba(34,211,238,0.2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10}}>{icons[slot]}</span>
              {labels[slot]}
            </div>
            {items.map((s,i) => <SupplementRow key={i} sup={s}/>)}
          </div>
        );

    </div>
  );
}

// ── Day Timeline ──────────────────────────────────────────────
function DayTimeline({day, plan}) {
  const items = [];
  const activeRoutines = plan.daily_routines.filter(r => weekActive(r.active_weeks, day.week_number));
  if (activeRoutines.length) {
    const totalMin = activeRoutines.reduce((s,r) => s + (r.duration_min||0), 0);
    items.push({time:'06:30',kind:'routine',label:'Daily routines',dur:totalMin,color:'#4ade80'});
  }
  const mornSups = plan.supplements.filter(s => s.timing_slot==='morning' && weekActive(s.active_weeks, day.week_number));
  if (mornSups.length) items.push({time:'07:00',kind:'supp',label:`Morning supplements (${mornSups.length})`,color:'#22d3ee'});
  const fueling = day.nutrition?.session_fueling || [];
  for (const s of (day.run?.sessions||[])) {
    const pre = fueling.find(f => f.linked_session?.position==='pre' && f.linked_session?.type==='run');
    const post = fueling.find(f => f.linked_session?.position==='post' && f.linked_session?.type==='run');
    if (pre) items.push({time:'06:30',kind:'fuel',label:'Pre-run fuel',sub:(pre.foods||[])[0],color:'#ffb020'});
    items.push({time:'08:00',kind:'session',label:s.title,dur:s.duration_min,color:runColor(s.subtype).hue,sub:runColor(s.subtype).name});
    if (post) items.push({time:'09:30',kind:'fuel',label:'Post-run recovery',sub:(post.foods||[])[0],color:'#ffb020'});
  }
  for (const s of (day.strength?.sessions||[])) {
    const pre = fueling.find(f => f.linked_session?.position==='pre' && f.linked_session?.type==='strength');
    const post = fueling.find(f => f.linked_session?.position==='post' && f.linked_session?.type==='strength');
    if (pre) items.push({time:'16:00',kind:'fuel',label:'Pre-strength fuel',sub:(pre.foods||[])[0],color:'#ffb020'});
    items.push({time:'17:00',kind:'session',label:s.title,dur:s.duration_min,color:strColor(s.subtype).hue,sub:strColor(s.subtype).name});
    if (post) items.push({time:'18:30',kind:'fuel',label:'Post-strength meal',sub:(post.foods||[])[0],color:'#ffb020'});
  }
  const eveSups = plan.supplements.filter(s => s.timing_slot==='evening' && weekActive(s.active_weeks, day.week_number));
  if (eveSups.length) items.push({time:'21:30',kind:'supp',label:`Evening: ${eveSups.map(s=>s.name).join(', ')}`,color:'#22d3ee'});
  items.sort((a,b) => a.time.localeCompare(b.time));
  return (
    <div style={{background:A.surface,borderRadius:20,padding:'16px 18px 18px',border:`1px solid ${A.border}`}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
        <span style={{padding:'3px 8px',borderRadius:4,fontSize:10,fontWeight:700,letterSpacing:1.4,color:A.text,background:'rgba(255,255,255,0.06)',fontFamily:MONO}}>DAY TIMELINE</span>
        <div style={{flex:1}}/>
        <Icon name="clock" size={14} color={A.textFaint}/>
      </div>
      <div style={{position:'relative'}}>
        <div style={{position:'absolute',left:38,top:6,bottom:6,width:1,background:A.border}}/>
        {items.map((it,i) => (
          <div key={i} style={{display:'flex',gap:12,alignItems:'flex-start',padding:'6px 0'}}>
            <div style={{width:32,fontSize:10,color:A.textFaint,fontFamily:MONO,letterSpacing:0.5,fontWeight:600,paddingTop:4,textAlign:'right'}}>{it.time}</div>
            <div style={{width:12,height:12,borderRadius:6,marginTop:4,flexShrink:0,background:A.bg,border:`2px solid ${it.color}`,boxShadow:`0 0 0 3px ${A.surface}`}}/>
            <div style={{flex:1,minWidth:0,paddingBottom:4}}>
              <div style={{fontSize:13,color:A.text,fontWeight:600,fontFamily:SANS,lineHeight:1.3}}>
                {it.label}
                {it.dur && <span style={{color:A.textFaint,fontWeight:400,fontFamily:MONO,fontSize:10,marginLeft:6}}>{it.dur}m</span>}
              </div>
              {it.sub && <div style={{fontSize:10,color:it.color,fontFamily:MONO,letterSpacing:0.6,fontWeight:600,marginTop:1}}>{it.sub}</div>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Plan View (Week list) ─────────────────────────────────────
function buildWeeks(plan) {
  const map = {};
  for (const [date, day] of Object.entries(plan.days)) {
    const w = day.week_number;
    if (!map[w]) map[w] = {n:w,phase:day.run?.phase||day.strength?.phase||'',start:date,end:date,targets:day.run?.weekly_targets||{},weekNotes:day.run?.week_notes||'',days:[]};
    const m = map[w];
    if (date < m.start) m.start = date;
    if (date > m.end) m.end = date;
    m.days.push(day);
  }
  return Object.values(map).sort((a,b) => a.n - b.n);
}

function formatRange(s, e) {
  const fmt = d => d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  return `${fmt(new Date(s+'T00:00:00'))} — ${fmt(new Date(e+'T00:00:00'))}`;
}

// ── Plan update control ───────────────────────────────────────
// Reports whether the merged plan on the server differs from the one loaded.
// A check is a conditional request: 304 costs no bandwidth, 200 carries the
// new plan. Never applies an update on its own — swapping the plan under
// someone reading today's session would be jarring.
function UpdateControl({update}) {
  if (!update) return null;
  const {status, changed, planDate, onCheck, onApply} = update;

  const fmtDate = (iso) => iso
    ? new Date(iso+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})
    : null;

  const tap = status === 'available' ? onApply : onCheck;
  const busy = status === 'checking';

  const label = {
    checking:  'Checking…',
    current:   'Up to date',
    offline:   "Can't reach server — retry",
    error:     'Check failed — retry',
    available: changed.length
      ? `${changed.join(' + ')} plan updated — tap to apply`
      : 'Update available — tap to apply',
  }[status] || (planDate ? `Plan from ${fmtDate(planDate)}` : 'Check for updates');

  const hue = status === 'available' ? A.accent
            : status === 'offline' || status === 'error' ? '#ffb020'
            : A.textFaint;

  return (
    <button onClick={busy ? undefined : tap} disabled={busy} style={{
      display:'flex',alignItems:'center',gap:7,marginTop:10,
      padding:'7px 11px',borderRadius:9,
      background: status === 'available' ? `${A.accent}14` : A.surface,
      border:`1px solid ${status === 'available' ? `${A.accent}55` : A.border}`,
      color:hue,fontFamily:MONO,fontSize:10,letterSpacing:0.8,fontWeight:700,
      cursor: busy ? 'default' : 'pointer', textAlign:'left',
      WebkitTapHighlightColor:'transparent',
    }}>
      <span style={{
        fontSize:12,lineHeight:1,display:'inline-block',
        animation: busy ? 'wr-spin 0.9s linear infinite' : 'none',
      }}>⟳</span>
      <span>{label.toUpperCase()}</span>
    </button>
  );
}

// ── IndexedDB persistence ─────────────────────────────────────
const DB_NAME = 'wr50k-analysis';
const STORE  = 'workouts';

const openDB = () => new Promise((resolve, reject) => {
  const req = indexedDB.open(DB_NAME, 1);
  req.onerror = () => reject(req.error);
  req.onupgradeneeded = () => {
    const db = req.result;
    if (!db.objectStoreNames.contains(STORE)) {
      const store = db.createObjectStore(STORE, { keyPath: 'id' });
      store.createIndex('start_time', 'meta.start_time', { unique: false });
    }
  };
  req.onsuccess = () => resolve(req.result);
});

const idbSave = async (analysis, filename) => {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const record = {
      id: crypto.randomUUID(),
      filename: filename || 'workout.fit',
      saved_at: new Date().toISOString(),
      ...analysis,
    };
    tx.objectStore(STORE).add(record);
    tx.oncomplete = () => resolve(record);
    tx.onerror = () => reject(tx.error);
  });
};

const idbList = async () => {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => {
      const all = (req.result || []).slice();
      all.sort((a,b) => {
        const ta = a.meta?.start_time || a.saved_at || '';
        const tb = b.meta?.start_time || b.saved_at || '';
        return tb.localeCompare(ta);
      });
      resolve(all);
    };
    req.onerror = () => reject(req.error);
  });
};

const idbDelete = async (id) => {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
};


// ── Analysis view components ──────────────────────────────────
function formatDateTimeShort(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) +
         ' · ' +
         d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

function formatDurationHMS(sec) {
  if (!sec || Number.isNaN(sec)) return '—';
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m ${String(s).padStart(2,'0')}s`;
}

function ElevationGraph({profile}) {
  if (!profile || profile.length < 2) return null;

  const W = 340, H = 120;
  const PAD = {top: 10, right: 10, bottom: 24, left: 44};
  const gW = W - PAD.left - PAD.right;
  const gH = H - PAD.top - PAD.bottom;

  const xs = profile.map(p => p[0]);
  const ys = profile.map(p => p[1]);
  const xMin = xs[0], xMax = xs[xs.length - 1];
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  const yRange = yMax - yMin || 1;

  const toX = d => PAD.left + ((d - xMin) / (xMax - xMin)) * gW;
  const toY = a => PAD.top + (1 - (a - yMin) / yRange) * gH;

  // Build SVG path
  const pts = profile.map(([d, a]) => `${toX(d).toFixed(1)},${toY(a).toFixed(1)}`);
  const linePath = 'M' + pts.join('L');
  // Fill area
  const fillPath = linePath +
    `L${toX(xMax).toFixed(1)},${(PAD.top + gH).toFixed(1)}` +
    `L${toX(xMin).toFixed(1)},${(PAD.top + gH).toFixed(1)}Z`;

  // Y axis ticks
  const yTicks = 3;
  const yTickVals = Array.from({length: yTicks}, (_, i) =>
    Math.round(yMin + (i / (yTicks - 1)) * yRange)
  );

  // X axis ticks — every whole mile
  const maxMile = Math.floor(xMax);
  const xTickVals = Array.from({length: maxMile + 1}, (_, i) => i);

  return (
    <div style={{
      background: A.surface, borderRadius: 16, border: `1px solid ${A.border}`,
      overflow: 'hidden',
    }}>
      <div style={{
        padding: '10px 14px 6px', borderBottom: `1px solid ${A.border}`,
        fontFamily: MONO, fontSize: 10, letterSpacing: 1.6, fontWeight: 700, color: A.textDim,
      }}>
        ELEVATION PROFILE
      </div>
      <div style={{padding: '10px 14px 12px', overflowX: 'auto'}}>
        <svg
          viewBox={`0 0 ${W} ${H}`}
          style={{width: '100%', maxWidth: W, display: 'block'}}
          preserveAspectRatio="xMidYMid meet"
        >
          {/* Grid lines */}
          {yTickVals.map((v, i) => (
            <line
              key={i}
              x1={PAD.left} y1={toY(v).toFixed(1)}
              x2={PAD.left + gW} y2={toY(v).toFixed(1)}
              stroke="rgba(255,255,255,0.06)" strokeWidth="1"
            />
          ))}

          {/* Fill area */}
          <path d={fillPath} fill="rgba(255,90,60,0.12)" />

          {/* Line */}
          <path d={linePath} fill="none" stroke="#ff5a3c" strokeWidth="1.5" strokeLinejoin="round" />

          {/* Y axis ticks + labels */}
          {yTickVals.map((v, i) => (
            <g key={i}>
              <line
                x1={PAD.left - 3} y1={toY(v).toFixed(1)}
                x2={PAD.left} y2={toY(v).toFixed(1)}
                stroke="rgba(255,255,255,0.2)" strokeWidth="1"
              />
              <text
                x={PAD.left - 6} y={toY(v)} dominantBaseline="middle" textAnchor="end"
                fontSize="8" fill="rgba(255,255,255,0.38)" fontFamily="monospace"
              >
                {v.toLocaleString()}
              </text>
            </g>
          ))}

          {/* Y axis label */}
          <text
            x={8} y={PAD.top + gH / 2}
            textAnchor="middle" fontSize="7" fill="rgba(255,255,255,0.3)"
            fontFamily="monospace" transform={`rotate(-90, 8, ${PAD.top + gH / 2})`}
          >
            ft
          </text>

          {/* X axis ticks + labels */}
          {xTickVals.map((mi) => {
            if (mi > xMax + 0.05) return null;
            const px = toX(mi);
            return (
              <g key={mi}>
                <line
                  x1={px} y1={PAD.top + gH}
                  x2={px} y2={PAD.top + gH + 3}
                  stroke="rgba(255,255,255,0.2)" strokeWidth="1"
                />
                <text
                  x={px} y={PAD.top + gH + 13}
                  textAnchor="middle" fontSize="8" fill="rgba(255,255,255,0.38)"
                  fontFamily="monospace"
                >
                  {mi}
                </text>
              </g>
            );
          })}

          {/* X axis label */}
          <text
            x={PAD.left + gW / 2} y={H - 2}
            textAnchor="middle" fontSize="7" fill="rgba(255,255,255,0.3)"
            fontFamily="monospace"
          >
            mi
          </text>

          {/* Axes */}
          <line
            x1={PAD.left} y1={PAD.top}
            x2={PAD.left} y2={PAD.top + gH}
            stroke="rgba(255,255,255,0.15)" strokeWidth="1"
          />
          <line
            x1={PAD.left} y1={PAD.top + gH}
            x2={PAD.left + gW} y2={PAD.top + gH}
            stroke="rgba(255,255,255,0.15)" strokeWidth="1"
          />
        </svg>
      </div>
    </div>
  );
}

function AnalysisView({onBack}) {
  const [history, setHistory] = useState([]);
  const [loading, setLoading] = useState(true);
  const [parsing, setParsing] = useState(false);
  const [error, setError] = useState(null);
  const [active, setActive] = useState(null); // currently viewed result
  const fileInputRef = useRef(null);

  const refresh = async () => {
    setLoading(true);
    try {
      const all = await idbList();
      setHistory(all);
    } catch (e) {
      setError('Could not load history: ' + e.message);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { refresh(); }, []);

  const onFile = async (file) => {
    if (!file) return;
    setError(null);
    setParsing(true);
    try {
      const buf = await file.arrayBuffer();
      const analysis = await window.FitAnalysis.analyzeFitBuffer(buf);
      const saved = await idbSave(analysis, file.name);
      await refresh();
      setActive(saved);
    } catch (e) {
      setError(e.message || String(e));
    } finally {
      setParsing(false);
      if (fileInputRef.current) fileInputRef.current.value = '';
    }
  };

  const deleteRecord = async (rec) => {
    if (!window.confirm(`Delete "${rec.filename}"?`)) return;
    try {
      await idbDelete(rec.id);
      if (active && active.id === rec.id) setActive(null);
      await refresh();
    } catch (e) {
      setError('Delete failed: ' + e.message);
    }
  };

  return (
    <div id="app-scroll" style={{background: A.bg, height: '100vh', overflowY: 'auto'}}>
      <div style={{
        position: 'sticky', top: 0, zIndex: 10, background: A.bg,
        borderBottom: `1px solid ${A.border}`,
        padding: '14px 16px', display: 'flex', alignItems: 'center', gap: 10,
      }}>
        <button onClick={onBack} style={{
          height: 36, padding: '0 12px', borderRadius: 10, background: A.surface2,
          border: `1px solid ${A.border}`, display: 'flex', alignItems: 'center',
          gap: 6, cursor: 'pointer', color: A.text, fontFamily: MONO,
          fontSize: 10, letterSpacing: 1.4, fontWeight: 700,
          WebkitTapHighlightColor: 'transparent',
        }}>
          <Icon name="back" size={14} color={A.text}/>
          TODAY
        </button>
        <div style={{flex: 1}}/>
        <div style={{fontSize: 10, color: A.textDim, fontFamily: MONO, letterSpacing: 1.4, fontWeight: 700}}>ANALYSIS</div>
      </div>

      <div style={{padding: 16, display: 'flex', flexDirection: 'column', gap: 14}}>
        {active ? (
          <AnalysisResultDetail analysis={active} onBack={() => setActive(null)}/>
        ) : (
          <React.Fragment>
            {/* Upload card */}
            <div style={{
              background: A.surface, borderRadius: 16, border: `1px solid ${A.border}`,
              padding: '16px', display: 'flex', flexDirection: 'column', gap: 10,
            }}>
              <div style={{fontSize: 10, color: A.accent, fontFamily: MONO, letterSpacing: 1.6, fontWeight: 700}}>
                NEW ANALYSIS
              </div>
              <div style={{fontSize: 13, color: A.textDim, lineHeight: 1.5, fontFamily: SANS}}>
                On Garmin Connect, open an activity → gear icon → <span style={{color: A.text, fontWeight: 600}}>Export Original</span>. Pick the .fit file below.
              </div>
              <input
                ref={fileInputRef}
                type="file"
                accept=".fit,application/octet-stream"
                onChange={(e) => onFile(e.target.files && e.target.files[0])}
                style={{display: 'none'}}
              />
              <button
                disabled={parsing}
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                style={{
                  height: 44, borderRadius: 10, background: parsing ? A.surface2 : A.accent,
                  border: 'none', cursor: parsing ? 'wait' : 'pointer',
                  color: parsing ? A.textDim : '#000', fontFamily: MONO,
                  fontSize: 11, letterSpacing: 1.4, fontWeight: 700,
                  WebkitTapHighlightColor: 'transparent', display: 'flex',
                  alignItems: 'center', justifyContent: 'center', gap: 8,
                }}>
                {parsing ? 'PARSING…' : 'PICK .FIT FILE'}
              </button>
              {error && (
                <div style={{
                  fontSize: 12, color: '#ff6b6b', fontFamily: SANS,
                  padding: '8px 10px', background: 'rgba(255,107,107,0.08)',
                  borderRadius: 8, border: '1px solid rgba(255,107,107,0.2)',
                }}>
                  {error}
                </div>
              )}
            </div>

            {/* History */}
            <div style={{display: 'flex', flexDirection: 'column', gap: 8}}>
              <div style={{
                fontSize: 10, color: A.textDim, fontFamily: MONO,
                letterSpacing: 1.6, fontWeight: 700, padding: '4px 4px',
              }}>
                HISTORY
              </div>
              {loading ? (
                <div style={{
                  padding: '20px 16px', textAlign: 'center', color: A.textDim,
                  fontFamily: MONO, fontSize: 11, letterSpacing: 1.2,
                }}>
                  LOADING…
                </div>
              ) : history.length === 0 ? (
                <div style={{
                  background: A.surface, borderRadius: 14, border: `1px dashed ${A.border}`,
                  padding: '24px 16px', textAlign: 'center',
                }}>
                  <div style={{fontSize: 12, color: A.textDim, fontFamily: SANS, lineHeight: 1.5}}>
                    No analyzed workouts yet. Pick a .fit file above to start.
                  </div>
                </div>
              ) : (
                history.map(rec => (
                  <AnalysisHistoryItem
                    key={rec.id}
                    record={rec}
                    onOpen={(r) => setActive(r)}
                    onDelete={deleteRecord}
                  />
                ))
              )}
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

  const [selected, setSelected] = useState(() => resolveToday(plan));
  const [filter, setFilter] = useState('all');
  const [transitioning, setTransitioning] = useState(false);
  const [view, setView] = useState('day'); // 'day' | 'plan' | 'analysis'
  // Focus-tab → detail-tab jump. {idx, nonce}; the matching HeroWorkout expands
  // and scrolls itself into view, then clears this via onFocusDone.
  const [jump, setJump] = useState(null);
  const jumpSeq = useRef(0);

  const focusWorkout = (idx) => {
    jumpSeq.current += 1;
    setJump({idx, nonce: jumpSeq.current});
    setFilter('workouts');
  };
  const focusNutrition = () => {
    setJump(null);
    setFilter('nutrition');
    setTimeout(() => document.getElementById('app-scroll')?.scrollTo({top:0,behavior:'auto'}), 0);
  };

  const jumpToDay = (d) => {
    setSelected(d);
    setView('day');
    setJump(null);
    setFilter('all');            // every day opens on Focus
    setTimeout(() => {
      document.getElementById('app-scroll')?.scrollTo({top:0,behavior:'auto'});
    }, 0);
  };

  const switchDay = (d) => {
    if (d === selected) return;
    setJump(null);
    setFilter('all');            // every day opens on Focus
    setTransitioning(true);
    setTimeout(() => {
      setSelected(d);
      setTransitioning(false);
      document.getElementById('app-scroll')?.scrollTo({top:0,behavior:'auto'});
    }, 140);
  };

  // A backgrounded PWA resumes rather than cold-starts, so the mount-time
  // resolveToday never re-runs — left open overnight, the app would still be
  // sitting on yesterday. Snap back to today when the date has rolled over or
  // after a long time away. A quick app-switch is left alone: throwing away
  // the day being read would be worse than the staleness it prevents.
  useEffect(() => {
    let awaySince = null;
    let lastDay = todayIso();
    const onVisible = () => {
      if (document.visibilityState !== 'visible') {
        awaySince = Date.now();
        return;
      }
      const now = todayIso();
      const longAway = awaySince != null && Date.now() - awaySince >= RESUME_RESET_MS;
      awaySince = null;
      if (now === lastDay && !longAway) return;
      lastDay = now;
      setSelected(resolveToday(plan));
      setJump(null);
      setFilter('all');
      setView(v => v === 'plan' ? 'day' : v);   // leave an in-progress analysis alone
      setTimeout(() => {
        document.getElementById('app-scroll')?.scrollTo({top:0,behavior:'auto'});
      }, 0);
    };
    document.addEventListener('visibilitychange', onVisible);
    return () => document.removeEventListener('visibilitychange', onVisible);
  }, [plan]);

  if (view === 'analysis') {
    return <AnalysisView onBack={() => setView('day')}/>;
  }

  if (view === 'plan') {
    return (
      <div id="app-scroll" style={{background:A.bg,height:'100vh',overflowY:'auto'}}>
        <div style={{
          position:'sticky',top:0,zIndex:10,background:A.bg,
          borderBottom:`1px solid ${A.border}`,
          padding:'14px 16px',display:'flex',alignItems:'center',gap:10,
        }}>
          <button onClick={()=>jumpToDay(resolveToday(plan))} style={{
            height:36,padding:'0 12px',borderRadius:10,background:A.surface2,
            border:`1px solid ${A.border}`,display:'flex',alignItems:'center',
            gap:6,cursor:'pointer',color:A.text,fontFamily:MONO,
            fontSize:10,letterSpacing:1.4,fontWeight:700,
            WebkitTapHighlightColor:'transparent',
          }}>
            <Icon name="back" size={14} color={A.text}/>
            TODAY
          </button>
          <div style={{flex:1}}/>
          <div style={{fontSize:10,color:A.textDim,fontFamily:MONO,letterSpacing:1.4,fontWeight:700}}>FULL PLAN</div>
        </div>
        <PlanView plan={plan} currentDate={selected} onJumpToDay={jumpToDay} update={update}/>
      </div>
    );
  }

  const day = plan.days[selected];
  const showWorkouts = filter === 'all' || filter === 'workouts';
  const showNutrition = filter === 'all' || filter === 'nutrition';
  const showRoutines = filter === 'all' || filter === 'routines';
  const runSessions = day.run?.sessions || [];
  const strSessions = day.strength?.sessions || [];
  const allSessions = [
    ...runSessions.map(s => ({...s, kind:'run'})),
    ...strSessions.map(s => ({...s, kind:'strength'})),
  ];
  const isRest = day.rest_day || (allSessions.length === 0);
  const fueling = day.nutrition?.session_fueling || [];

  return (
    <div id="app-scroll" style={{height:'100vh',overflowY:'auto',background:A.bg}}>
      <div style={{background:A.bg,color:A.text,fontFamily:SANS,minHeight:'100%',paddingBottom:40}}>
        {/* sticky header */}
        <div id="day-header" style={{position:'sticky',top:0,zIndex:10,background:A.bg,borderBottom:`1px solid ${A.border}`}}>
          <div style={{padding:'14px 16px 6px',display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:36,height:36,borderRadius:10,background:A.surface2,border:`1px solid ${A.border}`,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <Icon name="mountain" size={16} color={A.accent}/>
            </div>
            <div style={{flex:1}}>
              <div style={{fontSize:10,color:A.accent,fontFamily:MONO,letterSpacing:1.6,fontWeight:700}}>
                WEEK {day.week_number} · {(day.run?.phase||day.strength?.phase||'BASE').toUpperCase().replace('_',' ')}
              </div>
              <div style={{fontSize:18,fontWeight:700,color:A.text,fontFamily:DISPLAY,letterSpacing:-0.4}}>
                {formatDayLong(selected)}
              </div>
            </div>
            <button onClick={()=>setView('plan')} style={{
              height:36,padding:'0 12px',borderRadius:10,background:A.surface2,
              border:`1px solid ${A.border}`,display:'flex',alignItems:'center',
              justifyContent:'center',gap:6,cursor:'pointer',color:A.text,
              fontFamily:MONO,fontSize:10,letterSpacing:1.4,fontWeight:700,
              WebkitTapHighlightColor:'transparent',
            }}>
              <Icon name="list" size={14} color={A.text}/>
              PLAN
            </button>
            <button onClick={()=>setView('analysis')} aria-label="Workout analysis" style={{
              width:36,height:36,borderRadius:10,background:A.surface2,
              border:`1px solid ${A.border}`,display:'flex',alignItems:'center',
              justifyContent:'center',cursor:'pointer',color:A.text,
              WebkitTapHighlightColor:'transparent',padding:0,
            }}>
              <Icon name="analyze" size={16} color={A.text}/>
            </button>
          </div>
          <DayStrip dates={dates} selected={selected} onSelect={switchDay} plan={plan}/>
          <FilterChips filter={filter} setFilter={setFilter}/>
        </div>

        {/* day notes */}
        {day.run?.day_notes && showWorkouts && (
          <div style={{padding:'14px 16px 0'}}>
            <div style={{background:'linear-gradient(135deg,rgba(255,90,60,0.08),rgba(255,176,32,0.04))',border:'1px solid rgba(255,90,60,0.22)',borderRadius:12,padding:'10px 12px',display:'flex',gap:10,alignItems:'flex-start'}}>
              <span style={{fontSize:9,color:A.accent,fontFamily:MONO,letterSpacing:1.4,fontWeight:700,padding:'2px 6px',background:'rgba(255,90,60,0.16)',borderRadius:4,flexShrink:0,marginTop:1}}>!</span>
              <div style={{fontSize:12,color:A.text,lineHeight:1.5,fontFamily:SANS}}>{day.run.day_notes}</div>
            </div>
          </div>
        )}

        {/* main content */}
        <div style={{
          padding:'16px',display:'flex',flexDirection:'column',gap:14,
          opacity:transitioning?0:1,
          transform:transitioning?'translateY(8px)':'translateY(0)',
          transition:'opacity .14s ease,transform .14s ease',
        }}>
          {/* Rest banner belongs to the workout story — Nutrition and Routines
              still apply on a rest day, so they open straight to their cards. */}
          {isRest && showWorkouts && (
            <div style={{padding:'40px 20px',textAlign:'center',background:A.surface,borderRadius:20,border:`1px solid ${A.border}`}}>
              <div style={{fontSize:11,color:A.textDim,fontFamily:MONO,letterSpacing:1.6,marginBottom:6}}>SCHEDULED</div>
              <div style={{fontSize:32,fontWeight:800,color:A.text,fontFamily:DISPLAY,letterSpacing:-1}}>REST</div>
              <div style={{fontSize:13,color:A.textDim,marginTop:6}}>Recovery day. Routines + supplements still apply.</div>
            </div>
          )}

          {filter === 'all' ? (
            // ── ALL tab: minimal focused view ──
            <>
              {allSessions.length > 0 && (
                <>
                  {allSessions.map((s,i) => (
                    <HeroWorkoutMinimal key={i} session={s} kind={s.kind} onOpen={()=>focusWorkout(i)}/>
                  ))}
                </>
              )}
              {day.nutrition && <NutritionCardMinimal nutrition={day.nutrition} onOpen={focusNutrition}/>}
              {allSessions.length > 0 && <DayTimeline day={day} plan={plan}/>}
            </>
          ) : (
            // ── Other tabs: full detail ──
            <>
              {showWorkouts && allSessions.length > 0 && (
                <>
                  {allSessions.map((s, i) => {
                    const isRun = s.kind === 'run';
                    const isStr = s.kind === 'strength';
                    const prePost = isRun ? (
                      <>
                        <PrePostCard block={plan.session_protocols.run.pre_run} kind="pre" label="RUN WARM-UP" accent="#60a5fa"/>
                        <PrePostCard block={plan.session_protocols.run.post_run} kind="post" label="RUN COOLDOWN" accent="#4ade80"/>
                      </>
                    ) : isStr ? (() => {
                      const warmupKey = s.warmup_protocol;
                      const warmupBlock = warmupKey && plan.session_protocols.strength[warmupKey];
                      const warmupLabel = warmupKey === 'pre_upper' ? 'UPPER WARM-UP' : warmupKey === 'pre_lower' ? 'LOWER WARM-UP' : 'STRENGTH PREP';
                      return (
                        <>
                          {warmupBlock && <PrePostCard block={warmupBlock} kind="pre" label={warmupLabel} accent="#60a5fa"/>}
                          <PrePostCard block={plan.session_protocols.strength.post_strength} kind="post" label="MOBILITY" accent="#4ade80"/>
                        </>
                      );
                    })() : null;
                    return (
                      <HeroWorkout
                        key={i}
                        session={s}
                        kind={s.kind}
                        isSecondary={i > 0}
                        fueling={fueling}
                        prePost={prePost}
                        workoutLabel={s.kind === 'run' ? runColor(s.subtype).name : strColor(s.subtype).name}
                        focusNonce={jump && jump.idx === i ? jump.nonce : null}
                        onFocusDone={()=>setJump(null)}
                      />
                    );
                  })}
                </>
              )}
              {showNutrition && day.nutrition && (
                <>
                  <NutritionCard nutrition={day.nutrition}/>
                  <FuelingTimeline items={day.nutrition.session_fueling}/>
                  <Supplements supplements={plan.supplements} weekNumber={day.week_number}/>
                </>
              )}
              {showRoutines && (
                <DailyRoutines routines={plan.daily_routines} weekNumber={day.week_number}/>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Boot — loads combined_plan.json at runtime ────────────────
// The plan is fetched, not inlined, so dropping a new combined_plan.json in
// the folder updates the app with no HTML edit. sw.js serves this path
// network-first with a cache fallback, so edits land on the next online load
// and the app still opens offline.
// Note: fetch() cannot read file:// URLs — the app must be served over http
// (localhost or GitHub Pages). Opening the HTML by double-clicking will not work.

function BootScreen({children}) {
  return (
    <div style={{
      background:A.bg,color:A.text,fontFamily:SANS,height:'100vh',
      display:'flex',alignItems:'center',justifyContent:'center',padding:24,
    }}>
      <div style={{textAlign:'center',maxWidth:420}}>{children}</div>
    </div>
  );
}

const PLAN_URL = './combined_plan.json';
const SOURCE_LABEL = {run:'Run', strength:'Strength', nutrition:'Nutrition'};
const AUTO_CHECK_MS = 5 * 60 * 1000;   // don't re-check on every tab focus

// Throws if the payload is not a usable merged plan.
const assertPlan = (data) => {
  if (!data || typeof data !== 'object' || !data.days || !Object.keys(data.days).length) {
    throw new Error('combined_plan.json has no "days" — is it the merged plan?');
  }
  return data;
};

// Which of the three source plans changed between two merged files.
// merge_plans.py stamps meta.sources.{run,strength,nutrition} with the
// schema_version and generated_date of each source, so the merged file alone
// is enough to say what moved — the app never reads the sources themselves.
const changedSources = (oldPlan, newPlan) => {
  const a = oldPlan?.meta?.sources || {};
  const b = newPlan?.meta?.sources || {};
  return [...new Set([...Object.keys(a), ...Object.keys(b)])]
    .filter(k => JSON.stringify(a[k]) !== JSON.stringify(b[k]))
    .map(k => SOURCE_LABEL[k] || k);
};

const newestSourceDate = (plan) => {
  const dates = Object.values(plan?.meta?.sources || {})
    .map(s => s?.generated_date).filter(Boolean).sort();
  return dates.length ? dates[dates.length - 1] : null;
};

function Root() {
  const [plan, setPlan] = useState(null);
  const [error, setError] = useState(null);
  // Cache validators for the plan currently rendered. GitHub Pages sends an
  // ETag; python -m http.server sends only Last-Modified; a bare static host
  // may send neither. All three cases have to work, so we keep both and fall
  // back to comparing content.
  const [validator, setValidator] = useState({etag:null, lastModified:null});
  // Monotonic remount key for App — independent of whether the host sends
  // any validator at all.
  const [planVersion, setPlanVersion] = useState(0);

  // Update checking. status: idle | checking | current | available | offline | error
  const [status, setStatus] = useState('idle');
  const [pending, setPending] = useState(null);   // {plan, etag, changed[]}
  const lastCheckedRef = useRef(0);

  const load = useCallback(() => {
    setError(null);
    // 'no-cache' revalidates with the server rather than trusting the HTTP
    // cache, so an edited plan is picked up without a service worker bump.
    fetch(PLAN_URL, {cache:'no-cache'})
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
        const v = {etag: res.headers.get('etag'), lastModified: res.headers.get('last-modified')};
        return res.json().then(data => ({data, v}));
      })
      .then(({data, v}) => {
        assertPlan(data);
        setPlan(data);
        setValidator(v);
        setPlanVersion(n => n + 1);
        setStatus('idle');
        setPending(null);
      })
      .catch(e => setError(e));
  }, []);

  useEffect(load, [load]);

  // Conditional re-fetch. GitHub Pages honours If-None-Match and answers 304
  // with an empty body, so a check that finds nothing costs no bandwidth.
  // 'no-store' keeps the browser HTTP cache out of it so our own conditional
  // header is the only thing deciding 304 vs 200.
  const check = useCallback((opts = {}) => {
    const {silent = false} = opts;
    if (!plan) return;
    if (!silent) setStatus('checking');
    lastCheckedRef.current = Date.now();

    const headers = {};
    if (validator.etag) headers['If-None-Match'] = validator.etag;
    else if (validator.lastModified) headers['If-Modified-Since'] = validator.lastModified;

    fetch(PLAN_URL, {cache:'no-store', headers})
      .then(res => {
        // The service worker tags responses it served from cache because the
        // network was unreachable. Those must not be read as "up to date" —
        // the server was never actually consulted.
        if (res.headers.get('X-Served-From') === 'sw-cache') {
          throw Object.assign(new Error('served from cache — network unreachable'), {offline: true});
        }
        if (res.status === 304) { setStatus('current'); return null; }
        if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
        const v = {etag: res.headers.get('etag'), lastModified: res.headers.get('last-modified')};
        return res.json().then(data => ({data, v}));
      })
      .then(result => {
        if (!result) return;
        assertPlan(result.data);
        // A 200 does not prove the plan changed — a host may send no validator
        // at all, in which case every check returns the full body. Compare
        // content so we never claim an update that isn't there.
        if (JSON.stringify(result.data) === JSON.stringify(plan)) {
          setValidator(result.v);      // refresh validators so later checks can 304
          setStatus('current');
          return;
        }
        setPending({plan: result.data, validator: result.v, changed: changedSources(plan, result.data)});
        setStatus('available');
      })
      .catch(e => {
        // Either the fetch rejected outright, or the service worker answered
        // from cache because it could not reach the network. Neither means
        // "up to date" — report the check as not having happened.
        const unreachable = e?.offline || navigator.onLine === false;
        setStatus(unreachable ? 'offline' : 'error');
        if (!unreachable) console.warn('[plan] update check failed:', e);
      });
  }, [plan, validator]);

  // A backgrounded PWA often resumes rather than cold-starts, and a resumed
  // page never re-runs the initial fetch — so without this an update could go
  // unnoticed indefinitely. Checks quietly; never applies on its own.
  useEffect(() => {
    const onVisible = () => {
      if (document.visibilityState !== 'visible') return;
      if (Date.now() - lastCheckedRef.current < AUTO_CHECK_MS) return;
      check({silent: true});
    };
    document.addEventListener('visibilitychange', onVisible);
    return () => document.removeEventListener('visibilitychange', onVisible);
  }, [check]);

  // Swapping the plan changes App's key, remounting it. That re-runs
  // useState(() => resolveToday(plan)), so `selected` can never point at a
  // date the new plan lacks — plan.days[selected] is read unguarded in App.
  const apply = useCallback(() => {
    if (!pending) return;
    setPlan(pending.plan);
    setValidator(pending.validator);
    setPlanVersion(n => n + 1);
    setPending(null);
    setStatus('current');
  }, [pending]);

  if (error) {
    const isFileProto = window.location.protocol === 'file:';
    return (
      <BootScreen>
        <div style={{fontSize:10,color:A.accent,fontFamily:MONO,letterSpacing:1.6,fontWeight:700,marginBottom:8}}>PLAN NOT LOADED</div>
        <div style={{fontSize:20,fontWeight:800,fontFamily:DISPLAY,letterSpacing:-0.4,marginBottom:10}}>Could not load the plan</div>
        <div style={{fontSize:13,color:A.textDim,lineHeight:1.5,marginBottom:6}}>
          {isFileProto
            ? 'The app is open from a file:// path. Browsers block fetch() on file URLs — serve the folder over http instead (e.g. python3 -m http.server 8080).'
            : 'combined_plan.json could not be read from this folder.'}
        </div>
        <div style={{fontSize:11,color:A.textFaint,fontFamily:MONO,marginBottom:18}}>{String(error.message || error)}</div>
        <button onClick={load} style={{
          height:38,padding:'0 18px',borderRadius:10,background:A.surface2,
          border:`1px solid ${A.borderStrong}`,color:A.text,fontFamily:SANS,
          fontSize:13,fontWeight:600,cursor:'pointer',
        }}>Retry</button>
      </BootScreen>
    );
  }

  if (!plan) {
    return (
      <BootScreen>
        <div style={{fontSize:10,color:A.textFaint,fontFamily:MONO,letterSpacing:1.6,fontWeight:700}}>LOADING PLAN…</div>
      </BootScreen>
    );
  }

  // key={etag} is load-bearing — see the comment on apply().
  return (
    <App
      key={planVersion}
      plan={plan}
      update={{
        status,
        changed: pending?.changed || [],
        planDate: newestSourceDate(plan),
        onCheck: () => check(),
        onApply: apply,
      }}
    />
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>

<script>
/* ── Service worker ─────────────────────────────────────
   Registered outside the Babel block so it runs even if JSX compilation
   fails. Relative paths keep this working under a GitHub Pages subpath. */
(function () {
  if (!('serviceWorker' in navigator)) return;

  function showUpdatePrompt(worker) {
    if (document.getElementById('sw-update')) return;
    var bar = document.createElement('div');
    bar.id = 'sw-update';
    bar.setAttribute('role', 'status');
    bar.style.cssText = [
      'position:fixed', 'left:16px', 'right:16px',
      'bottom:calc(16px + env(safe-area-inset-bottom))',
      'z-index:9999', 'display:flex', 'align-items:center', 'gap:12px',
      'padding:12px 14px', 'background:#17171a',
      'border:1px solid rgba(255,255,255,0.16)', 'border-radius:12px',
      'box-shadow:0 8px 32px rgba(0,0,0,0.6)',
      'font-family:"Inter",-apple-system,system-ui,sans-serif',
      'font-size:13px', 'color:rgba(255,255,255,0.62)'
    ].join(';');

    var label = document.createElement('span');
    label.textContent = 'New version available';
    label.style.flex = '1';

    var btn = document.createElement('button');
    btn.textContent = 'Reload';
    btn.style.cssText = [
      'font-family:"JetBrains Mono",ui-monospace,monospace',
      'font-size:11px', 'font-weight:700', 'letter-spacing:0.08em',
      'padding:7px 14px', 'border-radius:8px', 'cursor:pointer',
      'color:#ff5a3c', 'background:rgba(255,90,60,0.12)',
      'border:1px solid #ff5a3c'
    ].join(';');
    btn.onclick = function () {
      btn.disabled = true;
      worker.postMessage('SKIP_WAITING');
    };

    bar.appendChild(label);
    bar.appendChild(btn);
    document.body.appendChild(bar);
  }

  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
      .then(function (reg) {
        if (reg.waiting && navigator.serviceWorker.controller) {
          showUpdatePrompt(reg.waiting);
        }
        reg.addEventListener('updatefound', function () {
          var sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', function () {
            /* A controller already exists → this is an update, not first install. */
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdatePrompt(sw);
            }
          });
        });
      })
      .catch(function (err) { console.warn('[sw] registration failed:', err); });

    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloading) return;
      reloading = true;
      window.location.reload();
    });
  });
})();
</script>
</body>
</html>
