  );
}

// ── Main App ──────────────────────────────────────────────────
// ── FIT analyzer (JS port of section-fit-parser.py) ───────────
const M_PER_MI    = 1609.344;
const M_TO_FT     = 3.28084;
const SEGMENT_SEC = 600;   // 10 minutes
const MIN_SPEED   = 0.05;  // m/s — below this treated as stopped

// Ascent/descent detection
const GRADE_THRESH   = 0.05;   // ±5% qualifies as ascent/descent
const FLAT_THRESH    = 0.02;   // ±2% counts as flat for end-trimming
// Minimum section length — tiered by avg absolute grade of the candidate run.
// Steeper pitches are meaningful even when short; the 0.30 mi floor is kept for gentle terrain.
const MIN_SECTION_MI_BY_GRADE = [
  [0.15, 0.10],  // |grade| >= 15% → 0.10 mi minimum
  [0.10, 0.20],  // |grade| >= 10% → 0.20 mi minimum
  [0.00, 0.30],  // |grade| <  10% → 0.30 mi minimum (original default)
];
const MERGE_GAP_MI   = 0.10;   // flat gap ≤ this merges same-direction runs
const GRID_STEP_M    = 5.0;    // distance grid resolution for grade detection

// Grade-band sub-section splitting
const GRADE_BAND_BOUNDS           = [0.10, 0.15, 0.20]; // bands: 5–10%, 10–15%, 15–20%, >20%
const GRADE_BAND_SMOOTH_M         = 250.0;               // heavy smoothing for band classification
const GRADE_BAND_MIN_SUB_MI       = 0.20;                // min length for close-band sub-section
const GRADE_BAND_MIN_SUB_MI_STRONG = 0.10;               // min length for 2+-band-different sub-section

// Cadence cleaning (grade sections only)
const CAD_WALK_SPEED          = 1.5;   // m/s — below this = walking, exclude
const CAD_PCTILE_LO           = 10;    // drop below this percentile (descent/running sections)
const CAD_PCTILE_HI           = 90;    // drop above this percentile (ascent/hiking sections)
const CAD_BIMODAL_VALLEY_RATIO = 0.60;
const CAD_LEAD_DIST           = 0.05;  // inspect first 5% of section distance
const CAD_LEAD_BELOW          = 0.15;  // lead avg must be >15% below median to trim
const CAD_LEAD_MIX            = 0.20;  // if >20% of lead pts above median → skip trim

// fit-file-parser returns grade with units '%' (scale 100). The Python
// fitparse library returned decimal. We accept both — if |g| > 1 → percent.
const gradeToDecimal = (g) => {
  if (g == null || Number.isNaN(g)) return NaN;
  return Math.abs(g) > 1 ? g / 100 : g;
};

const mpsToPace = (mps) => {
  if (mps == null || Number.isNaN(mps) || mps <= MIN_SPEED) return '—';
  const spm = M_PER_MI / mps;
  if (spm > 3600) return '—';
  let m = Math.floor(spm / 60);
  let s = Math.round(spm % 60);
  if (s === 60) { m += 1; s = 0; }
  return `${m}:${String(s).padStart(2,'0')}`;
};

// Minetti GAP factor. gradeDec: 0.10 means +10%.
const gapFactor = (gradeDec) => {
  const g = Math.max(-0.30, Math.min(0.30, gradeDec));
  const cost = 15.14*Math.pow(g,4) - 2.896*Math.pow(g,3) + 7.624*g*g + 3.310*g + 1.0;
  return cost > 0 ? cost : 1.0;
};

const nanMean = (arr) => {
  let sum = 0, count = 0;
  for (const v of arr) {
    if (v != null && !Number.isNaN(v)) { sum += v; count += 1; }
  }
  return count ? sum / count : null;
};

const fmt = (val, suffix='', noneStr='—') =>
  (val == null || Number.isNaN(val)) ? noneStr : `${val}${suffix}`;

// Build numeric time series arrays from the parser's records.
// fit-file-parser 'list' mode returns { records: [{timestamp, ...}, ...], ... }
const buildSeries = (records) => {
  const recs = records.filter(r => r && r.timestamp != null);
  if (!recs.length) return null;
  const t0 = new Date(recs[0].timestamp).getTime() / 1000;

  const n = recs.length;
  const t_sec       = new Float64Array(n);
  const speed_mps   = new Float64Array(n);
  const hr          = new Float64Array(n);
  const cadence_spm = new Float64Array(n);
  const grade       = new Float64Array(n); // decimal
  const dist_m      = new Float64Array(n); // cumulative
  const alt_m       = new Float64Array(n);
  const vert_osc_mm = new Float64Array(n);

  const num = (v) => (v == null || v === '' || Number.isNaN(Number(v))) ? NaN : Number(v);

  for (let i = 0; i < n; i++) {
    const r = recs[i];
    t_sec[i]     = new Date(r.timestamp).getTime() / 1000 - t0;
    speed_mps[i] = num(r.enhanced_speed ?? r.speed);
    hr[i]        = num(r.heart_rate);
    const cadRaw  = num(r.cadence);
    const fracCad = num(r.fractional_cadence);
    // Garmin writes cadence=0 (not NaN) when the accelerometer loses signal — treat as missing.
    cadence_spm[i] = (Number.isNaN(cadRaw) || cadRaw === 0)
      ? NaN
      : (cadRaw + (Number.isNaN(fracCad) ? 0 : fracCad)) * 2.0;
    const gRaw   = num(r.grade);
    grade[i]     = Number.isNaN(gRaw) ? NaN : gradeToDecimal(gRaw);
    dist_m[i]    = num(r.distance);
    alt_m[i]     = num(r.enhanced_altitude ?? r.altitude);
    vert_osc_mm[i] = num(r.vertical_oscillation);
  }

  // Always derive grade from altitude (ignore Garmin's grade field — altitude is more reliable)
  {
    const stepGrade = new Float64Array(n);
    stepGrade[0] = NaN;
    for (let i = 1; i < n; i++) {
      const dA = alt_m[i] - alt_m[i-1];
      const dD = dist_m[i] - dist_m[i-1];
      stepGrade[i] = (dD > 0.5 && !Number.isNaN(dA) && !Number.isNaN(dD)) ? dA / dD : NaN;
    }
    // 15-point moving avg over valid points (matches Python GRADE_SMOOTH_W=15)
    const validIdx = [];
    for (let i = 0; i < n; i++) if (!Number.isNaN(stepGrade[i])) validIdx.push(i);
    if (validIdx.length > 15) {
      for (let k = 0; k < validIdx.length; k++) {
        const start = Math.max(0, k-7);
        const end   = Math.min(validIdx.length, k+8);
        let s = 0, c = 0;
        for (let j = start; j < end; j++) { s += stepGrade[validIdx[j]]; c++; }
        grade[validIdx[k]] = c ? s / c : NaN;
      }
    }
  }

  return { t_sec, speed_mps, hr, cadence_spm, grade, dist_m, alt_m, vert_osc_mm };
};

// Clean cadence for grade sections.
// keepUpper=true  (default, descent / summary): keep the high-cadence running cluster.
// keepUpper=false (ascent sections):            keep the low-cadence hiking cluster.
const cleanCadence = (cad, spd, dist, keepUpper = true) => {
  const out = Float64Array.from(cad);

  // Step 1: speed floor — null where stopped / very slow regardless of direction
  for (let i = 0; i < spd.length; i++) {
    if (!Number.isNaN(spd[i]) && spd[i] < CAD_WALK_SPEED) out[i] = NaN;
  }

  // Step 2: bimodal detection — direction-aware
  const valid1 = Array.from(out).filter(v => !Number.isNaN(v));
  if (valid1.length >= 20) {
    const mn = Math.min(...valid1), mx = Math.max(...valid1);
    const bins = 20, bw = (mx - mn) / bins;
    const counts = new Int32Array(bins);
    const edges = Array.from({length: bins + 1}, (_, i) => mn + i * bw);
    for (const v of valid1) {
      const b = Math.min(Math.floor((v - mn) / bw), bins - 1);
      counts[b]++;
    }
    let mainPeak = 0;
    for (let i = 1; i < bins; i++) if (counts[i] > counts[mainPeak]) mainPeak = i;

    if (keepUpper) {
      // Descent: dominant peak is the HIGH (running) cluster.
      // Scan LEFT for deepest valley; cut everything below it.
      if (mainPeak > 1) {
        let valleyIdx = 0, valleyVal = counts[0];
        for (let i = 1; i < mainPeak; i++) {
          if (counts[i] < valleyVal) { valleyVal = counts[i]; valleyIdx = i; }
        }
        const peakVal = counts[mainPeak];
        if (peakVal > 0 && valleyVal / peakVal < (1 - CAD_BIMODAL_VALLEY_RATIO)) {
          const cut = (edges[valleyIdx] + edges[valleyIdx + 1]) / 2;
          for (let i = 0; i < out.length; i++) if (out[i] < cut) out[i] = NaN;
        }
      }
    } else {
      // Ascent: dominant peak is the LOW (hiking) cluster.
      // Scan RIGHT for deepest valley; cut everything above it.
      if (mainPeak < bins - 2) {
        let valleyIdx = mainPeak + 1, valleyVal = counts[mainPeak + 1];
        for (let i = mainPeak + 2; i < bins; i++) {
          if (counts[i] < valleyVal) { valleyVal = counts[i]; valleyIdx = i; }
        }
        const peakVal = counts[mainPeak];
        if (peakVal > 0 && valleyVal / peakVal < (1 - CAD_BIMODAL_VALLEY_RATIO)) {
          const cut = (edges[valleyIdx] + edges[valleyIdx + 1]) / 2;
          for (let i = 0; i < out.length; i++) if (out[i] > cut) out[i] = NaN;
        }
      }
    }
  }

  // Step 3: leading-ramp trim — descent / runnable sections only (keepUpper=true).
  // Ascent sections begin at hiking cadence immediately — no ramp to trim.
  if (keepUpper && dist) {
    const dv = Array.from(dist).filter(v => !Number.isNaN(v));
    if (dv.length >= 2) {
      const dStart = dv[0], dSpan = dv[dv.length-1] - dStart;
      const leadEnd = dStart + dSpan * CAD_LEAD_DIST;
      const leadIdx = [], restIdx = [];
      for (let i = 0; i < dist.length; i++) {
        if (Number.isNaN(dist[i])) continue;
        if (dist[i] <= leadEnd) leadIdx.push(i);
        else restIdx.push(i);
      }
      const leadV = leadIdx.map(i => out[i]).filter(v => !Number.isNaN(v));
      const restV = restIdx.map(i => out[i]).filter(v => !Number.isNaN(v));
      if (leadV.length >= 3 && restV.length >= 5) {
        const sorted = restV.slice().sort((a,b) => a-b);
        const med = sorted[Math.floor(sorted.length / 2)];
        const leadAvg = leadV.reduce((s,v) => s+v, 0) / leadV.length;
        const condA = leadAvg < med * (1 - CAD_LEAD_BELOW);
        const highFrac = leadV.filter(v => v >= med).length / leadV.length;
        const condB = highFrac < CAD_LEAD_MIX;
        if (condA && condB) { for (const i of leadIdx) out[i] = NaN; }
      }
    }
  }

  // Step 4: percentile trim on survivors — direction flips with keepUpper
  const valid2 = Array.from(out).filter(v => !Number.isNaN(v)).sort((a,b) => a-b);
  if (valid2.length >= 10) {
    if (keepUpper) {
      // Running: trim below 10th percentile — removes residual slow-shuffle noise
      const floor = valid2[Math.floor(valid2.length * CAD_PCTILE_LO / 100)];
      for (let i = 0; i < out.length; i++) if (out[i] < floor) out[i] = NaN;
    } else {
      // Hiking: trim above 90th percentile — removes residual brief-jog spikes
      const ceiling = valid2[Math.floor(valid2.length * CAD_PCTILE_HI / 100)];
      for (let i = 0; i < out.length; i++) if (out[i] > ceiling) out[i] = NaN;
    }
  }

  return out;
};

// Analyze a single segment. mask is Uint8Array; cleanCad applies cadence cleaning.
// cadKeepUpper: passed to cleanCadence — true for descent/summary, false for ascent.
const analyzeMask = (series, mask, label, cleanCad = false, cadKeepUpper = true) => {
  const idx = [];
  for (let i = 0; i < mask.length; i++) if (mask[i]) idx.push(i);
  if (!idx.length) return null;

  const pick = (arr) => Float64Array.from(idx.map(i => arr[i]));

  const spd      = pick(series.speed_mps);
  const hr       = pick(series.hr);
  const rawCad   = pick(series.cadence_spm);
  const cad      = cleanCad ? cleanCadence(rawCad, spd, pick(series.dist_m), cadKeepUpper) : rawCad;
  const grade    = pick(series.grade);
  const dist     = pick(series.dist_m);
  const alt      = pick(series.alt_m);
  const vertOsc  = pick(series.vert_osc_mm);

  const dValid = Array.from(dist).filter(v => !Number.isNaN(v));
  let dist_mi = null;
  if (dValid.length >= 2) {
    // Sum per-step distances, ignoring gap jumps between non-contiguous mask sections.
    // A step > median*10 is a gap between sections (e.g. union of A1.1+A1.2+A1.3),
    // not real movement — exclude it to avoid over-counting.
    const diffs = [];
    for (let i = 1; i < dValid.length; i++) {
      const d = dValid[i] - dValid[i-1];
      if (d > 0) diffs.push(d);
    }
    if (diffs.length > 0) {
      const sorted = diffs.slice().sort((a, b) => a - b);
      const mid = Math.floor(sorted.length / 2);
      const medianStep = sorted.length % 2 === 0
        ? (sorted[mid-1] + sorted[mid]) / 2
        : sorted[mid];
      const stepCap = medianStep * 10;
      const realSteps = diffs.filter(d => d <= stepCap);
      dist_mi = Math.round((realSteps.reduce((s, d) => s + d, 0) / M_PER_MI) * 100) / 100;
    }
  }

  const avg_spd   = nanMean(spd);
  const avg_hr    = nanMean(hr);
  const avg_cad   = nanMean(cad);
  // Avg grade from endpoints: (alt_end - alt_start) / (dist_end - dist_start)
  // Matches Python: avg_grade = (alt_valid[-1] - alt_valid[0]) / (dist_valid[-1] - dist_valid[0])
  const distValid = Array.from(dist).filter(v => !Number.isNaN(v));
  const altValid2 = Array.from(alt).filter(v => !Number.isNaN(v));
  const avg_grade = (distValid.length >= 2 && altValid2.length >= 2)
    ? (altValid2[altValid2.length-1] - altValid2[0]) / (distValid[distValid.length-1] - distValid[0])
    : null;
  const avg_vo    = nanMean(vertOsc);

  let avg_gap_spd = avg_spd;
  const spdOkCount = Array.from(spd).filter(v => !Number.isNaN(v)).length;
  const gradeAnyValid = Array.from(grade).some(g => !Number.isNaN(g));
  if (spdOkCount > 0 && gradeAnyValid) {
    const gapArr = [];
    for (let i = 0; i < spd.length; i++) {
      if (!Number.isNaN(spd[i])) {
        const g = Number.isNaN(grade[i]) ? 0 : grade[i];
        gapArr.push(spd[i] * gapFactor(g));
      }
    }
    avg_gap_spd = nanMean(gapArr);
  }

  const altValid = Array.from(alt).filter(v => !Number.isNaN(v));
  let ascent = null, descent = null;
  if (altValid.length >= 2) {
    const diffs = [];
    for (let i = 1; i < altValid.length; i++) diffs.push(altValid[i] - altValid[i-1]);
    // Filter out large altitude jumps that span gaps in a non-contiguous mask
    // (e.g. seam between A1.1 and A1.2 in the ascent-total union mask).
    // Use median(|diff|)*10 as cap — a gap jump dwarfs any real altitude step.
    const absDiffs = diffs.map(Math.abs);
    const sortedAbs = absDiffs.slice().sort((a, b) => a - b);
    const mid = Math.floor(sortedAbs.length / 2);
    const medianAbs = sortedAbs.length % 2 === 0
      ? (sortedAbs[mid-1] + sortedAbs[mid]) / 2
      : sortedAbs[mid];
    // If median is 0 (all flat), no filter needed — keep everything
    const gapCap = medianAbs > 0 ? medianAbs * 10 : Infinity;
    const validDiffs = diffs.filter((_, i) => absDiffs[i] <= gapCap);
    if (validDiffs.length > 0) {
      const asc  = validDiffs.filter(d => d > 0).reduce((s, d) => s + d, 0);
      const desc = validDiffs.filter(d => d < 0).reduce((s, d) => s + (-d), 0);
      ascent  = Math.round(asc  * M_TO_FT);
      descent = Math.round(desc * M_TO_FT);
    }
  }

  return {
    label,
    distance_mi:     dist_mi,
    avg_grade_pct:   avg_grade != null ? Math.round(avg_grade * 100 * 10) / 10 : null,
    avg_pace:        mpsToPace(avg_spd),
    avg_gap:         mpsToPace(avg_gap_spd),
    avg_hr_bpm:      avg_hr  != null ? Math.round(avg_hr  * 10) / 10 : null,
    avg_cadence_spm: avg_cad != null ? Math.round(avg_cad * 10) / 10 : null,
    avg_vert_osc_mm: avg_vo  != null ? Math.round(avg_vo  * 10) / 10 : null,
    ascent_ft:       ascent  != null ? ascent  : null,
    descent_ft:      descent != null ? descent : null,
  };
};

// analyzeSegment kept as alias for backward compat (used by time/mile builders below)
const analyzeSegment = (series, mask, label) => analyzeMask(series, mask, label, false);

const buildTimeSegments = (series) => {
  const t = series.t_sec;
  const total = t[t.length - 1];
  const out = [];
  let start = 0;
  while (start < total) {
    const end = start + SEGMENT_SEC;
    const mask = new Uint8Array(t.length);
    for (let i = 0; i < t.length; i++) {
      if (t[i] >= start && t[i] < end) mask[i] = 1;
    }
    const sMin = Math.floor(start / 60);
    const eMin = Math.min(Math.floor(end / 60), Math.ceil(total / 60));
    const seg = analyzeSegment(series, mask, `${sMin}–${eMin} min`);
    if (seg) out.push(seg);
    start = end;
  }
  return out;
};

const buildMileSegments = (series) => {
  const dist = series.dist_m;
  const valid = [];
  for (let i = 0; i < dist.length; i++) if (!Number.isNaN(dist[i])) valid.push(dist[i]);
  if (!valid.length) return [];

  const totalM  = valid[valid.length-1] - valid[0];
  const totalMi = totalM / M_PER_MI;
  const dMin = Math.min(...valid.filter(v => !Number.isNaN(v)));

  const out = [];
  let mileIdx = 1;
  while ((mileIdx - 1) < totalMi) {
    const lo = (mileIdx - 1) * M_PER_MI;
    const hi = mileIdx * M_PER_MI;
    const mask = new Uint8Array(dist.length);
    let anyHit = false;
    for (let i = 0; i < dist.length; i++) {
      if (Number.isNaN(dist[i])) continue;
      const norm = dist[i] - dMin;
      if (norm >= lo && norm < hi) { mask[i] = 1; anyHit = true; }
    }
    if (!anyHit) break;
    const remaining = totalMi - (mileIdx - 1);
    const label = remaining >= 0.95
      ? `Mile ${mileIdx}`
      : `Mile ${mileIdx} (${remaining.toFixed(2)} mi)`;
    const seg = analyzeSegment(series, mask, label);
    if (seg) out.push(seg);
    mileIdx += 1;
  }
  return out;
};

// Build summary row across all active records.
const buildSummary = (series) => {
  const mask = new Uint8Array(series.t_sec.length).fill(1);
  return analyzeMask(series, mask, 'Run total', false);
};

// Combined summary for all ascent or descent sections.
// Unions masks by dist_start_m/dist_end_m so metrics are properly weighted.
// Grade is overridden with distance-weighted average of per-section grades
// (endpoint grade across non-contiguous sections is meaningless).
const buildDirectionSummary = (series, gradeSegments, direction) => {
  const label = direction === 'ascent' ? 'Ascent total' : 'Descent total';
  const matching = gradeSegments.filter(s => s.direction === direction);
  if (!matching.length) return null;

  const dist_m = series.dist_m;
  const mask = new Uint8Array(dist_m.length);
  for (const seg of matching) {
    const { dist_start_m, dist_end_m } = seg;
    if (dist_start_m == null || dist_end_m == null) continue;
    for (let i = 0; i < dist_m.length; i++) {
      if (dist_m[i] >= dist_start_m && dist_m[i] <= dist_end_m) mask[i] = 1;
    }
  }
  if (!Array.from(mask).some(v => v)) return null;

  // Ascent summary uses keep_upper=false (hiking cadence); descent uses true (running cadence)
  const cadKeepUpper = direction !== 'ascent';
  const result = analyzeMask(series, mask, label, true, cadKeepUpper);
  if (!result) return null;

  // Override grade with distance-weighted average of individual section grades
  const totalDist = matching.reduce((s, seg) => s + (seg.distance_mi || 0), 0);
  if (totalDist > 0) {
    const wGrade = matching.reduce(
      (s, seg) => s + (seg.avg_grade_pct || 0) * (seg.distance_mi || 0), 0
    ) / totalDist;
    result.avg_grade_pct = Math.round(wGrade * 10) / 10;
  }
  return result;
};

// Elevation profile: [[distance_mi, altitude_ft], ...] on a 10m grid.
// Covers only the active run portion (series is already filtered).
const buildElevationProfile = (series, stepM = 10.0) => {
  const dist_m = series.dist_m;
  const alt_m  = series.alt_m;

  // Collect valid paired points
  const dv = [], av = [];
  for (let i = 0; i < dist_m.length; i++) {
    if (!Number.isNaN(dist_m[i]) && !Number.isNaN(alt_m[i])) {
      dv.push(dist_m[i]);
      av.push(alt_m[i]);
    }
  }
  if (dv.length < 2) return [];

  const d0 = dv[0], dLast = dv[dv.length - 1];
  const profile = [];

  // Linear interpolation helper
  const interp = (d) => {
    if (d <= dv[0]) return av[0];
    if (d >= dLast) return av[av.length - 1];
    let lo = 0, hi = dv.length - 1;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (dv[mid] <= d) lo = mid; else hi = mid;
    }
    const t = (d - dv[lo]) / (dv[hi] - dv[lo]);
    return av[lo] + t * (av[hi] - av[lo]);
  };

  for (let d = d0; d <= dLast; d += stepM) {
    const distMi = Math.round((d - d0) / 1609.344 * 1000) / 1000;
    const altFt  = Math.round(interp(d) * 3.28084 * 10) / 10;
    profile.push([distMi, altFt]);
  }
  return profile;
};

// Extract (startMs, endMs) windows for laps with intensity === 'active'.
// fit-file-parser decodes intensity to a string like 'active'/'warmup'/'cooldown'.
const activeWindows = (laps) => {
  if (!laps || !laps.length) return [];
  const clean = laps
    .filter(l => l.start_time != null)
    .map(l => ({ start: new Date(l.start_time).getTime(), intensity: l.intensity }))
    .sort((a, b) => a.start - b.start);

  // The end of each lap = start of the next. Last lap ends = very far future.
  const windows = [];
  for (let i = 0; i < clean.length; i++) {
    const end = i + 1 < clean.length ? clean[i+1].start : Infinity;
    if (clean[i].intensity === 'active') {
      windows.push([clean[i].start, end]);
    }
  }
  return windows;
};

const filterToActive = (records, windows) => {
  if (!windows.length) return records; // no laps info — use everything
  return records.filter(r => {
    if (!r.timestamp) return false;
    const ts = new Date(r.timestamp).getTime();
    return windows.some(([s, e]) => ts >= s && ts <= e);
  });
};

// Detect ascent (A1, A2…) and descent (D1, D2…) sections using grade data.
const buildGradeSegments = (series) => {
  const dist_m = series.dist_m;
  const grade  = series.grade;

  // Get valid paired points
  const validIdx = [];
  for (let i = 0; i < dist_m.length; i++) {
    if (!Number.isNaN(dist_m[i]) && !Number.isNaN(grade[i])) validIdx.push(i);
  }
  if (validIdx.length < 10) return [];

  const d_raw = validIdx.map(i => dist_m[i]);
  const g_raw = validIdx.map(i => grade[i]);
  const d_min = d_raw[0], d_max = d_raw[d_raw.length - 1];

  // Build distance grid and interpolate grade onto it
  const gridLen = Math.floor((d_max - d_min) / GRID_STEP_M) + 1;
  const d_grid = Array.from({length: gridLen}, (_, i) => d_min + i * GRID_STEP_M);
  const g_grid = d_grid.map(d => {
    // Linear interpolation
    let lo = 0, hi = d_raw.length - 1;
    if (d <= d_raw[lo]) return g_raw[lo];
    if (d >= d_raw[hi]) return g_raw[hi];
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (d_raw[mid] <= d) lo = mid; else hi = mid;
    }
    const t = (d - d_raw[lo]) / (d_raw[hi] - d_raw[lo]);
    return g_raw[lo] + t * (g_raw[hi] - g_raw[lo]);
  });

  // Classify: +1 ascent, -1 descent, 0 flat
  const lbl = g_grid.map(g => g > GRADE_THRESH ? 1 : g < -GRADE_THRESH ? -1 : 0);

  // Find consecutive non-zero runs
  const findRuns = (arr) => {
    const runs = [];
    let i = 0;
    while (i < arr.length) {
      if (arr[i] !== 0) {
        const dir = arr[i];
        let j = i;
        while (j < arr.length && arr[j] === dir) j++;
        runs.push([dir, i, j - 1]);
        i = j;
      } else { i++; }
    }
    return runs;
  };

  // Merge same-direction runs with flat gap <= MERGE_GAP_MI
  const mergeRuns = (runs) => {
    if (!runs.length) return runs;
    const MERGE_M = MERGE_GAP_MI * M_PER_MI;
    const merged = [runs[0].slice()];
    for (let k = 1; k < runs.length; k++) {
      const [dir, s, e] = runs[k];
      const prev = merged[merged.length - 1];
      const gap = d_grid[s] - d_grid[prev[2]];
      if (dir === prev[0] && gap <= MERGE_M) { prev[2] = e; }
      else { merged.push([dir, s, e]); }
    }
    return merged;
  };

  // Trim flat tails from both ends of a run
  const trimRun = (dir, s, e) => {
    while (s <= e && Math.abs(g_grid[s]) <= FLAT_THRESH) s++;
    while (e >= s && Math.abs(g_grid[e]) <= FLAT_THRESH) e--;
    return [s, e];
  };

  // Grade-tiered minimum section length: steeper pitches survive shorter.
  // Mirrors Python MIN_SECTION_MI_BY_GRADE table.
  const minSectionM = (s, e) => {
    const pts = g_grid.slice(s, e + 1);
    const avgAbsGrade = pts.reduce((sum, g) => sum + Math.abs(g), 0) / pts.length;
    for (const [thresh, minMi] of MIN_SECTION_MI_BY_GRADE) {
      if (avgAbsGrade >= thresh) return minMi * M_PER_MI;
    }
    return 0.30 * M_PER_MI; // fallback (shouldn't reach here)
  };

  const filterLen = (runs) => {
    return runs.filter(([, s, e]) => d_grid[e] - d_grid[s] >= minSectionM(s, e));
  };

  let runs = findRuns(lbl);
  runs = mergeRuns(runs);
  const trimmed = runs
    .map(([dir, s, e]) => { const [s2, e2] = trimRun(dir, s, e); return [dir, s2, e2]; })
    .filter(([, s, e]) => s < e);
  runs = filterLen(trimmed);
  runs = mergeRuns(runs);
  runs = filterLen(runs);
  runs.sort((a, b) => d_grid[a[1]] - d_grid[b[1]]);

  // --- Split each run into grade-band sub-sections ---
  // Band classifier: which of the 4 bands does |grade| fall into?
  const bandOf = (absGrade) => {
    for (let i = 0; i < GRADE_BAND_BOUNDS.length; i++) {
      if (absGrade < GRADE_BAND_BOUNDS[i]) return i;
    }
    return GRADE_BAND_BOUNDS.length; // band 3 = >20%
  };

  const MIN_SUB_M        = GRADE_BAND_MIN_SUB_MI * M_PER_MI;
  const MIN_SUB_M_STRONG = GRADE_BAND_MIN_SUB_MI_STRONG * M_PER_MI;
  const smoothSamples    = Math.max(3, Math.round(GRADE_BAND_SMOOTH_M / GRID_STEP_M));

  const splitByBand = (dir, s, e) => {
    if (e - s < 2) return [[dir, s, e]];

    // 1. Smooth grade within section using box kernel of smoothSamples width
    const seg = g_grid.slice(s, e + 1);
    const w = Math.min(smoothSamples, seg.length);
    const smoothed = seg.slice();
    if (w >= 3) {
      for (let i = 0; i < seg.length; i++) {
        const half = Math.floor(w / 2);
        const lo2 = Math.max(0, i - half);
        const hi2 = Math.min(seg.length - 1, i + half);
        let sum = 0;
        for (let j = lo2; j <= hi2; j++) sum += seg[j];
        smoothed[i] = sum / (hi2 - lo2 + 1);
      }
    }

    // 2. Classify each point into a band
    const bands = smoothed.map(g => bandOf(Math.abs(g)));

    // 3. Find raw band runs
    const subRuns = []; // [band, globalS, globalE]
    let i = 0;
    while (i < bands.length) {
      const b = bands[i];
      let j = i;
      while (j < bands.length && bands[j] === b) j++;
      subRuns.push([b, s + i, s + j - 1]);
      i = j;
    }

    const runLenM = (r) => d_grid[r[2]] - d_grid[r[1]];

    // 4. Identify dominant (longest) band
    let dominantBand = subRuns[0][0];
    let maxLen = 0;
    for (const r of subRuns) {
      const l = runLenM(r);
      if (l > maxLen) { maxLen = l; dominantBand = r[0]; }
    }

    const minLenFor = (band) =>
      Math.abs(band - dominantBand) >= 2 ? MIN_SUB_M_STRONG : MIN_SUB_M;

    // 5. Edge trim: drop too-short edge runs that are 2+ bands from dominant
    while (subRuns.length > 1) {
      const r = subRuns[0];
      if (runLenM(r) < minLenFor(r[0]) && Math.abs(r[0] - dominantBand) >= 2)
        subRuns.shift();
      else break;
    }
    while (subRuns.length > 1) {
      const r = subRuns[subRuns.length - 1];
      if (runLenM(r) < minLenFor(r[0]) && Math.abs(r[0] - dominantBand) >= 2)
        subRuns.pop();
      else break;
    }

    // 6. Absorb short interior runs into longer neighbor (smallest ratio first)
    let changed = true;
    while (changed && subRuns.length > 1) {
      changed = false;
      let shortestK = -1, shortestRatio = 1.0;
      for (let k = 0; k < subRuns.length; k++) {
        const ml = minLenFor(subRuns[k][0]);
        const ratio = ml > 0 ? runLenM(subRuns[k]) / ml : 1.0;
        if (ratio < 1.0 && ratio < shortestRatio) {
          shortestRatio = ratio; shortestK = k;
        }
      }
      if (shortestK === -1) break;
      const k = shortestK;
      const left  = k > 0 ? subRuns[k-1] : null;
      const right = k < subRuns.length - 1 ? subRuns[k+1] : null;
      let chosen;
      if (!left && !right) break;
      if (!left)  chosen = 'right';
      else if (!right) chosen = 'left';
      else chosen = runLenM(left) >= runLenM(right) ? 'left' : 'right';
      if (chosen === 'left') {
        subRuns[k-1][2] = subRuns[k][2];
        subRuns.splice(k, 1);
      } else {
        subRuns[k+1][1] = subRuns[k][1];
        subRuns.splice(k, 1);
      }
      changed = true;
    }

    // 7. Re-merge adjacent same-band runs
    const merged = [];
    for (const sr of subRuns) {
      if (merged.length && merged[merged.length-1][0] === sr[0])
        merged[merged.length-1][2] = sr[2];
      else
        merged.push([sr[0], sr[1], sr[2]]);
    }

    return merged.map(([, ss, ee]) => [dir, ss, ee]);
  };

  // Apply band splitting to every run
  const splitRuns = [];
  for (const [dir, s, e] of runs) {
    splitByBand(dir, s, e).forEach(r => splitRuns.push(r));
  }
  runs = splitRuns;
  runs.sort((a, b) => d_grid[a[1]] - d_grid[b[1]]);

  // --- Build output segments with hierarchical labels: A1.1, A1.2, D1.1 … ---
  let aBlock = 0, dBlock = 0, aSub = 0, dSub = 0, lastDir = null;
  const segments = [];
  for (const [dir, s, e] of runs) {
    const dStart = d_grid[s], dEnd = d_grid[e];
    const mask = new Uint8Array(dist_m.length);
    let anyHit = false;
    for (let i = 0; i < dist_m.length; i++) {
      if (dist_m[i] >= dStart && dist_m[i] <= dEnd) { mask[i] = 1; anyHit = true; }
    }
    if (!anyHit) continue;

    let label;
    if (dir === 1) { // ascent
      if (lastDir !== 1) { aBlock++; aSub = 0; }
      aSub++;
      label = `A${aBlock}.${aSub}`;
    } else {          // descent
      if (lastDir !== -1) { dBlock++; dSub = 0; }
      dSub++;
      label = `D${dBlock}.${dSub}`;
    }
    lastDir = dir;

    const isAscent = dir === 1;
    const seg = analyzeMask(series, mask, label, true, !isAscent); // cadKeepUpper=false for ascent
    if (seg) {
      seg.direction    = dir === 1 ? 'ascent' : 'descent';
      seg.dist_start_m = dStart;
      seg.dist_end_m   = dEnd;
      segments.push(seg);
    }
  }
  return segments;
};

// Parse a FIT file ArrayBuffer and return the analysis structure.
const analyzeFitBuffer = (buf) => new Promise((resolve, reject) => {
  const parser = new window.FitParser({
    force: true,
    speedUnit: 'm/s',
    lengthUnit: 'm',
    elapsedRecordField: true,
    mode: 'list',
  });
  let data;
  try {
    if (typeof window.Buffer !== 'undefined') {
      data = window.Buffer.from(buf);
    } else {
      data = new Uint8Array(buf);
    }
  } catch (e) {
    data = new Uint8Array(buf);
  }
  parser.parse(data, (error, parsed) => {
    if (error) { reject(new Error(typeof error === 'string' ? error : (error.message || 'Parse failed'))); return; }
    try {
      const allRecords = parsed.records || [];
      if (!allRecords.length) { reject(new Error('No record data in this FIT file.')); return; }

      // Filter to active-lap records only (excludes warm-up / cool-down)
      const laps    = parsed.laps || [];
      const windows = activeWindows(laps);
      const records = filterToActive(allRecords, windows);
      if (!records.length) { reject(new Error('No active-lap records found.')); return; }

      const series = buildSeries(records);
      if (!series) { reject(new Error('Could not build time series.')); return; }

      // Activity metadata from sessions/file_id
      const sessions   = parsed.sessions   || [];
      const activities = parsed.activities || [];
      const fileIdArr  = parsed.file_ids   || parsed.fileIds || [];
      const firstSession  = sessions[0]  || {};
      const firstActivity = activities[0] || {};
      const firstFileId   = fileIdArr[0]  || {};

      const startTime = firstSession.start_time
        || firstActivity.timestamp
        || firstFileId.time_created
        || records[0].timestamp
        || null;
      const sport = firstSession.sport || firstActivity.sport || firstFileId.type || null;

      const gradeSegs = buildGradeSegments(series);
      resolve({
        meta: {
          start_time: startTime ? new Date(startTime).toISOString() : null,
          sport: sport ? String(sport) : null,
          laps_total: laps.length,
          laps_active: windows.length,
        },
        summary:           buildSummary(series),
        ascent_summary:    buildDirectionSummary(series, gradeSegs, 'ascent'),
        descent_summary:   buildDirectionSummary(series, gradeSegs, 'descent'),
        segments_10min:    buildTimeSegments(series),
        segments_by_mile:  buildMileSegments(series),
        segments_grade:    gradeSegs,
        elevation_profile: buildElevationProfile(series),
      });
    } catch (e) {
      reject(e);
    }
  });
});

// ── IndexedDB persistence ─────────────────────────────────────
const DB_NAME = 'wr50k-analysis';
const STORE  = 'workouts';

const openDB = () => new Promise((resolve, reject) => {
  const req = indexedDB.open(DB_NAME, 1);
  req.onerror = () => reject(req.error);
  req.onupgradeneeded = () => {
    const db = req.result;
    if (!db.objectStoreNames.contains(STORE)) {
      const store = db.createObjectStore(STORE, { keyPath: 'id' });
      store.createIndex('start_time', 'meta.start_time', { unique: false });
    }
  };
  req.onsuccess = () => resolve(req.result);
});

const idbSave = async (analysis, filename) => {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const record = {
      id: crypto.randomUUID(),
      filename: filename || 'workout.fit',
      saved_at: new Date().toISOString(),
      ...analysis,
    };
    tx.objectStore(STORE).add(record);
    tx.oncomplete = () => resolve(record);
    tx.onerror = () => reject(tx.error);
  });
};

const idbList = async () => {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => {
      const all = (req.result || []).slice();
      all.sort((a,b) => {
        const ta = a.meta?.start_time || a.saved_at || '';
        const tb = b.meta?.start_time || b.saved_at || '';
        return tb.localeCompare(ta);
      });
      resolve(all);
    };
    req.onerror = () => reject(req.error);
  });
};

const idbDelete = async (id) => {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
};

function formatDateTimeShort(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) +
         ' · ' +
         d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

function formatDurationHMS(sec) {
  if (!sec || Number.isNaN(sec)) return '—';
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m ${String(s).padStart(2,'0')}s`;
}

function ElevationGraph({profile}) {
  if (!profile || profile.length < 2) return null;

  const W = 340, H = 120;
  const PAD = {top: 10, right: 10, bottom: 24, left: 44};
  const gW = W - PAD.left - PAD.right;
  const gH = H - PAD.top - PAD.bottom;

  const xs = profile.map(p => p[0]);
  const ys = profile.map(p => p[1]);
  const xMin = xs[0], xMax = xs[xs.length - 1];
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  const yRange = yMax - yMin || 1;

  const toX = d => PAD.left + ((d - xMin) / (xMax - xMin)) * gW;
  const toY = a => PAD.top + (1 - (a - yMin) / yRange) * gH;

  // Build SVG path
  const pts = profile.map(([d, a]) => `${toX(d).toFixed(1)},${toY(a).toFixed(1)}`);
  const linePath = 'M' + pts.join('L');
  // Fill area
  const fillPath = linePath +
    `L${toX(xMax).toFixed(1)},${(PAD.top + gH).toFixed(1)}` +
    `L${toX(xMin).toFixed(1)},${(PAD.top + gH).toFixed(1)}Z`;

  // Y axis ticks
  const yTicks = 3;
  const yTickVals = Array.from({length: yTicks}, (_, i) =>
    Math.round(yMin + (i / (yTicks - 1)) * yRange)
  );

  // X axis ticks — every whole mile
  const maxMile = Math.floor(xMax);
  const xTickVals = Array.from({length: maxMile + 1}, (_, i) => i);

  return (
    <div style={{
      background: A.surface, borderRadius: 16, border: `1px solid ${A.border}`,
      overflow: 'hidden',
    }}>
      <div style={{
        padding: '10px 14px 6px', borderBottom: `1px solid ${A.border}`,
        fontFamily: MONO, fontSize: 10, letterSpacing: 1.6, fontWeight: 700, color: A.textDim,
      }}>
        ELEVATION PROFILE
      </div>
      <div style={{padding: '10px 14px 12px', overflowX: 'auto'}}>
        <svg
          viewBox={`0 0 ${W} ${H}`}
          style={{width: '100%', maxWidth: W, display: 'block'}}
          preserveAspectRatio="xMidYMid meet"
        >
          {/* Grid lines */}
          {yTickVals.map((v, i) => (
            <line
              key={i}
              x1={PAD.left} y1={toY(v).toFixed(1)}
              x2={PAD.left + gW} y2={toY(v).toFixed(1)}
              stroke="rgba(255,255,255,0.06)" strokeWidth="1"
            />
          ))}

          {/* Fill area */}
          <path d={fillPath} fill="rgba(255,90,60,0.12)" />

          {/* Line */}
          <path d={linePath} fill="none" stroke="#ff5a3c" strokeWidth="1.5" strokeLinejoin="round" />

          {/* Y axis ticks + labels */}
          {yTickVals.map((v, i) => (
            <g key={i}>
              <line
                x1={PAD.left - 3} y1={toY(v).toFixed(1)}
                x2={PAD.left} y2={toY(v).toFixed(1)}
                stroke="rgba(255,255,255,0.2)" strokeWidth="1"
              />
              <text
                x={PAD.left - 6} y={toY(v)} dominantBaseline="middle" textAnchor="end"
                fontSize="8" fill="rgba(255,255,255,0.38)" fontFamily="monospace"
              >
                {v.toLocaleString()}
              </text>
            </g>
          ))}

          {/* Y axis label */}
          <text
            x={8} y={PAD.top + gH / 2}
            textAnchor="middle" fontSize="7" fill="rgba(255,255,255,0.3)"
            fontFamily="monospace" transform={`rotate(-90, 8, ${PAD.top + gH / 2})`}
          >
            ft
          </text>

          {/* X axis ticks + labels */}
          {xTickVals.map((mi) => {
            if (mi > xMax + 0.05) return null;
            const px = toX(mi);
            return (
              <g key={mi}>
                <line
                  x1={px} y1={PAD.top + gH}
                  x2={px} y2={PAD.top + gH + 3}
                  stroke="rgba(255,255,255,0.2)" strokeWidth="1"
                />
                <text
                  x={px} y={PAD.top + gH + 13}
                  textAnchor="middle" fontSize="8" fill="rgba(255,255,255,0.38)"
                  fontFamily="monospace"
                >
                  {mi}
                </text>
              </g>
            );
          })}

          {/* X axis label */}
          <text
            x={PAD.left + gW / 2} y={H - 2}
            textAnchor="middle" fontSize="7" fill="rgba(255,255,255,0.3)"
            fontFamily="monospace"
          >
            mi
          </text>

          {/* Axes */}
          <line
            x1={PAD.left} y1={PAD.top}
            x2={PAD.left} y2={PAD.top + gH}
            stroke="rgba(255,255,255,0.15)" strokeWidth="1"
          />
          <line
            x1={PAD.left} y1={PAD.top + gH}
            x2={PAD.left + gW} y2={PAD.top + gH}
            stroke="rgba(255,255,255,0.15)" strokeWidth="1"
          />
        </svg>
      </div>
    </div>
  );
}

function AnalysisView({onBack}) {
  const [history, setHistory] = useState([]);
  const [loading, setLoading] = useState(true);
  const [parsing, setParsing] = useState(false);
  const [error, setError] = useState(null);
  const [active, setActive] = useState(null); // currently viewed result
  const fileInputRef = useRef(null);

  const refresh = async () => {
    setLoading(true);
    try {
      const all = await idbList();
      setHistory(all);
    } catch (e) {
      setError('Could not load history: ' + e.message);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { refresh(); }, []);

  const onFile = async (file) => {
    if (!file) return;
    setError(null);
    setParsing(true);
    try {
      const buf = await file.arrayBuffer();
      const analysis = await analyzeFitBuffer(buf);
      const saved = await idbSave(analysis, file.name);
      await refresh();
      setActive(saved);
    } catch (e) {
      setError(e.message || String(e));
    } finally {
      setParsing(false);
      if (fileInputRef.current) fileInputRef.current.value = '';
    }
  };

  const deleteRecord = async (rec) => {
    if (!window.confirm(`Delete "${rec.filename}"?`)) return;
    try {
      await idbDelete(rec.id);
      if (active && active.id === rec.id) setActive(null);
      await refresh();
    } catch (e) {
      setError('Delete failed: ' + e.message);
    }
  };

  return (
    <div id="app-scroll" style={{background: A.bg, height: '100vh', overflowY: 'auto'}}>
      <div style={{
        position: 'sticky', top: 0, zIndex: 10, background: A.bg,
        borderBottom: `1px solid ${A.border}`,
        padding: '14px 16px', display: 'flex', alignItems: 'center', gap: 10,
      }}>
        <button onClick={onBack} style={{
          height: 36, padding: '0 12px', borderRadius: 10, background: A.surface2,
          border: `1px solid ${A.border}`, display: 'flex', alignItems: 'center',
          gap: 6, cursor: 'pointer', color: A.text, fontFamily: MONO,
          fontSize: 10, letterSpacing: 1.4, fontWeight: 700,
          WebkitTapHighlightColor: 'transparent',
        }}>
          <Icon name="back" size={14} color={A.text}/>
          TODAY
        </button>
        <div style={{flex: 1}}/>
        <div style={{fontSize: 10, color: A.textDim, fontFamily: MONO, letterSpacing: 1.4, fontWeight: 700}}>ANALYSIS</div>
      </div>

      <div style={{padding: 16, display: 'flex', flexDirection: 'column', gap: 14}}>
        {active ? (
          <AnalysisResultDetail analysis={active} onBack={() => setActive(null)}/>
        ) : (
          <React.Fragment>
            {/* Upload card */}
            <div style={{
              background: A.surface, borderRadius: 16, border: `1px solid ${A.border}`,
              padding: '16px', display: 'flex', flexDirection: 'column', gap: 10,
            }}>
              <div style={{fontSize: 10, color: A.accent, fontFamily: MONO, letterSpacing: 1.6, fontWeight: 700}}>
                NEW ANALYSIS
              </div>
              <div style={{fontSize: 13, color: A.textDim, lineHeight: 1.5, fontFamily: SANS}}>
                On Garmin Connect, open an activity → gear icon → <span style={{color: A.text, fontWeight: 600}}>Export Original</span>. Pick the .fit file below.
              </div>
              <input
                ref={fileInputRef}
                type="file"
                accept=".fit,application/octet-stream"
                onChange={(e) => onFile(e.target.files && e.target.files[0])}
                style={{display: 'none'}}
              />
              <button
                disabled={parsing}
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                style={{
                  height: 44, borderRadius: 10, background: parsing ? A.surface2 : A.accent,
                  border: 'none', cursor: parsing ? 'wait' : 'pointer',
                  color: parsing ? A.textDim : '#000', fontFamily: MONO,
                  fontSize: 11, letterSpacing: 1.4, fontWeight: 700,
                  WebkitTapHighlightColor: 'transparent', display: 'flex',
                  alignItems: 'center', justifyContent: 'center', gap: 8,
                }}>
                {parsing ? 'PARSING…' : 'PICK .FIT FILE'}
              </button>
              {error && (
                <div style={{
                  fontSize: 12, color: '#ff6b6b', fontFamily: SANS,
                  padding: '8px 10px', background: 'rgba(255,107,107,0.08)',
                  borderRadius: 8, border: '1px solid rgba(255,107,107,0.2)',
                }}>
                  {error}
                </div>
              )}
            </div>

            {/* History */}
            <div style={{display: 'flex', flexDirection: 'column', gap: 8}}>
              <div style={{
                fontSize: 10, color: A.textDim, fontFamily: MONO,
                letterSpacing: 1.6, fontWeight: 700, padding: '4px 4px',
              }}>
                HISTORY
              </div>
              {loading ? (
                <div style={{
                  padding: '20px 16px', textAlign: 'center', color: A.textDim,
                  fontFamily: MONO, fontSize: 11, letterSpacing: 1.2,
                }}>
                  LOADING…
                </div>
              ) : history.length === 0 ? (
                <div style={{
                  background: A.surface, borderRadius: 14, border: `1px dashed ${A.border}`,
                  padding: '24px 16px', textAlign: 'center',
                }}>
                  <div style={{fontSize: 12, color: A.textDim, fontFamily: SANS, lineHeight: 1.5}}>
                    No analyzed workouts yet. Pick a .fit file above to start.
                  </div>
                </div>
              ) : (
                history.map(rec => (
                  <AnalysisHistoryItem
                    key={rec.id}
                    record={rec}
                    onOpen={(r) => setActive(r)}
                    onDelete={deleteRecord}
                  />
                ))
              )}
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

          padding:'16px',display:'flex',flexDirection:'column',gap:14,
          opacity:transitioning?0:1,
          transform:transitioning?'translateY(8px)':'translateY(0)',
          transition:'opacity .14s ease,transform .14s ease',
        }}>
          {isRest && (
            <div style={{padding:'40px 20px',textAlign:'center',background:A.surface,borderRadius:20,border:`1px solid ${A.border}`}}>
              <div style={{fontSize:11,color:A.textDim,fontFamily:MONO,letterSpacing:1.6,marginBottom:6}}>SCHEDULED</div>
              <div style={{fontSize:32,fontWeight:800,color:A.text,fontFamily:DISPLAY,letterSpacing:-1}}>REST</div>
              <div style={{fontSize:13,color:A.textDim,marginTop:6}}>Recovery day. Routines + supplements still apply.</div>
            </div>
          )}

          {filter === 'all' ? (
            // ── ALL tab: minimal focused view ──
            <>
              {allSessions.length > 0 && (
                <>
                  {allSessions.map((s,i) => (
                    <HeroWorkoutMinimal key={i} session={s} kind={s.kind}/>
                  ))}
                </>
              )}
              {day.nutrition && <NutritionCardMinimal nutrition={day.nutrition}/>}
              {allSessions.length > 0 && <DayTimeline day={day} plan={plan}/>}
            </>
          ) : (
            // ── Other tabs: full detail ──
            <>
              {showWorkouts && allSessions.length > 0 && (
                <>
                  {allSessions.map((s, i) => {
                    const isRun = s.kind === 'run';
                    const isStr = s.kind === 'strength';
                    const prePost = isRun ? (
                      <>
                        <PrePostCard block={plan.session_protocols.run.pre_run} kind="pre" label="RUN WARM-UP" accent="#60a5fa"/>
                        <PrePostCard block={plan.session_protocols.run.post_run} kind="post" label="RUN COOLDOWN" accent="#4ade80"/>
                      </>
                    ) : isStr ? (() => {
                      const warmupKey = s.warmup_protocol;
                      const warmupBlock = warmupKey && plan.session_protocols.strength[warmupKey];
                      const warmupLabel = warmupKey === 'pre_upper' ? 'UPPER WARM-UP' : warmupKey === 'pre_lower' ? 'LOWER WARM-UP' : 'STRENGTH PREP';
                      return (
                        <>
                          {warmupBlock && <PrePostCard block={warmupBlock} kind="pre" label={warmupLabel} accent="#60a5fa"/>}
                          <PrePostCard block={plan.session_protocols.strength.post_strength} kind="post" label="MOBILITY" accent="#4ade80"/>
                        </>
                      );
                    })() : null;
                    return (
                      <HeroWorkout
                        key={i}
                        session={s}
                        kind={s.kind}
                        isSecondary={i > 0}
                        fueling={fueling}
                        prePost={prePost}
                        workoutLabel={s.kind === 'run' ? runColor(s.subtype).name : strColor(s.subtype).name}
                      />
                    );
                  })}
                </>
              )}
              {showNutrition && day.nutrition && (
                <>
                  <NutritionCard nutrition={day.nutrition}/>
                  <FuelingTimeline items={day.nutrition.session_fueling}/>
                  <Supplements supplements={plan.supplements} weekNumber={day.week_number}/>
                </>
              )}
              {showRoutines && (
                <DailyRoutines routines={plan.daily_routines} weekNumber={day.week_number}/>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
