<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { 
    font-family: -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  #root { min-height: 100%; }
  ::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }
  @keyframes wr-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    @keyframes wr-spin { to { transform: none; } }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ── Design tokens ─────────────────────────────────────────────
const A = {
  bg: '#000000',
  surface: '#0e0e10',
  surface2: '#17171a',
  surface3: '#222227',
  border: 'rgba(255,255,255,0.08)',
  borderStrong: 'rgba(255,255,255,0.16)',
  text: '#ffffff',
  textDim: 'rgba(255,255,255,0.62)',
  textFaint: 'rgba(255,255,255,0.38)',
  accent: '#ff5a3c',
};
const SANS = '"Inter", -apple-system, system-ui, sans-serif';
const MONO = '"JetBrains Mono", ui-monospace, monospace';
const DISPLAY = '"Inter", system-ui, sans-serif';

// ── Color maps ────────────────────────────────────────────────
const RUN_COLORS = {
  tempo:       { hue: '#ff5a3c', name: 'TEMPO',       bg: 'rgba(255,90,60,0.12)',   ring: '#ff5a3c' },
  easy:        { hue: '#4ade80', name: 'EASY',        bg: 'rgba(74,222,128,0.12)',  ring: '#4ade80' },
  power_climb: { hue: '#ffb020', name: 'POWER CLIMB', bg: 'rgba(255,176,32,0.12)',  ring: '#ffb020' },
  shakeout:    { hue: '#60a5fa', name: 'SHAKEOUT',    bg: 'rgba(96,165,250,0.12)',  ring: '#60a5fa' },
  long:        { hue: '#c084fc', name: 'LONG',        bg: 'rgba(192,132,252,0.12)', ring: '#c084fc' },
  back_to_back:{ hue: '#f472b6', name: 'BACK-TO-BACK',bg: 'rgba(244,114,182,0.12)', ring: '#f472b6' },
  time_trial:  { hue: '#facc15', name: 'AeT TEST',    bg: 'rgba(250,204,21,0.12)',  ring: '#facc15' },
  race_pace:   { hue: '#f43f5e', name: 'RACE',        bg: 'rgba(244,63,94,0.14)',   ring: '#f43f5e' },
  rest:        { hue: '#71717a', name: 'REST',        bg: 'rgba(113,113,122,0.12)', ring: '#71717a' },
  default:     { hue: '#a3a3a3', name: 'RUN',         bg: 'rgba(163,163,163,0.12)', ring: '#a3a3a3' },
};
const STRENGTH_COLORS = {
  lower:   { hue: '#a78bfa', name: 'LOWER',    bg: 'rgba(167,139,250,0.12)', ring: '#a78bfa' },
  upper:   { hue: '#22d3ee', name: 'UPPER',    bg: 'rgba(34,211,238,0.12)',  ring: '#22d3ee' },
  mobility_session: { hue: '#a3e635', name: 'MOBILITY', bg: 'rgba(163,230,53,0.12)', ring: '#a3e635' },
  default: { hue: '#a78bfa', name: 'STRENGTH', bg: 'rgba(167,139,250,0.12)', ring: '#a78bfa' },
};
// Cross-training (schema v1.7 type "cross"). Swims live in the strength plan.
const CROSS_COLORS = {
  swim:    { hue: '#2dd4bf', name: 'SWIM',     bg: 'rgba(45,212,191,0.12)',  ring: '#2dd4bf' },
  default: { hue: '#2dd4bf', name: 'CROSS',    bg: 'rgba(45,212,191,0.12)',  ring: '#2dd4bf' },
};
const runColor = (s) => RUN_COLORS[s] || RUN_COLORS.default;
const strColor = (s) => STRENGTH_COLORS[s] || STRENGTH_COLORS.default;
const crossColor = (s) => CROSS_COLORS[s] || { ...CROSS_COLORS.default, name: (s||'CROSS').toUpperCase() };
// Discriminates on session.type ("run" | "strength" | "cross") — never on which
// plan file the session came from, since the strength plan also carries swims.
const sessionColor = (s) => s.type === 'run' ? runColor(s.subtype)
  : s.type === 'cross' ? crossColor(s.subtype) : strColor(s.subtype);
const sessionIcon = (s) => s.type === 'cross' ? (s.subtype === 'swim' ? 'swim' : 'heart')
  : s.type === 'strength' ? 'dumbbell'
  : s.subtype === 'power_climb' ? 'mountain'
  : s.subtype === 'race_pace' ? 'flag'
  : s.subtype === 'time_trial' ? 'heart' : 'run';

// Spec 3.4: run (AM) -> cross (swim) -> strength (PM). The strength file lists
// the swim before the lift, and run/strength are separate files, so sort by type
// rather than trusting file order. Array.sort is stable.
const SESSION_ORDER = { run: 0, cross: 1, strength: 2 };
const daySessions = (day) => [
  ...(day?.run?.sessions || []),
  ...(day?.strength?.sessions || []),
].map(s => ({ ...s, kind: s.type || 'run' }))
 .sort((a, b) => (SESSION_ORDER[a.kind] ?? 9) - (SESSION_ORDER[b.kind] ?? 9));
// rest_day is per-plan (a run-plan rest Monday can carry a swim), so the UI
// calls a day rest only when NO plan has a session on it.
const isRestDay = (day) => daySessions(day).length === 0;

// Short chip labels for nutrition day_type ids (nutrition rev 2.1). Unknown ids
// fall back to the first word of the label, so a new day_type still renders.
const NUTRITION_TYPE_LABEL = {
  rest_day_swim: 'SWIM DAY', strength_only_swim: 'SWIM + LIFT', easy_run_upper_swim: 'TRIPLE',
  rest_day: 'REST', strength_only: 'LIFT', aet_test_day: 'AeT TEST',
  climb_lower_strength: 'CLIMB', easy_run_lower_strength: 'DOUBLE', easy_run_upper_strength: 'DOUBLE',
  easy_run_only: 'EASY', medium_long_run: 'MED-LONG', long_run: 'LONG', race_or_rehearsal: 'RACE',
};
const nutritionChip = (n) => n?.date_override_applied ? 'KEY DAY'
  : NUTRITION_TYPE_LABEL[n?.day_type_id] || (n?.day_type_label?.split(' ')[0] || 'TRAINING').toUpperCase();

// session_fueling entry for one session at one position (pre | during | post).
// An entry with the session's own subtype wins over a subtype-null one, which
// means "any session of that type" (spec 4.4).
const fuelFor = (fueling, session, position) => {
  const list = (fueling || []).filter(f => f.linked_session?.position === position
    && (f.linked_session?.type || 'run') === session.type);
  return list.find(f => f.linked_session.subtype === session.subtype)
      || list.find(f => f.linked_session.subtype == null)
      || null;
};

// hr_anchor labels what hr_cap_bpm is tied to. The cap itself is authoritative
// and precomputed — the app never derives it (spec 2.1).
const HR_ANCHOR_LABEL = {
  AeT: 'cap = AeT', AeT_minus_10pct: 'cap = AeT −10%', AeT_to_LT: 'cap = AeT→LT', AeT_test: 'AeT test',
};

// Strength cooldown matches the warm-up (spec 3.5).
const STRENGTH_COOLDOWN = { pre_lower: 'post_lower', pre_upper: 'post_upper' };

const PHASE_STYLE = {
  Base:      { label: 'BASE',    hue: '#4ade80' },
  Build:     { label: 'BUILD',   hue: '#ff5a3c' },
  Peak:      { label: 'PEAK',    hue: '#ffb020' },
  Taper_1:   { label: 'TAPER',   hue: '#60a5fa' },
  Taper_2:   { label: 'TAPER',   hue: '#60a5fa' },
  Race_week: { label: 'RACE WK', hue: '#c084fc' },
};
const phaseStyle = (p) => PHASE_STYLE[p] || { label: (p||'PHASE').toUpperCase(), hue: A.textDim };

// ── Helpers ───────────────────────────────────────────────────
const formatDayLong = (iso) => new Date(iso+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
const dayShort = (iso) => new Date(iso+'T00:00:00').toLocaleDateString('en-US',{weekday:'short'}).slice(0,3).toUpperCase();
const dayNum = (iso) => new Date(iso+'T00:00:00').getDate();
// Local calendar date as YYYY-MM-DD. toISOString() alone is UTC, which rolls
// over to tomorrow during the evening in western timezones.
const todayIso = () => {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
};
// "1-29", "18", or a comma list of either ("1-2,18").
const weekActive = (rangeStr, week) => {
  if (!rangeStr) return true;
  return String(rangeStr).split(',').some(part => {
    const [lo, hi] = part.trim().split('-').map(Number);
    return week >= lo && week <= (hi || lo);
  });
};
// Scrolls an element to just under the sticky day header inside #app-scroll.
const scrollUnderHeader = (el, extra = 12) => {
  const sc = document.getElementById('app-scroll');
  if (!sc || !el) return;
  const headerH = document.getElementById('day-header')?.offsetHeight || 0;
  const top = sc.scrollTop + el.getBoundingClientRect().top - sc.getBoundingClientRect().top - headerH - extra;
  sc.scrollTo({top: Math.max(0, top), behavior:'smooth'});
};
const resolveToday = (plan) => {
  const dates = Object.keys(plan.days).sort();
  const today = todayIso();
  if (plan.days[today]) return today;
  let best = dates[0], bestDiff = Infinity;
  for (const d of dates) {
    const diff = Math.abs(new Date(d) - new Date(today));
    if (diff < bestDiff) { bestDiff = diff; best = d; }
  }
  return best;
};

// ── SVG Icons ─────────────────────────────────────────────────
function Icon({name, size=16, color='currentColor', stroke=2}) {
  const s = {width:size,height:size,fill:'none',stroke:color,strokeWidth:stroke,strokeLinecap:'round',strokeLinejoin:'round',display:'block',flexShrink:0};
  switch(name) {
    case 'run': return <svg {...s} viewBox="0 0 24 24"><circle cx="13" cy="4" r="2"/><path d="M4 22l3-7 4-2-2-4 4-2 4 5h3"/><path d="M9 13l2 5"/></svg>;
    case 'mountain': return <svg {...s} viewBox="0 0 24 24"><path d="M2 20l6-12 4 7 3-5 7 10z"/></svg>;
    case 'dumbbell': return <svg {...s} viewBox="0 0 24 24"><path d="M2 9v6M5 7v10M19 7v10M22 9v6M5 12h14"/></svg>;
    case 'pill': return <svg {...s} viewBox="0 0 24 24"><rect x="2" y="9" width="20" height="6" rx="3"/><path d="M12 9v6"/></svg>;
    case 'stretch': return <svg {...s} viewBox="0 0 24 24"><path d="M3 12c4-6 14-6 18 0M3 12c4 6 14 6 18 0"/></svg>;
    case 'clock': return <svg {...s} viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>;
    case 'down': return <svg {...s} viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>;
    case 'flame': return <svg {...s} viewBox="0 0 24 24"><path d="M12 22c4 0 7-3 7-7 0-4-4-6-3-10-3 1-7 4-7 9 0-2-1-3-2-4-1 2-2 3-2 5 0 4 3 7 7 7z"/></svg>;
    case 'drop': return <svg {...s} viewBox="0 0 24 24"><path d="M12 3l5 7a6 6 0 11-10 0z"/></svg>;
    case 'route': return <svg {...s} viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h6a4 4 0 000-8h-4a4 4 0 010-8h6"/></svg>;
    case 'list': return <svg {...s} viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>;
    case 'back': return <svg {...s} viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>;
    case 'heart': return <svg {...s} viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0112 6a5.5 5.5 0 019.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>;
    case 'analyze': return <svg {...s} viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 5-7"/></svg>;
    case 'swim': return <svg {...s} viewBox="0 0 24 24"><circle cx="16" cy="6" r="2"/><path d="M4 12l5-3 3 3 3-2"/><path d="M2 17c2 1.3 3.3 1.3 5 0s3.3-1.3 5 0 3.3 1.3 5 0 3.3-1.3 5 0"/></svg>;
    case 'flag': return <svg {...s} viewBox="0 0 24 24"><path d="M5 22V3"/><path d="M5 4h13l-3 4 3 4H5"/></svg>;
    default: return null;
  }
}

// ── Day strip ─────────────────────────────────────────────────
function DayStrip({dates, selected, onSelect, plan}) {
  const ref = useRef(null);
  const today = todayIso();
  useEffect(() => {
    if (!ref.current) return;
    const el = ref.current.querySelector(`[data-day="${selected}"]`);
    if (el) el.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
  }, [selected]);
  return (
    <div ref={ref} style={{display:'flex',gap:8,overflowX:'auto',padding:'4px 16px 12px',scrollbarWidth:'none'}}>
      {dates.map(d => {
        const day = plan.days[d];
        const isSel = d === selected;
        const isToday = d === today;
        const dots = daySessions(day).map(s => sessionColor(s).hue);
        if (!dots.length) dots.push(A.textFaint);
        return (
          <button key={d} data-day={d} onClick={()=>onSelect(d)} style={{
            flex:'0 0 auto', minWidth:54, height:72, padding:'8px 6px',
            borderRadius:14, border:`1.5px solid ${isSel ? A.text : A.border}`,
            background: isSel ? A.surface2 : isToday ? 'rgba(255,255,255,0.07)' : 'transparent',
            color: A.text, cursor:'pointer', fontFamily:SANS,
            display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'space-between',
            transition:'all .18s ease', WebkitTapHighlightColor:'transparent',
          }}>
            <span style={{fontSize:9,letterSpacing:1.2,fontWeight:600,color:isSel?A.text:A.textFaint,fontFamily:MONO}}>
              {dayShort(d)}
            </span>
            <span style={{fontSize:20,fontWeight:700,fontFamily:DISPLAY,lineHeight:1,color:isSel?A.text:A.textDim}}>
              {dayNum(d)}
            </span>
            <span style={{display:'flex',gap:3,alignItems:'center',height:6}}>
              {dots.map((c,i) => <span key={i} style={{width:6,height:6,borderRadius:3,background:c}}/>)}
            </span>
          </button>
        );
      })}
    </div>
  );
}

// ── Filter chips ──────────────────────────────────────────────
function FilterChips({filter, setFilter}) {
  const opts = [{id:'all',label:'Focus'},{id:'workouts',label:'Workouts'},{id:'nutrition',label:'Nutrition'},{id:'routines',label:'Routines'}];
  return (
    <div style={{display:'flex',gap:6,padding:'0 16px 14px',overflowX:'auto',scrollbarWidth:'none'}}>
      {opts.map(o => {
        const isSel = o.id === filter;
        return (
          <button key={o.id} onClick={()=>setFilter(o.id)} style={{
            padding:'7px 14px', borderRadius:100,
            border:`1px solid ${isSel ? A.text : A.border}`,
            background: isSel ? A.text : 'transparent',
            color: isSel ? A.bg : A.textDim,
            fontSize:12, fontWeight:600, fontFamily:SANS, letterSpacing:0.2,
            cursor:'pointer', whiteSpace:'nowrap', flexShrink:0,
            transition:'all .15s', WebkitTapHighlightColor:'transparent',
          }}>{o.label}</button>
        );
      })}
    </div>
  );
}

// ── Big stat ──────────────────────────────────────────────────
function BigStat({label, value, unit, color, mono, size}) {
  return (
    <div>
      <div style={{fontSize:9,color:A.textFaint,fontFamily:MONO,letterSpacing:1.2,fontWeight:700,marginBottom:4}}>{label}</div>
      <div style={{display:'flex',alignItems:'baseline',gap:3}}>
        <span style={{fontSize:size||22,fontWeight:800,color:color||A.text,fontFamily:mono?MONO:DISPLAY,letterSpacing:-0.4,lineHeight:1}}>{value}</span>
        {unit && <span style={{fontSize:11,color:A.textDim,fontFamily:MONO}}>{unit}</span>}
      </div>
    </div>
  );
}

// ── Session stat row ──────────────────────────────────────────
// Shared by the hero card (collapsed header / top of expanded) and the
// All-tab minimal card, so both always show the same set of stats.
const terrainLabel = t => String(t).replace(/_or_/g, '/').replace(/_/g, ' ')
  .replace(/(^|[\s/+])([a-z])/g, (_, sep, c) => sep + c.toUpperCase());

function SessionStats({session, kind, expanded}) {
  const stats = [];
  if (kind === 'run') {
    // Walks carry distance_mi 0.0 by convention — show duration only.
    if (session.distance_mi > 0) stats.push({label:'DISTANCE', value:session.distance_mi, unit:'mi'});
    // race_pace sessions have no duration_min.
    if (session.duration_min != null) stats.push({label:'DURATION', value:session.duration_min, unit:'min'});
    if (session.elevation_gain_ft > 0) stats.push({label:'VERT', value:session.elevation_gain_ft.toLocaleString(), unit:'ft'});
  } else if (kind === 'cross') {
    if (session.duration_min != null) stats.push({label:'DURATION', value:session.duration_min, unit:'min'});
    if (session.distance_m > 0) stats.push({label:'DISTANCE', value:session.distance_m.toLocaleString(), unit:'m'});
    if (session.intensity) stats.push({label:'EFFORT', value:session.intensity.toUpperCase(), mono:true, size:16});
  } else {
    if (session.duration_min != null) stats.push({label:'DURATION', value:session.duration_min, unit:'min'});
    stats.push({label:'EXERCISES', value:(session.exercises||[]).length, unit:'moves'});
  }
  // Second row — expanded cards only. terrain_intent governs and terrain is
  // advisory/provenance (run_plan rev 1.9), so both are shown together. An
  // ABSENT terrain_intent means UNCLASSIFIED, never "free" — do not default it.
  const detail = [];
  if (expanded && kind === 'run' && (session.terrain || session.terrain_intent)) {
    // Shrink long values ("Road/Fireroad", "Relief+Grade") to fit a 2-up column at 390px
    const sized = v => v.length<=9 ? 18 : 14;
    if (session.terrain) {
      const t = terrainLabel(session.terrain);
      detail.push({label:'TERRAIN', value:t, mono:true, size:sized(t)});
    }
    const ti = session.terrain_intent ? terrainLabel(session.terrain_intent) : 'Unclassified';
    detail.push({label:'TERRAIN INTENT', value:ti, mono:true, size:sized(ti),
                 color:session.terrain_intent ? undefined : A.textDim});
  }
  if (!stats.length && !detail.length) return null;
  return (
    <>
      {stats.length > 0 && (
        <div style={{display:'grid',gridTemplateColumns:`repeat(${Math.max(stats.length,3)},1fr)`,padding:`0 18px ${detail.length?12:18}px`,gap:12}}>
          {stats.map(s => <BigStat key={s.label} {...s}/>)}
        </div>
      )}
      {detail.length > 0 && (
        <div style={{display:'grid',gridTemplateColumns:`repeat(${detail.length},1fr)`,padding:'0 18px 18px',gap:12}}>
          {detail.map(s => <BigStat key={s.label} {...s}/>)}
        </div>
      )}
    </>
  );
}

// ── Hero Workout Card ─────────────────────────────────────────
// ── Workout fueling collapsible ───────────────────────────────
const FUEL_POS = {
  pre:    { label: 'PRE',    color: '#60a5fa' },
  during: { label: 'DURING', color: '#ffb020' },
  post:   { label: 'POST',   color: '#4ade80' },
};
const FUEL_POSITIONS = ['pre', 'during', 'post'];

function WorkoutFueling({fuel, workoutLabel}) {
  const [open, setOpen] = useState(false);
  const windows = FUEL_POSITIONS.filter(p => fuel[p]);
  if (!windows.length) return null;
  return (
    <div style={{background:A.surface2,borderRadius:14,overflow:'hidden',border:`1px solid ${A.border}`,marginBottom:8}}>
      <button onClick={()=>setOpen(o=>!o)} style={{
        width:'100%',padding:'12px 14px',background:'transparent',border:'none',
        display:'flex',alignItems:'center',gap:10,cursor:'pointer',
        WebkitTapHighlightColor:'transparent',
      }}>
        <div style={{width:28,height:28,borderRadius:7,background:'rgba(255,176,32,0.14)',border:'1px solid rgba(255,176,32,0.3)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          <Icon name="flame" size={13} color="#ffb020"/>
        </div>
        <div style={{flex:1,minWidth:0,textAlign:'left'}}>
          <div style={{fontSize:9,color:'#ffb020',fontFamily:MONO,letterSpacing:1.2,fontWeight:700}}>{workoutLabel} FUELING</div>
          <div style={{fontSize:12,color:A.textDim}}>{windows.map(p => FUEL_POS[p].label.toLowerCase()).join(' · ')}</div>
        </div>
        <span style={{transform:open?'rotate(180deg)':'rotate(0)',transition:'transform .2s'}}>
          <Icon name="down" size={14} color={A.textFaint}/>
        </span>
      </button>
      {open && (
        <div style={{borderTop:`1px solid ${A.border}`,padding:'10px 14px 14px',display:'flex',flexDirection:'column',gap:8}}>
          {windows.map(p => <FuelChip key={p} fuel={fuel[p]} label={FUEL_POS[p].label} color={FUEL_POS[p].color}/>)}
        </div>
      )}
    </div>
  );
}

function NoteBox({label, color, italic, children}) {
  return (
    <div style={{margin:'0 18px 14px',padding:'10px 12px',background:'rgba(255,255,255,0.03)',borderRadius:8,border:`1px solid ${A.border}`}}>
      <div style={{fontSize:9,color:color||A.textDim,fontFamily:MONO,letterSpacing:1.2,fontWeight:700,marginBottom:4}}>{label}</div>
      <div style={{fontSize:12,color:italic?A.text:A.textDim,lineHeight:italic?1.5:1.6,fontFamily:SANS,fontStyle:italic?'italic':'normal'}}>{children}</div>
    </div>
  );
}

// aet_gate (run_plan rev 2.0): the top-level fields are ALWAYS the active
// version. if_pass is informational and stays collapsed — a plan patch copies it
// over the top-level fields and sets active_version, the app never swaps (2.2).
function AetGate({gate, gateBpm}) {
  const [open, setOpen] = useState(false);
  if (!gate?.if_pass) return null;
  const promoted = gate.active_version === 'if_pass';
  const alt = gate.if_pass;
  const altColor = runColor(alt.subtype);
  const hue = promoted ? '#4ade80' : A.textDim;
  const threshold = gateBpm ? `AeT ≥ ${gateBpm}` : 'the AeT gate passes';
  return (
    <div style={{margin:'0 18px 14px',background:A.surface2,borderRadius:10,border:`1px dashed ${A.borderStrong}`,overflow:'hidden'}}>
      <button onClick={()=>setOpen(o=>!o)} style={{
        width:'100%',padding:'10px 12px',background:'transparent',border:'none',textAlign:'left',
        display:'flex',alignItems:'center',gap:8,cursor:'pointer',WebkitTapHighlightColor:'transparent',
      }}>
        <span style={{fontSize:9,padding:'2px 6px',borderRadius:3,border:`1px solid ${hue}`,color:hue,fontFamily:MONO,fontWeight:700,letterSpacing:1.2,flexShrink:0}}>
          {promoted ? 'GATE PASSED' : 'GATED'}
        </span>
        <span style={{flex:1,minWidth:0,fontSize:11,color:A.textDim,fontFamily:SANS,lineHeight:1.35}}>
          {promoted
            ? 'The AeT-gated version is active.'
            : `Shows the ${alt.hr_zone || altColor.name} version once ${threshold}.`}
        </span>
        <span style={{transform:open?'rotate(180deg)':'rotate(0)',transition:'transform .2s',flexShrink:0}}>
          <Icon name="down" size={12} color={A.textFaint}/>
        </span>
      </button>
      {open && (
        <div style={{borderTop:`1px solid ${A.border}`,padding:'10px 12px',fontSize:12,color:A.textDim,lineHeight:1.5,fontFamily:SANS}}>
          {!promoted && (
            <div style={{marginBottom:10}}>
              <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',marginBottom:4}}>
                <span style={{fontSize:9,padding:'2px 6px',borderRadius:3,background:altColor.bg,color:altColor.hue,fontFamily:MONO,fontWeight:700,letterSpacing:1}}>{altColor.name}</span>
                {alt.hr_cap_bpm != null && <span style={{fontSize:11,fontFamily:MONO,color:A.text}}>≤{alt.hr_cap_bpm} bpm</span>}
                {alt.hr_zone && <span style={{fontSize:10,fontFamily:MONO,color:A.textFaint}}>{alt.hr_zone}</span>}
                {HR_ANCHOR_LABEL[alt.hr_anchor] && <span style={{fontSize:10,fontFamily:MONO,color:A.textFaint}}>· {HR_ANCHOR_LABEL[alt.hr_anchor]}</span>}
              </div>
              {alt.title && <div style={{fontSize:13,color:A.text,fontWeight:600,marginBottom:4}}>{alt.title}</div>}
              {alt.key_cue && <div style={{fontStyle:'italic'}}>{alt.key_cue}</div>}
            </div>
          )}
          {!promoted && gate.default_rationale && <div style={{marginBottom:6}}><span style={{fontFamily:MONO,fontSize:9,color:A.textFaint,letterSpacing:1}}>NOW </span>{gate.default_rationale}</div>}
          {gate.pass_rule && <div><span style={{fontFamily:MONO,fontSize:9,color:A.textFaint,letterSpacing:1}}>RULE </span>{gate.pass_rule}</div>}
        </div>
      )}
    </div>
  );
}

function HeroWorkout({session, kind, isSecondary, fueling, prePost, workoutLabel, focusNonce, onFocusDone, aetGateBpm}) {
  const [collapsed, setCollapsed] = useState(false);
  const rootRef = useRef(null);
  // A focus request from the Focus tab: expand this card and scroll it into view.
  useEffect(() => {
    if (focusNonce == null) return;
    setCollapsed(false);
    // Deferred so the tab switch and the expand have both laid out before we measure.
    const t = setTimeout(() => {
      scrollUnderHeader(rootRef.current);
      onFocusDone && onFocusDone();
    }, 0);
    return () => clearTimeout(t);
  }, [focusNonce]);
  const color = sessionColor(session);
  const fuel = Object.fromEntries(FUEL_POSITIONS.map(p => [p, fuelFor(fueling, session, p)]));
  const label = workoutLabel || color.name;
  const anchor = HR_ANCHOR_LABEL[session.hr_anchor];

  return (
    <div ref={rootRef} style={{background:`color-mix(in srgb, ${color.hue} 6%, ${A.surface})`,borderRadius:20,overflow:'hidden',border:`1px solid color-mix(in srgb, ${color.hue} 20%, ${A.border})`}}>
      <div style={{height:3,background:color.hue}}/>

      {/* Tappable header — always visible, toggles collapse */}
      <button onClick={()=>setCollapsed(c=>!c)} style={{
        width:'100%',padding:'18px 18px 0',background:'transparent',border:'none',
        textAlign:'left',cursor:'pointer',color:A.text,fontFamily:SANS,
        WebkitTapHighlightColor:'transparent',
      }}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
          <span style={{padding:'3px 8px',borderRadius:4,fontSize:10,fontWeight:700,letterSpacing:1.4,color:color.hue,background:color.bg,fontFamily:MONO}}>
            {color.name}
          </span>
          {kind==='run' && session.poles && <span style={{fontSize:10,color:A.textDim,fontFamily:MONO,letterSpacing:1}}>+ POLES</span>}
          {kind==='cross' && session.method && <span style={{fontSize:10,color:A.textDim,fontFamily:MONO,letterSpacing:1}}>{session.method.toUpperCase()}</span>}
          <div style={{flex:1}}/>
          <span style={{transform:collapsed?'rotate(0)':'rotate(180deg)',transition:'transform .2s',display:'flex',alignItems:'center'}}>
            <Icon name="down" size={14} color={A.textFaint}/>
          </span>
        </div>
        <div style={{fontSize:22,fontWeight:700,color:A.text,fontFamily:DISPLAY,letterSpacing:-0.4,lineHeight:1.1,marginBottom:14}}>{session.title}</div>
      </button>

      {/* Stats — core three always visible; terrain row only when expanded */}
      <SessionStats session={session} kind={kind} expanded={!collapsed}/>

      {/* Expanded content */}
      {!collapsed && (
        <>
          {session.hr_cap_bpm != null && (
            <div style={{margin:'0 18px 16px',background:A.surface2,borderRadius:10,padding:'10px 12px',border:`1px solid ${A.border}`}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6,gap:8}}>
                <span style={{fontSize:9,color:A.textFaint,fontFamily:MONO,letterSpacing:1.2,fontWeight:700}}>HR CAP</span>
                <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',justifyContent:'flex-end'}}>
                  {anchor && <span style={{fontSize:9,padding:'2px 6px',borderRadius:3,border:`1px solid ${A.borderStrong}`,color:A.textDim,fontFamily:MONO,letterSpacing:0.6}}>{anchor}</span>}
                  <span style={{fontSize:16,fontWeight:700,color:color.hue,fontFamily:DISPLAY}}>≤{session.hr_cap_bpm}</span>
                  <span style={{fontSize:10,color:A.textDim,fontFamily:MONO}}>bpm</span>
                  {session.hr_zone && <span style={{fontSize:9,padding:'2px 6px',borderRadius:3,background:color.bg,color:color.hue,fontFamily:MONO,fontWeight:700,letterSpacing:1}}>{session.hr_zone}</span>}
                </div>
              </div>
              <div style={{height:4,borderRadius:2,background:A.surface3,overflow:'hidden'}}>
                <div style={{height:'100%',width:'70%',background:`linear-gradient(90deg,${color.hue}88,${color.hue})`,borderRadius:2}}/>
              </div>
            </div>
          )}
          {kind==='cross' && session.hr_cap_bpm == null && (
            <div style={{margin:'0 18px 14px',display:'flex',gap:12,alignItems:'center'}}>
              <div style={{fontSize:9,color:A.textFaint,fontFamily:MONO,letterSpacing:1.2,fontWeight:700}}>HR</div>
              <div style={{fontSize:12,color:A.textDim,fontFamily:MONO}}>No cap — go by feel</div>
            </div>
          )}
          {kind==='run' && session.pace_target && (
            <div style={{margin:'0 18px 16px',display:'flex',gap:12,alignItems:'center'}}>
              <div style={{fontSize:9,color:A.textFaint,fontFamily:MONO,letterSpacing:1.2,fontWeight:700}}>PACE</div>
              <div style={{fontSize:13,color:A.textDim,fontFamily:MONO}}>{session.pace_target.min_per_mi_fast}–{session.pace_target.min_per_mi_slow} /mi</div>

// ── Fuel Chip ─────────────────────────────────────────────────
// "60c 20p 5f · 400mg Na · 500ml" — only the fields that are present and non-zero.
// (A bare {x && ...} would render a literal 0 for zero-valued fields.)
const fuelMacros = (f) => [
  [f.carbs_g && `${f.carbs_g}c`, f.protein_g && `${f.protein_g}p`, f.fat_g && `${f.fat_g}f`].filter(Boolean).join(' '),
  f.sodium_mg ? `${f.sodium_mg}mg Na` : '',
  f.fluid_ml ? `${f.fluid_ml}ml` : '',
].filter(Boolean).join(' · ');

// fueling_schedule items for a "during" window. May be empty (the AeT test is
// water only); items may carry caffeine_mg.
function FuelSchedule({items}) {
  if (!items?.length) return null;
  return (
    <div style={{marginTop:6,display:'flex',flexDirection:'column',gap:3}}>
      {items.map((it,i) => (
        <div key={i} style={{display:'flex',gap:8,alignItems:'baseline',fontSize:11,lineHeight:1.35}}>
          <span style={{fontFamily:MONO,color:'#ffb020',fontWeight:700,flexShrink:0,minWidth:58}}>{it.interval_min != null ? `every ${it.interval_min}′` : '·'}</span>
          <span style={{flex:1,minWidth:0,color:A.text}}>{it.item}</span>
          <span style={{fontFamily:MONO,color:A.textFaint,flexShrink:0,fontSize:10}}>
            {[it.cal ? `${it.cal}kcal` : '', it.sodium_mg ? `${it.sodium_mg}Na` : '', it.caffeine_mg ? `${it.caffeine_mg}mg caf` : ''].filter(Boolean).join(' ')}
          </span>
        </div>
      ))}
    </div>
  );
}

function FuelChip({fuel, label, color}) {
  const macros = fuelMacros(fuel);
  return (
    <div style={{display:'flex',gap:10,alignItems:'flex-start',padding:'8px 10px',borderRadius:8,background:`rgba(255,255,255,0.02)`,border:`1px solid ${A.border}`}}>
      <span style={{fontSize:9,padding:'2px 6px',borderRadius:3,background:`${color}22`,color,fontFamily:MONO,fontWeight:700,letterSpacing:1.2,flexShrink:0,marginTop:1}}>{label}</span>
      <div style={{flex:1,minWidth:0}}>
        {fuel.timing && <div style={{fontSize:11,color:A.textDim,fontFamily:MONO,marginBottom:2}}>{fuel.timing}</div>}
        {(fuel.calories > 0 || macros) && (
          <div style={{display:'flex',gap:8,alignItems:'baseline',marginBottom:4,flexWrap:'wrap'}}>
            {fuel.calories > 0 && <span style={{fontSize:16,fontWeight:700,color:A.text,fontFamily:DISPLAY,letterSpacing:-0.3}}>{fuel.calories}<span style={{fontSize:10,color:A.textDim,marginLeft:2}}>kcal{label === 'DURING' ? '/h' : ''}</span></span>}
            {macros && <span style={{fontSize:10,color:A.textDim,fontFamily:MONO}}>{macros}</span>}
          </div>
        )}
        {fuel.foods?.length > 0 && <div style={{fontSize:12,color:A.text,lineHeight:1.4}}>{fuel.foods.join(' · ')}</div>}
        <FuelSchedule items={fuel.fueling_schedule}/>
        {fuel.notes && <div style={{fontSize:11,color:A.textFaint,fontStyle:'italic',marginTop:4}}>{fuel.notes}</div>}
      </div>
    </div>
  );
}

      <div style={{fontSize:20,fontWeight:700,color:A.text,fontFamily:DISPLAY,letterSpacing:-0.5,lineHeight:1}}>

// ── Fueling Timeline ──────────────────────────────────────────
function FuelingTimeline({items}) {
  const [open, setOpen] = useState(false);
  if (!items?.length) return null;
  const rank = f => (SESSION_ORDER[f.linked_session?.type] ?? 9) * 10 + FUEL_POSITIONS.indexOf(f.linked_session?.position);
  const sorted = [...items].sort((a, b) => rank(a) - rank(b));
  // "during" calories are per hour, so they are not summed into the window total.

// ── Daily Routines ────────────────────────────────────────────
// Routines for one day: active_weeks, then the phase_override for that week.
// An override's modification is prose; a "Monday-Wednesday only" style day
// range in it is honoured, and the text itself is always shown on the row.
// Returns [{routine, override, skip}] in timing order; skip is the reason a
// routine does not apply today (it is shown dimmed, not hidden).
const DOW_IDX = {mon:0,tue:1,wed:2,thu:3,fri:4,sat:5,sun:6};
const DOW_RANGE_RE = /\b(mon|tue|wed|thu|fri|sat|sun)[a-z]*\s*[-–]\s*(mon|tue|wed|thu|fri|sat|sun)[a-z]*\s+only\b/i;
// Spec 3.6: the heel isometrics are skipped on Lower A/B days (the session covers them).
const ROUTINE_SKIP_ON_STRENGTH = { heel_isometrics_evening: 'lower' };
const ROUTINE_TIMING_ORDER = {morning:0, pre_run:1, post_run:2, anytime:3, evening:4};

const routinesForDay = (routines, day) => {
  const week = day.week_number;
  const dow = DOW_IDX[(day.day_of_week || '').slice(0,3).toLowerCase()];
  const sessions = daySessions(day);
  return (routines || [])
    .filter(r => weekActive(r.active_weeks, week))
    .map(r => {
      const override = (r.phase_overrides || []).find(o => weekActive(o.weeks, week)) || null;
      let skip = null;
      const m = override && DOW_RANGE_RE.exec(override.modification || '');
      if (m && dow != null && (dow < DOW_IDX[m[1].toLowerCase()] || dow > DOW_IDX[m[2].toLowerCase()])) {
        skip = override.modification;
      }
      const st = ROUTINE_SKIP_ON_STRENGTH[r.id];
      if (!skip && st && sessions.some(s => s.type === 'strength' && s.subtype === st)) {
        skip = `Skipped today — the ${strColor(st).name.toLowerCase()} strength session covers it.`;
      }
      return {routine: r, override, skip};
    })
    .sort((a, b) => (ROUTINE_TIMING_ORDER[a.routine.timing] ?? 9) - (ROUTINE_TIMING_ORDER[b.routine.timing] ?? 9));
};

function DailyRoutines({routines, day}) {
  const active = routinesForDay(routines, day);
  if (!active.length) return null;
  const totalMin = active.filter(a => !a.skip).reduce((s,a) => s + (a.routine.duration_min||0), 0);
  return (
    <div style={{background:A.surface,borderRadius:20,padding:18,border:`1px solid ${A.border}`}}>

      </div>
      {active.map(a => <RoutineRow key={a.routine.id} routine={a.routine} override={a.override} skip={a.skip} week={day.week_number}/>)}
    </div>
  );
}

// ── Day Timeline ──────────────────────────────────────────────
// Clock times are illustrative anchors for the order of the day
// (run AM -> swim midday -> strength PM), not prescriptions.
const TIMELINE_SLOTS = {
  run:      {pre:'06:30', at:'08:00', post:'09:30', preLabel:'Pre-run fuel',      postLabel:'Post-run recovery'},
  cross:    {pre:'11:30', at:'12:00', post:'13:00', preLabel:'Pre-swim snack',    postLabel:'Post-swim refuel'},
  strength: {pre:'16:00', at:'17:00', post:'18:30', preLabel:'Pre-strength fuel', postLabel:'Post-strength meal'},
};
const ROUTINE_SLOT_TIME = {morning:'06:15', pre_run:'07:45', post_run:'09:45', anytime:'13:30', evening:'21:00'};

function DayTimeline({day, plan}) {
  const items = [];
  const routines = routinesForDay(plan.daily_routines, day).filter(a => !a.skip);
  const byTiming = {};
  for (const {routine} of routines) (byTiming[routine.timing] = byTiming[routine.timing] || []).push(routine);
  for (const [timing, rs] of Object.entries(byTiming)) {
    const totalMin = rs.reduce((s,r) => s + (r.duration_min||0), 0);
    const label = timing === 'anytime' ? rs.map(r => r.title).join(', ') : `${timing[0].toUpperCase()}${timing.slice(1).replace('_',' ')} routines`;
    items.push({time:ROUTINE_SLOT_TIME[timing] || '12:00',kind:'routine',label,dur:totalMin,color:'#4ade80',sub:timing==='anytime'?'ANYTIME':undefined});
  }
  const mornSups = plan.supplements.filter(s => s.timing_slot==='morning' && weekActive(s.active_weeks, day.week_number));
  if (mornSups.length) items.push({time:'07:00',kind:'supp',label:`Morning supplements (${mornSups.length})`,color:'#22d3ee'});
  const fueling = day.nutrition?.session_fueling || [];
  for (const s of daySessions(day)) {
    const slot = TIMELINE_SLOTS[s.kind] || TIMELINE_SLOTS.strength;
    const c = sessionColor(s);
    const pre = fuelFor(fueling, s, 'pre');
    const during = fuelFor(fueling, s, 'during');
    const post = fuelFor(fueling, s, 'post');
    if (pre) items.push({time:slot.pre,kind:'fuel',label:slot.preLabel,sub:(pre.foods||[])[0],color:'#ffb020'});
    items.push({time:slot.at,kind:'session',label:s.title,dur:s.duration_min,color:c.hue,sub:during?.fueling_schedule?.length ? `${c.name} · FUEL EN ROUTE` : c.name});
    if (post) items.push({time:slot.post,kind:'fuel',label:slot.postLabel,sub:(post.foods||[])[0],color:'#ffb020'});
  }
  const eveSups = plan.supplements.filter(s => s.timing_slot==='evening' && weekActive(s.active_weeks, day.week_number));
  if (eveSups.length) items.push({time:'21:30',kind:'supp',label:`Evening: ${eveSups.map(s=>s.name).join(', ')}`,color:'#22d3ee'});
  items.sort((a,b) => a.time.localeCompare(b.time));
  return (
    <div style={{background:A.surface,borderRadius:20,padding:'16px 18px 18px',border:`1px solid ${A.border}`}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
        <span style={{padding:'3px 8px',borderRadius:4,fontSize:10,fontWeight:700,letterSpacing:1.4,color:A.text,background:'rgba(255,255,255,0.06)',fontFamily:MONO}}>DAY TIMELINE</span>
        <div style={{flex:1}}/>
        <Icon name="clock" size={14} color={A.textFaint}/>
      </div>
      <div style={{position:'relative'}}>
        <div style={{position:'absolute',left:38,top:6,bottom:6,width:1,background:A.border}}/>
        {items.map((it,i) => (
          <div key={i} style={{display:'flex',gap:12,alignItems:'flex-start',padding:'6px 0'}}>
            <div style={{width:32,fontSize:10,color:A.textFaint,fontFamily:MONO,letterSpacing:0.5,fontWeight:600,paddingTop:4,textAlign:'right'}}>{it.time}</div>
            <div style={{width:12,height:12,borderRadius:6,marginTop:4,flexShrink:0,background:A.bg,border:`2px solid ${it.color}`,boxShadow:`0 0 0 3px ${A.surface}`}}/>
            <div style={{flex:1,minWidth:0,paddingBottom:4}}>
              <div style={{fontSize:13,color:A.text,fontWeight:600,fontFamily:SANS,lineHeight:1.3}}>
                {it.label}
                {it.dur && <span style={{color:A.textFaint,fontWeight:400,fontFamily:MONO,fontSize:10,marginLeft:6}}>{it.dur}m</span>}
              </div>
              {it.sub && <div style={{fontSize:10,color:it.color,fontFamily:MONO,letterSpacing:0.6,fontWeight:600,marginTop:1}}>{it.sub}</div>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Plan View (Week list) ─────────────────────────────────────
function buildWeeks(plan) {
  const map = {};
  for (const [date, day] of Object.entries(plan.days)) {
    const w = day.week_number;
    if (!map[w]) map[w] = {
      n:w, phase:day.run?.phase||day.strength?.phase||'', start:date, end:date,
      targets:day.run?.weekly_targets||{}, strTargets:day.strength?.weekly_targets||{},
      weekNotes:day.run?.week_notes||'', strWeekNotes:day.strength?.week_notes||'', days:[],
    };
    const m = map[w];
    if (date < m.start) m.start = date;
    if (date > m.end) m.end = date;
    m.days.push(day);
  }
  return Object.values(map).sort((a,b) => a.n - b.n).map(w => ({...w, ...weekChecks(w)}));
}

// Loader assertion (spec 2.5 / 3.2): weekly_targets are DERIVED from the week's
// sessions. mileage_mi / vertical_ft must equal the run-session sums (race_pace
// excluded) within ±0.5 mi / ±50 ft; strength_sessions counts type "strength"
// only; swim_sessions / swim_minutes count cross/swim. A mismatch is flagged on
// the week card — never corrected.
const MILEAGE_TOL_MI = 0.5;
const VERTICAL_TOL_FT = 50;
const EXCLUDED_FROM_SUMS = new Set(['race_pace']);

function weekChecks(week) {
  const sessions = week.days.flatMap(daySessions);
  const runs = sessions.filter(s => s.type === 'run' && !EXCLUDED_FROM_SUMS.has(s.subtype));
  const mi = runs.reduce((t,s) => t + (s.distance_mi||0), 0);
  const ft = runs.reduce((t,s) => t + (s.elevation_gain_ft||0), 0);
  const swims = sessions.filter(s => s.type === 'cross' && s.subtype === 'swim');
  const swimMin = swims.reduce((t,s) => t + (s.duration_min||0), 0);
  const strengthCount = sessions.filter(s => s.type === 'strength').length;
  const t = week.targets, st = week.strTargets;
  const problems = [];
  if (t.mileage_mi != null && Math.abs(t.mileage_mi - mi) > MILEAGE_TOL_MI)
    problems.push(`mileage_mi ${t.mileage_mi} ≠ sessions ${mi.toFixed(1)} mi`);
  if (t.vertical_ft != null && Math.abs(t.vertical_ft - ft) > VERTICAL_TOL_FT)
    problems.push(`vertical_ft ${t.vertical_ft} ≠ sessions ${Math.round(ft)} ft`);
  if (st.strength_sessions != null && st.strength_sessions !== strengthCount)
    problems.push(`strength_sessions ${st.strength_sessions} ≠ ${strengthCount} scheduled`);
  if (st.swim_sessions != null && st.swim_sessions !== swims.length)
    problems.push(`swim_sessions ${st.swim_sessions} ≠ ${swims.length} scheduled`);
  if (st.swim_minutes != null && st.swim_minutes !== swimMin)
    problems.push(`swim_minutes ${st.swim_minutes} ≠ ${swimMin} scheduled`);
  return {problems, strengthCount, swimCount: swims.length, swimMin};
}

function formatRange(s, e) {
  const fmt = d => d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  return `${fmt(new Date(s+'T00:00:00'))} — ${fmt(new Date(e+'T00:00:00'))}`;
}

// One session line in the week list.
function WeekSessionRow({s}) {
  const c = sessionColor(s);
  let main, sub;
  if (s.type === 'run') {
    main = s.distance_mi > 0 ? `${s.distance_mi} mi` : s.duration_min != null ? `${s.duration_min}m` : '';
    const ft = s.elevation_gain_ft ? `${s.elevation_gain_ft>=1000?(s.elevation_gain_ft/1000).toFixed(1)+'k':s.elevation_gain_ft}ft` : '';
    sub = [s.distance_mi > 0 && s.duration_min != null ? `${s.duration_min}m` : '', ft].filter(Boolean).join(' · ');
  } else if (s.type === 'cross') {
    main = s.duration_min != null ? `${s.duration_min}m` : '';
    sub = (s.intensity || '').toLowerCase();
  } else {
    main = s.duration_min != null ? `${s.duration_min}m` : '';
    sub = `${(s.exercises||[]).length} moves`;
  }
  const tag = [c.name, s.poles ? 'POLES' : '', s.aet_gate && s.aet_gate.active_version !== 'if_pass' ? 'GATED' : ''].filter(Boolean).join(' · ');
  return (
    <div style={{display:'flex',alignItems:'center',gap:12}}>
      <div style={{width:6,height:6,borderRadius:3,background:c.hue,flexShrink:0}}/>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:9,color:c.hue,fontFamily:MONO,letterSpacing:1.2,fontWeight:700,marginBottom:2}}>{tag}</div>
        <div style={{fontSize:13,color:A.text,fontWeight:600,lineHeight:1.25,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.title}</div>
      </div>
      <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:2,fontFamily:MONO,flexShrink:0}}>
        <div style={{fontSize:13,fontWeight:700,color:A.text,fontFamily:DISPLAY,letterSpacing:-0.2}}>{main}</div>
        {sub && <div style={{fontSize:9,color:A.textFaint,letterSpacing:0.4}}>{sub}</div>}
      </div>
    </div>
  );
}

function WeekNote({label, text}) {
  if (!text) return null;
  return (
    <div style={{fontSize:12,color:A.textDim,lineHeight:1.5,fontFamily:SANS,padding:'6px 0'}}>
      <span style={{fontSize:9,color:A.textFaint,fontFamily:MONO,letterSpacing:1,fontWeight:700}}>{label} </span>{text}
    </div>
  );
}

              // as a heavy band here. Same idea, tuned for the surface.

              cursor:'pointer',textAlign:'left',
              color:A.text,fontFamily:SANS,WebkitTapHighlightColor:'transparent',

                {sessions.length === 0 ? (

                  </div>
                ) : sessions.map((s,i) => <WeekSessionRow key={i} s={s}/>)}
              </div>
              <span style={{color:A.textFaint,fontSize:14,marginLeft:4,marginTop:2,flexShrink:0}}>↗</span>
            </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── Plan update control ───────────────────────────────────────
// Reports whether the merged plan on the server differs from the one loaded.
// A check is a conditional request: 304 costs no bandwidth, 200 carries the
// new plan. Never applies an update on its own — swapping the plan under
// someone reading today's session would be jarring.
function UpdateControl({update}) {
  if (!update) return null;
  const {status, changed, planDate, onCheck, onApply} = update;

  const fmtDate = (iso) => iso
    ? new Date(iso+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})
    : null;

  const tap = status === 'available' ? onApply : onCheck;
  const busy = status === 'checking';

  const label = {
    checking:  'Checking…',
    current:   'Up to date',
    offline:   "Can't reach server — retry",
    error:     'Check failed — retry',
    available: changed.length
      ? `${changed.join(' + ')} plan updated — tap to apply`
      : 'Update available — tap to apply',
  }[status] || (planDate ? `Plan from ${fmtDate(planDate)}` : 'Check for updates');

  const hue = status === 'available' ? A.accent
            : status === 'offline' || status === 'error' ? '#ffb020'
            : A.textFaint;

  return (
    <button onClick={busy ? undefined : tap} disabled={busy} style={{
      display:'flex',alignItems:'center',gap:7,marginTop:10,
      padding:'7px 11px',borderRadius:9,
      background: status === 'available' ? `${A.accent}14` : A.surface,
      border:`1px solid ${status === 'available' ? `${A.accent}55` : A.border}`,
      color:hue,fontFamily:MONO,fontSize:10,letterSpacing:0.8,fontWeight:700,
      cursor: busy ? 'default' : 'pointer', textAlign:'left',
      WebkitTapHighlightColor:'transparent',
    }}>
      <span style={{
        fontSize:12,lineHeight:1,display:'inline-block',
        animation: busy ? 'wr-spin 0.9s linear infinite' : 'none',
      }}>⟳</span>
      <span>{label.toUpperCase()}</span>
    </button>
  );
}

// AeT status (run_plan meta, spec 2.7). The caps in the plan are computed from
// aet_bpm by the coach and re-issued as a patch after each drift test.
function AetStatus({physiology: p}) {
  if (!p || p.aet_bpm == null) return null;
  const today = todayIso();
  const next = (p.aet_test_dates || []).find(d => d >= today);
  const fmtD = iso => new Date(iso+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const status = (p.aet_status || '').split(/\s+-\s+/)[0];
  const passed = p.aet_gate_bpm != null && p.aet_bpm >= p.aet_gate_bpm;
  return (
    <div style={{margin:'0 16px 14px',padding:'12px 14px',background:A.surface,borderRadius:14,border:`1px solid ${A.border}`}}>
      <div style={{display:'flex',alignItems:'baseline',gap:8,flexWrap:'wrap'}}>
        <span style={{fontSize:9,color:A.textFaint,fontFamily:MONO,letterSpacing:1.2,fontWeight:700}}>AeT</span>
        <span style={{fontSize:24,fontWeight:800,fontFamily:DISPLAY,letterSpacing:-0.6,lineHeight:1}}>{p.aet_bpm}</span>
        <span style={{fontSize:10,color:A.textDim,fontFamily:MONO}}>bpm</span>
        {status && <span style={{fontSize:9,padding:'2px 6px',borderRadius:3,border:`1px solid ${A.borderStrong}`,color:A.textDim,fontFamily:MONO,fontWeight:700,letterSpacing:1}}>{status.toUpperCase()}</span>}
        <div style={{flex:1}}/>
        {p.lthr_bpm != null && <span style={{fontSize:10,color:A.textFaint,fontFamily:MONO}}>LTHR {p.lthr_bpm}</span>}
      </div>
      <div style={{fontSize:11,color:A.textDim,fontFamily:MONO,marginTop:6,lineHeight:1.5}}>
        {p.aet_gate_bpm != null && <span style={{color:passed?'#4ade80':A.textDim}}>Z3 gate ≥{p.aet_gate_bpm}{passed?' · passed':''}</span>}
        {next && <span> · next test {fmtD(next)}</span>}
      </div>
      {p.aet_status && <div style={{fontSize:11,color:A.textFaint,marginTop:4,lineHeight:1.4}}>{p.aet_status}</div>}
    </div>
  );
}

function PlanView({plan, currentDate, onJumpToDay, update}) {
  const weeks = useMemo(() => buildWeeks(plan), [plan]);
  const currentWeek = plan.days[currentDate]?.week_number;
  const scrollerRef = useRef(null);
  useEffect(() => {
    if (!scrollerRef.current || !currentWeek) return;
    const el = scrollerRef.current.querySelector(`[data-week="${currentWeek}"]`);
    if (el) el.scrollIntoView({block:'start',behavior:'auto'});
  }, []);
  return (
    <div ref={scrollerRef} style={{background:A.bg,color:A.text,fontFamily:SANS,minHeight:'100%',paddingBottom:32}}>
      <div style={{padding:'4px 16px 12px'}}>
        <div style={{fontSize:10,color:A.accent,fontFamily:MONO,letterSpacing:1.6,fontWeight:700,marginBottom:4}}>{weeks.length} WEEKS · {(plan.meta?.race || '').toUpperCase()}</div>
        <div style={{fontSize:22,fontWeight:800,color:A.text,fontFamily:DISPLAY,letterSpacing:-0.6,lineHeight:1.1}}>The full plan</div>
        <div style={{fontSize:12,color:A.textDim,marginTop:4}}>Tap any week to expand. Tap a workout to jump into that day.</div>
        <UpdateControl update={update}/>
      </div>
      <AetStatus physiology={plan.meta?.physiology}/>
      <div style={{padding:'0 16px 14px',display:'flex',gap:10,flexWrap:'wrap'}}>
        {[['Base','#4ade80'],['Build','#ff5a3c'],['Peak','#ffb020'],['Taper_1','#60a5fa'],['Race_week','#c084fc']].map(([k,c]) => (
          <div key={k} style={{display:'flex',alignItems:'center',gap:6,fontSize:9,color:A.textFaint,fontFamily:MONO,letterSpacing:1,fontWeight:600}}>
            <span style={{width:8,height:8,borderRadius:2,background:c}}/>
            {phaseStyle(k).label}
          </div>
        ))}
      </div>
      <div style={{padding:'0 16px',display:'flex',flexDirection:'column',gap:10}}>
        {weeks.map(w => (
          <div key={w.n} data-week={w.n}>
            <WeekCard week={w} defaultOpen={w.n===currentWeek} onJump={onJumpToDay}/>
          </div>
        ))}
      </div>
    </div>
  );
}

const AID_ACTION = {
  refill:   { label: 'FILL UP', hue: '#4ade80', bg: 'rgba(74,222,128,0.14)' },
  'top-up': { label: 'TOP UP',  hue: '#ffb020', bg: 'rgba(255,176,32,0.14)' },
  pass:     { label: 'SKIP',    hue: '#a3a3a3', bg: 'rgba(163,163,163,0.12)' },
};
const aidAction = (act) => AID_ACTION[(act||'').toLowerCase().replace('*','')] || null;
const gradeHue = (g) => g >= 3 ? '#ff5a3c' : g <= -3 ? '#60a5fa' : A.textDim;
const hms = (s) => (s||'').replace(/^(\d+:\d\d):\d\d$/, '$1');  // 1:21:44 → 1:21

// Stations (start, aid stations, finish), each with the stages up to the next one.
const RACE_LEGS = (() => {
  const legs = [{ name: 'Start', m: 0, eta: '0:00:00', stages: [] }];
  for (const r of RACE_STAGES) {
    if (r.k === 's') legs[legs.length-1].stages.push(r);
    else legs.push({ ...r, stages: [] });
  }
  return legs;
})();

// Fixed columns so values line up across rows: dist · gait · grade avg/max · pace.
const STAGE_COLS = '56px 56px 1fr 62px';

function StageRow({s, i}) {
  const gait = /mix/i.test(s.gait) ? 'MIX' : s.gait.split(' ')[0];  // 'RUN/mix', 'MIXED' → 'MIX'; 'RUN cad>=175' → 'RUN'
  const hike = /HIKE/.test(gait);
  const num = (g) => (g > 0 ? '+' : '') + g.toFixed(1);
  const val = {fontSize:13,fontFamily:MONO,fontWeight:700,whiteSpace:'nowrap'};
  return (
    <div style={{padding:'12px 14px',borderTop:`1px solid ${A.border}`}}>
      <div style={{display:'flex',alignItems:'baseline',gap:8,marginBottom:8}}>
        <span style={{fontSize:10,color:A.textFaint,fontFamily:MONO,fontWeight:700}}>{i+1}</span>
        <span style={{flex:1,fontSize:13,color:A.text,fontWeight:600,lineHeight:1.3}}>{s.name}</span>
        <span style={{fontSize:10,color:A.textDim,fontFamily:MONO,whiteSpace:'nowrap'}}>mi {s.m0.toFixed(2)}–{s.m1.toFixed(2)}</span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:STAGE_COLS,columnGap:8,alignItems:'baseline'}}>
        <span style={{...val,color:A.text}}>{s.d.toFixed(2)}<span style={{fontSize:10,color:A.textDim,fontWeight:500}}> mi</span></span>
        <span style={{...val,color:hike ? '#ffb020' : '#4ade80'}}>{gait}</span>
        <span style={val}>
          <span style={{color:gradeHue(s.avg)}}>{num(s.avg)}</span>
          <span style={{color:A.textFaint}}> / </span>
          <span style={{color:gradeHue(s.max)}}>{num(s.max)}%</span>
        </span>
        <span style={{...val,color:A.text,textAlign:'right'}}>{s.pace}<span style={{fontSize:10,color:A.textDim,fontWeight:500}}>/mi</span></span>
      </div>
    </div>
  );
}

// ── IndexedDB persistence ─────────────────────────────────────
const DB_NAME = 'wr50k-analysis';
const STORE  = 'workouts';

const openDB = () => new Promise((resolve, reject) => {
  const req = indexedDB.open(DB_NAME, 1);
  req.onerror = () => reject(req.error);
  req.onupgradeneeded = () => {
    const db = req.result;
    if (!db.objectStoreNames.contains(STORE)) {
      const store = db.createObjectStore(STORE, { keyPath: 'id' });
      store.createIndex('start_time', 'meta.start_time', { unique: false });
    }
  };
  req.onsuccess = () => resolve(req.result);
});

const idbSave = async (analysis, filename) => {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const record = {
      id: crypto.randomUUID(),
      filename: filename || 'workout.fit',
      saved_at: new Date().toISOString(),
      ...analysis,
    };
    tx.objectStore(STORE).add(record);
    tx.oncomplete = () => resolve(record);
    tx.onerror = () => reject(tx.error);
  });
};

const idbList = async () => {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => {
      const all = (req.result || []).slice();
      all.sort((a,b) => {
        const ta = a.meta?.start_time || a.saved_at || '';
        const tb = b.meta?.start_time || b.saved_at || '';
        return tb.localeCompare(ta);
      });
      resolve(all);
    };
    req.onerror = () => reject(req.error);
  });
};

const idbDelete = async (id) => {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
};

function formatDateTimeShort(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) +
         ' · ' +
         d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

function formatDurationHMS(sec) {
  if (!sec || Number.isNaN(sec)) return '—';
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m ${String(s).padStart(2,'0')}s`;
}

function ElevationGraph({profile}) {
  if (!profile || profile.length < 2) return null;

  const W = 340, H = 120;
  const PAD = {top: 10, right: 10, bottom: 24, left: 44};
  const gW = W - PAD.left - PAD.right;
  const gH = H - PAD.top - PAD.bottom;

  const xs = profile.map(p => p[0]);
  const ys = profile.map(p => p[1]);
  const xMin = xs[0], xMax = xs[xs.length - 1];
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  const yRange = yMax - yMin || 1;

  const toX = d => PAD.left + ((d - xMin) / (xMax - xMin)) * gW;
  const toY = a => PAD.top + (1 - (a - yMin) / yRange) * gH;

  // Build SVG path
  const pts = profile.map(([d, a]) => `${toX(d).toFixed(1)},${toY(a).toFixed(1)}`);
  const linePath = 'M' + pts.join('L');
  // Fill area
  const fillPath = linePath +
    `L${toX(xMax).toFixed(1)},${(PAD.top + gH).toFixed(1)}` +
    `L${toX(xMin).toFixed(1)},${(PAD.top + gH).toFixed(1)}Z`;

  // Y axis ticks
  const yTicks = 3;
  const yTickVals = Array.from({length: yTicks}, (_, i) =>
    Math.round(yMin + (i / (yTicks - 1)) * yRange)
  );

  // X axis ticks — every whole mile
  const maxMile = Math.floor(xMax);
  const xTickVals = Array.from({length: maxMile + 1}, (_, i) => i);

  return (
    <div style={{
      background: A.surface, borderRadius: 16, border: `1px solid ${A.border}`,
      overflow: 'hidden',
    }}>
      <div style={{
        padding: '10px 14px 6px', borderBottom: `1px solid ${A.border}`,
        fontFamily: MONO, fontSize: 10, letterSpacing: 1.6, fontWeight: 700, color: A.textDim,
      }}>
        ELEVATION PROFILE
      </div>
      <div style={{padding: '10px 14px 12px', overflowX: 'auto'}}>
        <svg
          viewBox={`0 0 ${W} ${H}`}
          style={{width: '100%', maxWidth: W, display: 'block'}}
          preserveAspectRatio="xMidYMid meet"
        >
          {/* Grid lines */}
          {yTickVals.map((v, i) => (
            <line
              key={i}
              x1={PAD.left} y1={toY(v).toFixed(1)}
              x2={PAD.left + gW} y2={toY(v).toFixed(1)}
              stroke="rgba(255,255,255,0.06)" strokeWidth="1"
            />
          ))}

          {/* Fill area */}
          <path d={fillPath} fill="rgba(255,90,60,0.12)" />

          {/* Line */}
          <path d={linePath} fill="none" stroke="#ff5a3c" strokeWidth="1.5" strokeLinejoin="round" />

          {/* Y axis ticks + labels */}
          {yTickVals.map((v, i) => (
            <g key={i}>
              <line
                x1={PAD.left - 3} y1={toY(v).toFixed(1)}
                x2={PAD.left} y2={toY(v).toFixed(1)}
                stroke="rgba(255,255,255,0.2)" strokeWidth="1"
              />
              <text
                x={PAD.left - 6} y={toY(v)} dominantBaseline="middle" textAnchor="end"
                fontSize="8" fill="rgba(255,255,255,0.38)" fontFamily="monospace"
              >
                {v.toLocaleString()}
              </text>
            </g>
          ))}

          {/* Y axis label */}
          <text
            x={8} y={PAD.top + gH / 2}
            textAnchor="middle" fontSize="7" fill="rgba(255,255,255,0.3)"
            fontFamily="monospace" transform={`rotate(-90, 8, ${PAD.top + gH / 2})`}
          >
            ft
          </text>

          {/* X axis ticks + labels */}
          {xTickVals.map((mi) => {
            if (mi > xMax + 0.05) return null;
            const px = toX(mi);
            return (
              <g key={mi}>
                <line
                  x1={px} y1={PAD.top + gH}
                  x2={px} y2={PAD.top + gH + 3}
                  stroke="rgba(255,255,255,0.2)" strokeWidth="1"
                />
                <text
                  x={px} y={PAD.top + gH + 13}
                  textAnchor="middle" fontSize="8" fill="rgba(255,255,255,0.38)"
                  fontFamily="monospace"
                >
                  {mi}
                </text>
              </g>
            );
          })}

          {/* X axis label */}
          <text
            x={PAD.left + gW / 2} y={H - 2}
            textAnchor="middle" fontSize="7" fill="rgba(255,255,255,0.3)"
            fontFamily="monospace"
          >
            mi
          </text>

          {/* Axes */}
          <line
            x1={PAD.left} y1={PAD.top}
            x2={PAD.left} y2={PAD.top + gH}
            stroke="rgba(255,255,255,0.15)" strokeWidth="1"
          />
          <line
            x1={PAD.left} y1={PAD.top + gH}
            x2={PAD.left + gW} y2={PAD.top + gH}
            stroke="rgba(255,255,255,0.15)" strokeWidth="1"
          />
        </svg>
      </div>
    </div>
  );
}

function AnalysisView({onBack}) {
  const [history, setHistory] = useState([]);
  const [loading, setLoading] = useState(true);
  const [parsing, setParsing] = useState(false);
  const [error, setError] = useState(null);
  const [active, setActive] = useState(null); // currently viewed result
  const fileInputRef = useRef(null);

  const refresh = async () => {
    setLoading(true);
    try {
      const all = await idbList();
      setHistory(all);
    } catch (e) {
      setError('Could not load history: ' + e.message);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { refresh(); }, []);

  const onFile = async (file) => {
    if (!file) return;
    setError(null);
    setParsing(true);
    try {
      const buf = await file.arrayBuffer();
      const analysis = await window.FitAnalysis.analyzeFitBuffer(buf);
      const saved = await idbSave(analysis, file.name);
      await refresh();
      setActive(saved);
    } catch (e) {
      setError(e.message || String(e));
    } finally {
      setParsing(false);
      if (fileInputRef.current) fileInputRef.current.value = '';
    }
  };

  const deleteRecord = async (rec) => {
    if (!window.confirm(`Delete "${rec.filename}"?`)) return;
    try {
      await idbDelete(rec.id);
      if (active && active.id === rec.id) setActive(null);
      await refresh();
    } catch (e) {
      setError('Delete failed: ' + e.message);
    }
  };

  return (
    <div id="app-scroll" style={{background: A.bg, height: '100vh', overflowY: 'auto'}}>
      <div style={{
        position: 'sticky', top: 0, zIndex: 10, background: A.bg,
        borderBottom: `1px solid ${A.border}`,
        padding: '14px 16px', display: 'flex', alignItems: 'center', gap: 10,
      }}>

          height: 36, padding: '0 12px', borderRadius: 10, background: A.surface2,
          border: `1px solid ${A.border}`, display: 'flex', alignItems: 'center',
          gap: 6, cursor: 'pointer', color: A.text, fontFamily: MONO,
          fontSize: 10, letterSpacing: 1.4, fontWeight: 700,
          WebkitTapHighlightColor: 'transparent',
        }}>
          <Icon name="back" size={14} color={A.text}/>
          TODAY
        </button>
        <div style={{flex: 1}}/>
        <div style={{fontSize: 10, color: A.textDim, fontFamily: MONO, letterSpacing: 1.4, fontWeight: 700}}>ANALYSIS</div>
      </div>

      <div style={{padding: 16, display: 'flex', flexDirection: 'column', gap: 14}}>
        {active ? (
          <AnalysisResultDetail analysis={active} onBack={() => setActive(null)}/>
        ) : (
          <React.Fragment>
            {/* Upload card */}
            <div style={{
              background: A.surface, borderRadius: 16, border: `1px solid ${A.border}`,
              padding: '16px', display: 'flex', flexDirection: 'column', gap: 10,
            }}>
              <div style={{fontSize: 10, color: A.accent, fontFamily: MONO, letterSpacing: 1.6, fontWeight: 700}}>
                NEW ANALYSIS
              </div>
              <div style={{fontSize: 13, color: A.textDim, lineHeight: 1.5, fontFamily: SANS}}>
                On Garmin Connect, open an activity → gear icon → <span style={{color: A.text, fontWeight: 600}}>Export Original</span>. Pick the .fit file below.
              </div>
              <input
                ref={fileInputRef}
                type="file"
                accept=".fit,application/octet-stream"
                onChange={(e) => onFile(e.target.files && e.target.files[0])}
                style={{display: 'none'}}
              />
              <button
                disabled={parsing}
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                style={{
                  height: 44, borderRadius: 10, background: parsing ? A.surface2 : A.accent,
                  border: 'none', cursor: parsing ? 'wait' : 'pointer',
                  color: parsing ? A.textDim : '#000', fontFamily: MONO,
                  fontSize: 11, letterSpacing: 1.4, fontWeight: 700,
                  WebkitTapHighlightColor: 'transparent', display: 'flex',
                  alignItems: 'center', justifyContent: 'center', gap: 8,
                }}>
                {parsing ? 'PARSING…' : 'PICK .FIT FILE'}
              </button>
              {error && (
                <div style={{
                  fontSize: 12, color: '#ff6b6b', fontFamily: SANS,
                  padding: '8px 10px', background: 'rgba(255,107,107,0.08)',
                  borderRadius: 8, border: '1px solid rgba(255,107,107,0.2)',
                }}>
                  {error}
                </div>
              )}
            </div>

            {/* History */}
            <div style={{display: 'flex', flexDirection: 'column', gap: 8}}>
              <div style={{
                fontSize: 10, color: A.textDim, fontFamily: MONO,
                letterSpacing: 1.6, fontWeight: 700, padding: '4px 4px',

                <div style={{
                  padding: '20px 16px', textAlign: 'center', color: A.textDim,

                history.map(rec => (
                  <AnalysisHistoryItem
                    key={rec.id}
                    record={rec}
