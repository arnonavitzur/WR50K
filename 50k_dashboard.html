          </React.Fragment>
        )}
      </div>
    </div>
  );
}


// How long the app can be backgrounded before a resume counts as "opening it
// again" rather than a quick app-switch.
const RESUME_RESET_MS = 30 * 60 * 1000;

function App({plan, update}) {
  useEffect(() => {
    if (plan?.meta?.race) document.title = `${plan.meta.race} — Training`;
  }, []);
  const dates = Object.keys(plan.days).sort();
  const [selected, setSelected] = useState(() => resolveToday(plan));
  const [filter, setFilter] = useState('all');
  const [transitioning, setTransitioning] = useState(false);
  const [view, setView] = useState('day'); // 'day' | 'plan' | 'race' | 'analysis'
  // Focus-tab → detail-tab jump. {idx, nonce}; the matching HeroWorkout expands
  // and scrolls itself into view, then clears this via onFocusDone.
  const [jump, setJump] = useState(null);
  const jumpSeq = useRef(0);

  const focusWorkout = (idx) => {
    jumpSeq.current += 1;
    setJump({idx, nonce: jumpSeq.current});
    setFilter('workouts');
  };
  const focusNutrition = () => {
    setJump(null);
    setFilter('nutrition');
    setTimeout(() => document.getElementById('app-scroll')?.scrollTo({top:0,behavior:'auto'}), 0);
  };

  const jumpToDay = (d) => {
    setSelected(d);
    setView('day');
    setJump(null);
    setFilter('all');            // every day opens on Focus
    setTimeout(() => {
      document.getElementById('app-scroll')?.scrollTo({top:0,behavior:'auto'});
    }, 0);
  };

  const switchDay = (d) => {
    if (d === selected) return;
    setJump(null);
    setFilter('all');            // every day opens on Focus
    setTransitioning(true);
    setTimeout(() => {
      setSelected(d);
      setTransitioning(false);
      document.getElementById('app-scroll')?.scrollTo({top:0,behavior:'auto'});
    }, 140);
  };

  // A backgrounded PWA resumes rather than cold-starts, so the mount-time
  // resolveToday never re-runs — left open overnight, the app would still be
  // sitting on yesterday. Snap back to today when the date has rolled over or
  // after a long time away. A quick app-switch is left alone: throwing away
  // the day being read would be worse than the staleness it prevents.
  useEffect(() => {
    let awaySince = null;
    let lastDay = todayIso();
    const onVisible = () => {
      if (document.visibilityState !== 'visible') {
        awaySince = Date.now();
        return;
      }
      const now = todayIso();
      const longAway = awaySince != null && Date.now() - awaySince >= RESUME_RESET_MS;
      awaySince = null;
      if (now === lastDay && !longAway) return;
      lastDay = now;
      setSelected(resolveToday(plan));
      setJump(null);
      setFilter('all');
      setView(v => v === 'plan' ? 'day' : v);   // leave an in-progress analysis alone
      setTimeout(() => {
        document.getElementById('app-scroll')?.scrollTo({top:0,behavior:'auto'});
      }, 0);
    };
    document.addEventListener('visibilitychange', onVisible);
    return () => document.removeEventListener('visibilitychange', onVisible);
  }, [plan]);

  if (view === 'analysis') {
    return <AnalysisView onBack={() => setView('day')}/>;
  }

  if (view === 'race') {
    return (
      <div id="app-scroll" style={{background:A.bg,height:'100vh',overflowY:'auto'}}>
        <div id="day-header" style={{
          position:'sticky',top:0,zIndex:10,background:A.bg,
          borderBottom:`1px solid ${A.border}`,
          padding:'14px 16px',display:'flex',alignItems:'center',gap:10,
        }}>
          <button onClick={()=>setView('day')} style={{
            height:36,padding:'0 12px',borderRadius:10,background:A.surface2,
            border:`1px solid ${A.border}`,display:'flex',alignItems:'center',
            gap:6,cursor:'pointer',color:A.text,fontFamily:MONO,
            fontSize:10,letterSpacing:1.4,fontWeight:700,
            WebkitTapHighlightColor:'transparent',
          }}>
            <Icon name="back" size={14} color={A.text}/>
            TODAY
          </button>
          <div style={{flex:1}}/>
          <div style={{fontSize:10,color:A.textDim,fontFamily:MONO,letterSpacing:1.4,fontWeight:700}}>AID STATIONS</div>
        </div>
        <RaceStagesView/>
      </div>
    );
  }

  if (view === 'plan') {
    return (
      <div id="app-scroll" style={{background:A.bg,height:'100vh',overflowY:'auto'}}>
        <div style={{
          position:'sticky',top:0,zIndex:10,background:A.bg,
          borderBottom:`1px solid ${A.border}`,
          padding:'14px 16px',display:'flex',alignItems:'center',gap:10,
        }}>
          <button onClick={()=>jumpToDay(resolveToday(plan))} style={{
            height:36,padding:'0 12px',borderRadius:10,background:A.surface2,
            border:`1px solid ${A.border}`,display:'flex',alignItems:'center',
            gap:6,cursor:'pointer',color:A.text,fontFamily:MONO,
            fontSize:10,letterSpacing:1.4,fontWeight:700,
            WebkitTapHighlightColor:'transparent',
          }}>
            <Icon name="back" size={14} color={A.text}/>
            TODAY
          </button>
          <div style={{flex:1}}/>
          <div style={{fontSize:10,color:A.textDim,fontFamily:MONO,letterSpacing:1.4,fontWeight:700}}>FULL PLAN</div>
        </div>
        <PlanView plan={plan} currentDate={selected} onJumpToDay={jumpToDay} update={update}/>
      </div>
    );
  }

  const day = plan.days[selected];
  const showWorkouts = filter === 'all' || filter === 'workouts';
  const showNutrition = filter === 'all' || filter === 'nutrition';
  const showRoutines = filter === 'all' || filter === 'routines';
  // run -> cross (swim) -> strength; kind is the session's own type.
  const allSessions = daySessions(day);
  const isRest = isRestDay(day);
  const fueling = day.nutrition?.session_fueling || [];
  const aetGateBpm = plan.meta?.physiology?.aet_gate_bpm;
  // Both plans carry day_notes (the strength plan's often gives the run/swim/lift order).
  const dayNotes = [...new Set([day.run?.day_notes, day.strength?.day_notes].filter(Boolean))];
  const recoveryWeek = day.run?.weekly_targets?.recovery_week;
  const showRaceStages = plan.meta?.race === RACE_STAGES_RACE;

  return (
    <div id="app-scroll" style={{height:'100vh',overflowY:'auto',background:A.bg}}>
      <div style={{background:A.bg,color:A.text,fontFamily:SANS,minHeight:'100%',paddingBottom:40}}>
        {/* sticky header */}
        <div id="day-header" style={{position:'sticky',top:0,zIndex:10,background:A.bg,borderBottom:`1px solid ${A.border}`}}>
          <div style={{padding:'14px 16px 6px',display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:36,height:36,borderRadius:10,background:A.surface2,border:`1px solid ${A.border}`,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <Icon name="mountain" size={16} color={A.accent}/>
            </div>
            <div style={{flex:1}}>
              <div style={{fontSize:10,color:A.accent,fontFamily:MONO,letterSpacing:1.6,fontWeight:700}}>
                WEEK {day.week_number} · {(day.run?.phase||day.strength?.phase||'BASE').toUpperCase().replace('_',' ')}
                {recoveryWeek && <span style={{color:'#60a5fa'}}> · RECOVERY</span>}
              </div>
              <div style={{fontSize:18,fontWeight:700,color:A.text,fontFamily:DISPLAY,letterSpacing:-0.4}}>
                {formatDayLong(selected)}
              </div>
            </div>
            <button onClick={()=>setView('plan')} style={{
              height:36,padding:'0 12px',borderRadius:10,background:A.surface2,
              border:`1px solid ${A.border}`,display:'flex',alignItems:'center',
              justifyContent:'center',gap:6,cursor:'pointer',color:A.text,
              fontFamily:MONO,fontSize:10,letterSpacing:1.4,fontWeight:700,
              WebkitTapHighlightColor:'transparent',
            }}>
              <Icon name="list" size={14} color={A.text}/>
              PLAN
            </button>
            {showRaceStages && <button onClick={()=>setView('race')} aria-label="Race aid stations" style={{
              width:36,height:36,borderRadius:10,background:A.surface2,
              border:`1px solid ${A.border}`,display:'flex',alignItems:'center',
              justifyContent:'center',cursor:'pointer',color:A.text,
              WebkitTapHighlightColor:'transparent',padding:0,
            }}>
              <Icon name="route" size={16} color={A.accent}/>
            </button>}
            <button onClick={()=>setView('analysis')} aria-label="Workout analysis" style={{
              width:36,height:36,borderRadius:10,background:A.surface2,
              border:`1px solid ${A.border}`,display:'flex',alignItems:'center',
              justifyContent:'center',cursor:'pointer',color:A.text,
              WebkitTapHighlightColor:'transparent',padding:0,
            }}>
              <Icon name="analyze" size={16} color={A.text}/>
            </button>
          </div>
          <DayStrip dates={dates} selected={selected} onSelect={switchDay} plan={plan}/>
          <FilterChips filter={filter} setFilter={setFilter}/>
        </div>

        {/* day notes */}
        {dayNotes.length > 0 && showWorkouts && (
          <div style={{padding:'14px 16px 0'}}>
            <div style={{background:'linear-gradient(135deg,rgba(255,90,60,0.08),rgba(255,176,32,0.04))',border:'1px solid rgba(255,90,60,0.22)',borderRadius:12,padding:'10px 12px',display:'flex',gap:10,alignItems:'flex-start'}}>
              <span style={{fontSize:9,color:A.accent,fontFamily:MONO,letterSpacing:1.4,fontWeight:700,padding:'2px 6px',background:'rgba(255,90,60,0.16)',borderRadius:4,flexShrink:0,marginTop:1}}>!</span>
              <div style={{display:'flex',flexDirection:'column',gap:6}}>
                {dayNotes.map((n,i) => <div key={i} style={{fontSize:12,color:A.text,lineHeight:1.5,fontFamily:SANS}}>{n}</div>)}
              </div>
            </div>
          </div>
        )}

        {/* main content */}
        <div style={{
          padding:'16px',display:'flex',flexDirection:'column',gap:14,
          opacity:transitioning?0:1,
          transform:transitioning?'translateY(8px)':'translateY(0)',
          transition:'opacity .14s ease,transform .14s ease',
        }}>
          {/* Rest banner belongs to the workout story — Nutrition and Routines
              still apply on a rest day, so they open straight to their cards. */}
          {isRest && showWorkouts && (
            <div style={{padding:'40px 20px',textAlign:'center',background:A.surface,borderRadius:20,border:`1px solid ${A.border}`}}>
              <div style={{fontSize:11,color:A.textDim,fontFamily:MONO,letterSpacing:1.6,marginBottom:6}}>SCHEDULED</div>
              <div style={{fontSize:32,fontWeight:800,color:A.text,fontFamily:DISPLAY,letterSpacing:-1}}>REST</div>
              <div style={{fontSize:13,color:A.textDim,marginTop:6}}>No session in any plan. Routines + supplements still apply.</div>
            </div>
          )}

          {filter === 'all' ? (
            // ── ALL tab: minimal focused view ──
            <>
              {allSessions.length > 0 && (
                <>
                  {allSessions.map((s,i) => (
                    <HeroWorkoutMinimal key={i} session={s} kind={s.kind} onOpen={()=>focusWorkout(i)}/>
                  ))}
                </>
              )}
              {day.nutrition && <NutritionCardMinimal nutrition={day.nutrition} onOpen={focusNutrition}/>}
              {allSessions.length > 0 && <DayTimeline day={day} plan={plan}/>}
            </>
          ) : (
            // ── Other tabs: full detail ──
            <>
              {showWorkouts && allSessions.length > 0 && (
                <>
                  {allSessions.map((s, i) => {
                    const protocols = plan.session_protocols || {};
                    // Cross sessions have no protocols (spec 3.5).
                    const prePost = s.kind === 'run' ? (
                      <>
                        <PrePostCard block={protocols.run?.pre_run} kind="pre" label="RUN WARM-UP" accent="#60a5fa"/>
                        <PrePostCard block={protocols.run?.post_run} kind="post" label="RUN COOLDOWN" accent="#4ade80"/>
                      </>
                    ) : s.kind === 'strength' ? (() => {
                      // warmup_protocol keys session_protocols; the cooldown is the
                      // matching post_* (pre_lower -> post_lower). post_strength is
                      // the pre-v1.6 single cooldown, kept as a fallback.
                      const warmupKey = s.warmup_protocol;
                      const warmupBlock = warmupKey && protocols.strength?.[warmupKey];
                      const coolKey = STRENGTH_COOLDOWN[warmupKey];
                      const coolBlock = (coolKey && protocols.strength?.[coolKey]) || protocols.strength?.post_strength;
                      const part = warmupKey === 'pre_upper' ? 'UPPER' : warmupKey === 'pre_lower' ? 'LOWER' : 'STRENGTH';
                      return (
                        <>
                          {warmupBlock && <PrePostCard block={warmupBlock} kind="pre" label={`${part} WARM-UP`} accent="#60a5fa"/>}
                          {coolBlock && <PrePostCard block={coolBlock} kind="post" label={`${part} COOLDOWN`} accent="#4ade80"/>}
                        </>
                      );
                    })() : null;
                    return (
                      <HeroWorkout
                        key={i}
                        session={s}
                        kind={s.kind}
                        isSecondary={i > 0}
                        fueling={fueling}
                        prePost={prePost}
                        workoutLabel={sessionColor(s).name}
                        aetGateBpm={aetGateBpm}
                        focusNonce={jump && jump.idx === i ? jump.nonce : null}
                        onFocusDone={()=>setJump(null)}
                      />
                    );
                  })}
                </>
              )}
              {showNutrition && day.nutrition && (
                <>
                  <NutritionCard nutrition={day.nutrition}/>
                  <FuelingTimeline items={day.nutrition.session_fueling}/>
                  <Supplements supplements={plan.supplements} weekNumber={day.week_number}/>
                </>
              )}
              {showRoutines && (
                <DailyRoutines routines={plan.daily_routines} day={day}/>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Boot — loads combined_plan.json at runtime ────────────────
// The plan is fetched, not inlined, so dropping a new combined_plan.json in
// the folder updates the app with no HTML edit. sw.js serves this path
// network-first with a cache fallback, so edits land on the next online load
// and the app still opens offline.
// Note: fetch() cannot read file:// URLs — the app must be served over http
// (localhost or GitHub Pages). Opening the HTML by double-clicking will not work.

function BootScreen({children}) {
  return (
    <div style={{
      background:A.bg,color:A.text,fontFamily:SANS,height:'100vh',
      display:'flex',alignItems:'center',justifyContent:'center',padding:24,
    }}>
      <div style={{textAlign:'center',maxWidth:420}}>{children}</div>
    </div>
  );
}

const PLAN_URL = './combined_plan.json';
const SOURCE_LABEL = {run:'Run', strength:'Strength', nutrition:'Nutrition'};
const AUTO_CHECK_MS = 5 * 60 * 1000;   // don't re-check on every tab focus

// Throws if the payload is not a usable merged plan.
const assertPlan = (data) => {
  if (!data || typeof data !== 'object' || !data.days || !Object.keys(data.days).length) {
    throw new Error('combined_plan.json has no "days" — is it the merged plan?');
  }
  return data;
};

// Which of the three source plans changed between two merged files.
// merge_plans.py stamps meta.sources.{run,strength,nutrition} with the
// schema_version and generated_date of each source, so the merged file alone
// is enough to say what moved — the app never reads the sources themselves.
const changedSources = (oldPlan, newPlan) => {
  const a = oldPlan?.meta?.sources || {};
  const b = newPlan?.meta?.sources || {};
  return [...new Set([...Object.keys(a), ...Object.keys(b)])]
    .filter(k => JSON.stringify(a[k]) !== JSON.stringify(b[k]))
    .map(k => `${SOURCE_LABEL[k] || k}${b[k]?.revision ? ` rev ${b[k].revision}` : ''}`);
};

const newestSourceDate = (plan) => {
  const dates = Object.values(plan?.meta?.sources || {})
    .map(s => s?.generated_date).filter(Boolean).sort();
  return dates.length ? dates[dates.length - 1] : null;
};

function Root() {
  const [plan, setPlan] = useState(null);
  const [error, setError] = useState(null);
  // Cache validators for the plan currently rendered. GitHub Pages sends an
  // ETag; python -m http.server sends only Last-Modified; a bare static host
  // may send neither. All three cases have to work, so we keep both and fall
  // back to comparing content.
  const [validator, setValidator] = useState({etag:null, lastModified:null});
  // Monotonic remount key for App — independent of whether the host sends
  // any validator at all.
  const [planVersion, setPlanVersion] = useState(0);

  // Update checking. status: idle | checking | current | available | offline | error
  const [status, setStatus] = useState('idle');
  const [pending, setPending] = useState(null);   // {plan, etag, changed[]}
  const lastCheckedRef = useRef(0);

  const load = useCallback(() => {
    setError(null);
    // 'no-cache' revalidates with the server rather than trusting the HTTP
    // cache, so an edited plan is picked up without a service worker bump.
    fetch(PLAN_URL, {cache:'no-cache'})
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
        const v = {etag: res.headers.get('etag'), lastModified: res.headers.get('last-modified')};
        return res.json().then(data => ({data, v}));
      })
      .then(({data, v}) => {
        assertPlan(data);
        setPlan(data);
        setValidator(v);
        setPlanVersion(n => n + 1);
        setStatus('idle');
        setPending(null);
      })
      .catch(e => setError(e));
  }, []);

  useEffect(load, [load]);

  // Conditional re-fetch. GitHub Pages honours If-None-Match and answers 304
  // with an empty body, so a check that finds nothing costs no bandwidth.
  // 'no-store' keeps the browser HTTP cache out of it so our own conditional
  // header is the only thing deciding 304 vs 200.
  const check = useCallback((opts = {}) => {
    const {silent = false} = opts;
    if (!plan) return;
    if (!silent) setStatus('checking');
    lastCheckedRef.current = Date.now();

    const headers = {};
    if (validator.etag) headers['If-None-Match'] = validator.etag;
    else if (validator.lastModified) headers['If-Modified-Since'] = validator.lastModified;

    fetch(PLAN_URL, {cache:'no-store', headers})
      .then(res => {
        // The service worker tags responses it served from cache because the
        // network was unreachable. Those must not be read as "up to date" —
        // the server was never actually consulted.
        if (res.headers.get('X-Served-From') === 'sw-cache') {
          throw Object.assign(new Error('served from cache — network unreachable'), {offline: true});
        }
        if (res.status === 304) { setStatus('current'); return null; }
        if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
        const v = {etag: res.headers.get('etag'), lastModified: res.headers.get('last-modified')};
        return res.json().then(data => ({data, v}));
      })
      .then(result => {
        if (!result) return;
        assertPlan(result.data);
        // A 200 does not prove the plan changed — a host may send no validator
        // at all, in which case every check returns the full body. Compare
        // content so we never claim an update that isn't there.
        if (JSON.stringify(result.data) === JSON.stringify(plan)) {
          setValidator(result.v);      // refresh validators so later checks can 304
          setStatus('current');
          return;
        }
        setPending({plan: result.data, validator: result.v, changed: changedSources(plan, result.data)});
        setStatus('available');
      })
      .catch(e => {
        // Either the fetch rejected outright, or the service worker answered
        // from cache because it could not reach the network. Neither means
        // "up to date" — report the check as not having happened.
        const unreachable = e?.offline || navigator.onLine === false;
        setStatus(unreachable ? 'offline' : 'error');
        if (!unreachable) console.warn('[plan] update check failed:', e);
      });
  }, [plan, validator]);

  // A backgrounded PWA often resumes rather than cold-starts, and a resumed
  // page never re-runs the initial fetch — so without this an update could go
  // unnoticed indefinitely. Checks quietly; never applies on its own.
  useEffect(() => {
    const onVisible = () => {
      if (document.visibilityState !== 'visible') return;
      if (Date.now() - lastCheckedRef.current < AUTO_CHECK_MS) return;
      check({silent: true});
    };
    document.addEventListener('visibilitychange', onVisible);
    return () => document.removeEventListener('visibilitychange', onVisible);
  }, [check]);

  // Swapping the plan changes App's key, remounting it. That re-runs
  // useState(() => resolveToday(plan)), so `selected` can never point at a
  // date the new plan lacks — plan.days[selected] is read unguarded in App.
  const apply = useCallback(() => {
    if (!pending) return;
    setPlan(pending.plan);
    setValidator(pending.validator);
    setPlanVersion(n => n + 1);
    setPending(null);
    setStatus('current');
  }, [pending]);

  if (error) {
    const isFileProto = window.location.protocol === 'file:';
    return (
      <BootScreen>
        <div style={{fontSize:10,color:A.accent,fontFamily:MONO,letterSpacing:1.6,fontWeight:700,marginBottom:8}}>PLAN NOT LOADED</div>
        <div style={{fontSize:20,fontWeight:800,fontFamily:DISPLAY,letterSpacing:-0.4,marginBottom:10}}>Could not load the plan</div>
        <div style={{fontSize:13,color:A.textDim,lineHeight:1.5,marginBottom:6}}>
          {isFileProto
            ? 'The app is open from a file:// path. Browsers block fetch() on file URLs — serve the folder over http instead (e.g. python3 -m http.server 8080).'
            : 'combined_plan.json could not be read from this folder.'}
        </div>
        <div style={{fontSize:11,color:A.textFaint,fontFamily:MONO,marginBottom:18}}>{String(error.message || error)}</div>
        <button onClick={load} style={{
          height:38,padding:'0 18px',borderRadius:10,background:A.surface2,
          border:`1px solid ${A.borderStrong}`,color:A.text,fontFamily:SANS,
          fontSize:13,fontWeight:600,cursor:'pointer',
        }}>Retry</button>
      </BootScreen>
    );
  }

  if (!plan) {
    return (
      <BootScreen>
        <div style={{fontSize:10,color:A.textFaint,fontFamily:MONO,letterSpacing:1.6,fontWeight:700}}>LOADING PLAN…</div>
      </BootScreen>
    );
  }

  // key={etag} is load-bearing — see the comment on apply().
  return (
    <App
      key={planVersion}
      plan={plan}
      update={{
        status,
        changed: pending?.changed || [],
        planDate: newestSourceDate(plan),
        onCheck: () => check(),
        onApply: apply,
      }}
    />
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>

<script>
/* ── Service worker ─────────────────────────────────────
   Registered outside the Babel block so it runs even if JSX compilation
   fails. Relative paths keep this working under a GitHub Pages subpath. */
(function () {
  if (!('serviceWorker' in navigator)) return;

  function showUpdatePrompt(worker) {
    if (document.getElementById('sw-update')) return;
    var bar = document.createElement('div');
    bar.id = 'sw-update';
    bar.setAttribute('role', 'status');
    bar.style.cssText = [
      'position:fixed', 'left:16px', 'right:16px',
      'bottom:calc(16px + env(safe-area-inset-bottom))',
      'z-index:9999', 'display:flex', 'align-items:center', 'gap:12px',
      'padding:12px 14px', 'background:#17171a',
      'border:1px solid rgba(255,255,255,0.16)', 'border-radius:12px',
      'box-shadow:0 8px 32px rgba(0,0,0,0.6)',
      'font-family:"Inter",-apple-system,system-ui,sans-serif',
      'font-size:13px', 'color:rgba(255,255,255,0.62)'
    ].join(';');

    var label = document.createElement('span');
    label.textContent = 'New version available';
    label.style.flex = '1';

    var btn = document.createElement('button');
    btn.textContent = 'Reload';
    btn.style.cssText = [
      'font-family:"JetBrains Mono",ui-monospace,monospace',
      'font-size:11px', 'font-weight:700', 'letter-spacing:0.08em',
      'padding:7px 14px', 'border-radius:8px', 'cursor:pointer',
      'color:#ff5a3c', 'background:rgba(255,90,60,0.12)',
      'border:1px solid #ff5a3c'
    ].join(';');
    btn.onclick = function () {
      btn.disabled = true;
      worker.postMessage('SKIP_WAITING');
    };

    bar.appendChild(label);
    bar.appendChild(btn);
    document.body.appendChild(bar);
  }

  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
      .then(function (reg) {
        if (reg.waiting && navigator.serviceWorker.controller) {
          showUpdatePrompt(reg.waiting);
        }
        reg.addEventListener('updatefound', function () {
          var sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', function () {
            /* A controller already exists → this is an update, not first install. */
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdatePrompt(sw);
            }
          });
        });
      })
      .catch(function (err) { console.warn('[sw] registration failed:', err); });

    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloading) return;
      reloading = true;
      window.location.reload();
    });
  });
})();
</script>
</body>
