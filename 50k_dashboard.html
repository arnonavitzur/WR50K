<script>window.PLAN_DATA = {"meta":{"athlete":"Arnon","race":"White River 50K","race_date":"2026-07-25","plan_start":"2026-04-27","plan_end":"2026-07-26","sources":{"run":{"schema_version":"1.2","generated_by":"Performance / Run Coach (Claude)","generated_date":"2026-04-26"},"strength":{"schema_version":"1.2","generated_by":"Strength & Mobility Coach (Claude)","generated_date":"2026-04-27"},"nutrition":{"schema_version":"1.2","generated_by":"Nutrition Coach (Claude)","generated_date":"2026-04-28"}}},"session_protocols":{"run":{"pre_run":{"duration_min":8,"exercises":[{"name":"Walking knee hugs","category":"mobility","reps":10,"side":"alternating","cue":"Pull knee to chest, balance on standing leg for 1 second."},{"name":"Walking quad pulls","category":"mobility","reps":10,"side":"alternating","cue":"Tall posture, knee points down."},{"name":"Leg swings — front/back","category":"mobility","reps":12,"side":"alternating","cue":"Hold something for balance; relaxed, full range."},{"name":"Leg swings — side/side","category":"mobility","reps":12,"side":"alternating","cue":"Open the hip, don't twist the spine."},{"name":"Walking lunges","category":"activation","reps":8,"side":"alternating","cue":"Front knee tracks over second toe; keep torso tall."},{"name":"Glute bridges","category":"activation","reps":10,"side":"both","cue":"Squeeze glutes at the top; ribs down."},{"name":"High knees","category":"activation","duration_sec":30,"side":"both","cue":"Quick turnover; emphasize lift, not speed."},{"name":"Strides (quality days only)","category":"activation","sets":3,"duration_sec":20,"side":"both","cue":"Build to ~85% of 5K pace over 20 sec. 60 sec full recovery between. Skip on easy days."}],"notes":"Do this BEFORE every run. On easy/shakeout days, omit strides. On quality days (tempo, power-climb, time trial, race-pace long runs), include the 3 x strides."},"post_run":{"duration_min":10,"exercises":[{"name":"Walking cooldown","category":"mobility","duration_sec":180,"side":"both","cue":"Walk until HR is below 110 bpm before stretching."},{"name":"Standing quad stretch","category":"mobility","duration_sec":30,"sets":2,"side":"alternating","cue":"Tuck pelvis under to feel the stretch in the front of the hip too."},{"name":"Standing calf stretch (bent + straight knee)","category":"calf","duration_sec":30,"sets":2,"side":"alternating","cue":"Two angles per side: knee straight (gastroc) and knee bent (soleus)."},{"name":"Half-kneeling hip flexor stretch","category":"mobility","duration_sec":30,"sets":2,"side":"alternating","cue":"Squeeze the back glute first, THEN lean forward."},{"name":"Pigeon stretch","category":"mobility","duration_sec":45,"side":"alternating","cue":"Square hips. If knee complains, lie back instead (figure-4 supine)."},{"name":"Foam roll quads, IT band, calves (optional)","category":"mobility","duration_sec":180,"side":"both","cue":"60 seconds per area; pause and breathe on tender spots."}],"notes":"Do within 15 minutes of finishing the run. Especially important after long runs and power-climb days — eccentric load + walking cooldown protects the quads."}},"strength":{"post_strength":{"duration_min":10,"exercises":[{"name":"Standing quad stretch","category":"mobility","sets":1,"duration_sec":45,"side":"alternating","cue":"Grab ankle behind you, keep knees together, tall posture. Gentle — no yanking."},{"name":"Standing calf stretch — straight knee (gastrocnemius)","category":"mobility","sets":1,"duration_sec":45,"side":"alternating","cue":"Wall lean, back leg straight, heel pressed down."},{"name":"Standing calf stretch — bent knee (soleus)","category":"mobility","sets":1,"duration_sec":45,"side":"alternating","cue":"Same position but bend the back knee. Stretch shifts lower toward the Achilles."},{"name":"Pigeon stretch (hip external rotation)","category":"mobility","sets":1,"duration_sec":60,"side":"alternating","cue":"Front shin roughly parallel to your body. Walk hands forward, breathe into the stretch."},{"name":"T-spine rotation (open book)","category":"mobility","sets":1,"reps":8,"side":"alternating","cue":"Side-lying, knees stacked. Top arm opens like a book — follow hand with eyes. Exhale as you open."},{"name":"Ankle dorsiflexion mobilisation (knee-to-wall)","category":"mobility","sets":2,"reps":10,"side":"alternating","cue":"Foot a fist-width from wall. Drive knee over toes toward wall without lifting the heel. Measure progress: how far back can the foot go while knee still touches wall?"}],"notes":"Mobility priorities specific to White River: ankle dorsiflexion (descent efficiency), hip flexor length (climb stride + knee load), T-spine rotation (pole use), calf/soleus (descent + climb). Hold each stretch calmly — this is not a rush job.","title":"Post-Strength Cooldown","applies_to":"both"},"pre_lower":{"duration_min":8,"exercises":[{"name":"Foam roll — quads, IT band, calves","category":"mobility","duration_sec":120,"side":"both","cue":"Slow passes, 30 sec per area. Pause on tender spots."},{"name":"Bodyweight squat to box (parallel)","category":"activation","sets":2,"reps":10,"side":"both","cue":"Sit back to the box, light touch, drive up. Focus on tracking knees over toes. This gates the knee — if this hurts, reduce depth or skip loaded step work today."},{"name":"Banded lateral walk","category":"activation","sets":2,"reps":10,"side":"alternating","cue":"Band above knees. Stay low in quarter-squat. Push through the heels."},{"name":"Single-leg balance — eyes closed","category":"balance","sets":1,"duration_sec":30,"side":"alternating","cue":"Close eyes, find balance. If you wobble excessively, open eyes. This wakes up foot intrinsics."}],"notes":"KNEE GATE: the bodyweight box squat is diagnostic. If anterior knee pain is present after this, replace any loaded step-up/step-down in today's session with an isometric wall sit (3 x 30 sec). Do not push through sharp pain.","title":"Pre-Lower Body Warmup","applies_to":"lower"},"pre_upper":{"title":"Pre-Upper Body Warmup","applies_to":"upper","duration_min":8,"exercises":[{"name":"Foam roll — thoracic spine","category":"mobility","duration_sec":60,"side":"both","cue":"Place roller perpendicular to spine at mid-back. Support your head. Slowly extend over the roller, moving it up a few centimetres at a time from lower to mid-traps. Open up the T-spine before any pushing or pulling."},{"name":"Shoulder CARs (controlled articular rotations)","category":"mobility","sets":2,"reps":5,"side":"alternating","cue":"Standing, arm at side. Draw the biggest circle possible with the shoulder — forward, up, back, down. Slow and deliberate, 5 sec per circle. Both directions. Left side gets extra attention — if it feels restricted or clicks, spend an extra set on it.","notes":"Left shoulder priority. This maps every degree of available range before load."},{"name":"Band pull-apart","category":"activation","sets":2,"reps":15,"side":"both","cue":"Arms straight out front, light band. Pull to chest height by squeezing shoulder blades together. Slow return. This is scapular retraction activation — the foundation of every row and pulldown you're about to do."},{"name":"Band external rotation (90/90)","category":"activation","sets":2,"reps":12,"side":"alternating","cue":"Elbow at 90°, upper arm at shoulder height. Rotate forearm up against band resistance. Emphasise the left side — 3 sets left, 2 sets right. Infraspinatus and teres minor need to be warm before overhead press.","notes":"Left shoulder: 3 sets. Right: 2 sets. Non-negotiable on upper session days."},{"name":"Open book (T-spine rotation)","category":"mobility","sets":1,"reps":8,"side":"alternating","cue":"Side-lying, knees stacked at 90°. Top arm opens toward the floor behind you — follow your hand with your eyes. Exhale as you open. Limited T-spine rotation directly reduces shoulder range of motion and loads the rotator cuff harder."},{"name":"Dead hang","category":"mobility","sets":1,"duration_sec":20,"side":"both","cue":"Full passive hang from the bar. Shoulders relaxed — let them rise up toward your ears. Decompresses the shoulder joint and lengthens the lat before you load it. 20 sec is enough to prime — not a strength effort here."},{"name":"Wall slide (scapular upward rotation)","category":"activation","sets":2,"reps":10,"side":"both","cue":"Back flat against wall. Arms in goalpost position, forearms on the wall. Slide arms overhead while maintaining forearm contact. If you lose contact, that's your current range — don't force it. Activates lower trap and serratus, both critical for overhead press mechanics."}],"notes":"Applied before every upper body session. Left shoulder requires extra care — the band external rotation gets 3 sets on the left. If the left shoulder feels stiff or restricted after the CARs, add an extra set of open book before proceeding. Never go straight into loaded pressing or pulling without this block."}}},"daily_routines":[{"id":"foot_correctives","title":"Foot & Arch Correctives","timing":"morning","duration_min":10,"active_weeks":"1-13","phase_overrides":[{"weeks":"11-13","modification":"Reduce all sets by 50% (round up). Keep all exercises — just halve the volume.","reason":"Taper: maintain neuromuscular patterns, reduce tissue stress"}],"exercises":[{"name":"Short-foot (doming)","category":"corrective","sets":3,"duration_sec":30,"side":"both","cue":"Shorten the arch by pulling ball of foot toward heel — do NOT curl the toes. Think about lifting the arch from underneath.","notes":"Emphasise right foot — hold 5 sec longer per rep on the right side."},{"name":"Toe yoga — big toe up / little toes down, then swap","category":"corrective","sets":2,"reps":10,"side":"both","cue":"Isolate the big toe from the others. If you can't separate them yet, use your hand to assist.","progression_note":"By week 4, aim for unassisted isolation on both feet."},{"name":"Heel walks","category":"corrective","sets":2,"duration_sec":30,"side":"both","cue":"Toes fully lifted off the ground. Walk slowly — feel the tibialis anterior working."},{"name":"Tibialis posterior raise (band-resisted inversion)","category":"corrective","sets":2,"reps":15,"side":"both","cue":"Loop band around forefoot, anchor to a fixed point on the outside. Invert the foot against band resistance. Slow and controlled.","notes":"Primary arch support muscle. Right side gets an extra set (3 total on right)."},{"name":"Big toe extension mobilisation","category":"mobility","sets":2,"duration_sec":20,"side":"both","cue":"Kneel with toes tucked under, sit back gently onto heels. Hold at first sign of stretch — don't force."}],"notes":"NON-NEGOTIABLE. This block prevents the right-foot hot spot that could end the race at mile 10. Do it every morning before anything else. If you skip a day, do double the next morning. The correctives have been lapsed — expect the first 2 weeks to feel tedious. Push through; by week 3 it becomes automatic."},{"id":"hip_activation","title":"Hip Activation & Glute Wake-Up","timing":"morning","duration_min":8,"active_weeks":"1-13","phase_overrides":[{"weeks":"11-13","modification":"Reduce all sets by 50% (round up). Keep all exercises.","reason":"Taper: maintain activation patterns, reduce volume"}],"exercises":[{"name":"Side-lying clamshell","category":"hip_stability","sets":2,"reps":15,"side":"both","cue":"Heels together, knees apart. Drive from the glute — don't rotate the pelvis. Slow on the way down.","progression_note":"Add a light band around knees from week 3."},{"name":"Hip CARs (controlled articular rotations)","category":"mobility","sets":2,"reps":5,"side":"alternating","cue":"On all fours. Draw the biggest circle you can with the knee without moving the spine. Slow — 5 seconds per circle.","notes":"Both directions (clockwise and counter-clockwise) count as one rep."},{"name":"Glute bridge — feet elevated on box","category":"activation","sets":2,"reps":12,"side":"both","cue":"Squeeze glutes hard at the top. 2-second hold. Ribs down — don't hyperextend the back."},{"name":"Standing hip flexor stretch (half-kneeling)","category":"mobility","sets":2,"duration_sec":30,"side":"alternating","cue":"Posterior pelvic tilt first (tuck tailbone), then lean forward into the stretch. You should feel it in the front of the back hip."}],"notes":"Controls pronation from above (glute med) and addresses the hip flexor tightness that contributes to anterior knee load. Do immediately after foot correctives — the two blocks together take ~18 min."},{"id":"shoulder_maintenance","title":"Shoulder & Scapular Maintenance","timing":"morning","duration_min":5,"active_weeks":"1-13","phase_overrides":[{"weeks":"11-13","modification":"Reduce sets by 50%. Keep all exercises.","reason":"Taper"}],"exercises":[{"name":"Band pull-apart","category":"upper_body","sets":2,"reps":15,"side":"both","cue":"Arms straight out front, pull band to chest level by squeezing shoulder blades together. Slow return.","notes":"Use light band. This is scapular control, not a strength exercise."},{"name":"Band external rotation (90/90)","category":"corrective","sets":2,"reps":12,"side":"alternating","cue":"Elbow at 90°, upper arm at shoulder height. Rotate forearm up against band resistance. Emphasise left side — 3 sets on the left.","notes":"Left shoulder requires extra attention. If the left side feels 'sticky' or weak, add a third set on that side."},{"name":"Scapular wall slides","category":"mobility","sets":2,"reps":10,"side":"both","cue":"Back flat against wall. Slide arms up to full extension, keeping contact with the wall. If you lose contact, that's your current range — work within it."}],"notes":"Prevents left shoulder flare-ups and builds the scapular endurance needed for 6+ hours of pole use on race day. Quick block — tack it onto the end of the hip activation."}],"supplements":[{"name":"Vitamin D3","dose":"2000 IU","timing":"Morning with breakfast","timing_slot":"morning","rationale":"Bone health, immune function, recovery support. Essential for a 50-year-old in heavy training. Already taking — continue.","active_weeks":"1-13","notes":"If blood work is done and shows deficiency (<30 ng/mL), increase to 4000 IU. Take with fat-containing food for absorption."},{"name":"Omega-3 fish oil (EPA/DHA)","dose":"2g combined EPA+DHA","timing":"Morning with breakfast","timing_slot":"morning","rationale":"Anti-inflammatory, joint health, cardiovascular support. Especially valuable during high-volume training with eccentric loading.","active_weeks":"1-13","notes":"Choose a high-quality brand with at least 1000mg EPA + 500mg DHA per serving. Take with food. Not currently taking — begin immediately."},{"name":"Magnesium glycinate","dose":"400mg elemental magnesium","timing":"Evening, 30-60 min before bed","timing_slot":"evening","rationale":"Muscle relaxation, sleep quality, cramping prevention. Glycinate form is best absorbed and least likely to cause GI issues. Already taking — continue.","active_weeks":"1-13","notes":"Glycinate or bisglycinate form preferred. Avoid magnesium oxide (poor absorption). If any GI looseness, split dose: 200mg morning + 200mg evening."},{"name":"Creatine monohydrate","dose":"5g","timing":"With post-strength meal or shake","timing_slot":"post_run","rationale":"Supports strength gains, eccentric muscle recovery, and may aid cognitive function during long efforts. Already taking — continue.","active_weeks":"1-13","notes":"Take daily, even on rest days (with any meal). No loading phase needed — 5g/day reaches saturation in ~3 weeks. Ensure adequate hydration (creatine increases intracellular water). Discontinue 3-5 days before race to drop ~1-2 lb water weight if desired, or continue through — personal preference."},{"name":"Collagen peptides","dose":"15g","timing":"30-60 min before strength sessions with 50mg vitamin C","timing_slot":"pre_run","rationale":"Tendon and connective tissue support. Taken before tendon-heavy sessions (as already practiced). Combine with vitamin C for collagen synthesis.","active_weeks":"1-13","notes":"Already taking. On non-strength days, take with breakfast. Pair with a vitamin C source (orange juice, berries, or supplement). Especially important given eccentric quad loading and anterior knee history."},{"name":"Vitamin C","dose":"250mg","timing":"With collagen dose (pre-strength or morning)","timing_slot":"pre_run","rationale":"Collagen synthesis cofactor. Immune support during high-volume training.","active_weeks":"1-13","notes":"Can get from food (orange juice with collagen dose) or supplement. Don't exceed 500mg/day — excessive doses may blunt training adaptations."},{"name":"Whey protein isolate","dose":"25-30g per serving","timing":"Post-run and/or post-strength as needed to hit daily protein target","timing_slot":"post_run","rationale":"Convenient, fast-absorbing protein to support 150-160g daily target. Already taking — continue.","active_weeks":"1-13","notes":"Use as a supplement to whole-food protein, not a replacement. Typical use: post-run shake, or evening shake if daily protein target isn't met by dinner."},{"name":"Caffeine (via GU Roctane caffeine gels)","dose":"35mg per gel, max 2-3 gels per long effort","timing":"During long runs (hour 3+ only) and race day (hour 4+)","timing_slot":"pre_run","rationale":"Performance enhancement during long efforts. Strategic use only — not every run. Reserved for the hard back half.","active_weeks":"4-13","notes":"Daily coffee intake (3-4 cups, ~300-400mg caffeine) means tolerance is moderate. Race-day caffeine is conservative (70-105mg total from gels) and timed for the difficult final hours. Consider reducing daily coffee by 1 cup in race week (not eliminating — withdrawal headaches are worse than slight tolerance)."},{"name":"Electrolyte tabs (SaltStick or similar)","dose":"1 capsule per 45-60 min during long runs; 1/hr during shorter quality sessions if hot","timing":"During training runs over 60 min","timing_slot":"pre_run","rationale":"Sodium replacement during exercise. SaltStick provides 225mg Na per capsule. Already using — continue.","active_weeks":"1-13","notes":"Race day: increase to every 45 min (targeting 600-700mg Na/hr). Warm-day variant: every 30-40 min (800-1000mg Na/hr). Always take with water, never dry."}],"days":{"2026-04-27":{"date":"2026-04-27","day_of_week":"Monday","week_number":1,"flex":false,"rest_day":false,"run":{"phase":"Base","weekly_targets":{"mileage_mi":30,"vertical_ft":4400,"long_run_mi":15,"notes":"Base week. New default in effect: Mon tempo / Tue-Wed easy / Thu power-climb / Fri shakeout / Sat long / Sun rest."},"week_notes":"Welcome to the build. Goals this week: re-establish current volume, dial in the new weekly rhythm, and bank one calibration tempo for comparison after the LTHR TT next Tuesday. No poles on Thursday yet — we want a no-pole baseline of climb form before adding the new tool.","day_notes":"Welcome. DOUBLE DAY (run + lower strength) — RUN FIRST while fresh. Strength after, ideally with at least 4-6 hours between. Read through the entire plan before tomorrow.","sessions":[{"type":"run","subtype":"tempo","title":"Tempo — plan kickoff (continuity)","duration_min":55,"distance_mi":5.5,"elevation_gain_ft":200,"terrain":"road","hr_cap_bpm":157,"hr_zone":"Z3","pace_target":{"min_per_mi_slow":"9:15","min_per_mi_fast":"8:30"},"poles":false,"key_cue":"Comfortably hard. Conversation in 3-4 word fragments only.","fueling_required":false,"notes":"Intensity: Quality. Structure: 12-15 min Z1 warmup, 22 min @ Z3 (151-157 bpm) sustained, 10 min Z1 cooldown. Road or smooth surface preferred for clean pacing. Plan day 1. Continuity tempo from your existing rhythm. Note avg pace and HR — useful baseline before next Tuesday's LTHR TT."}]},"strength":{"phase":"Foundation","weekly_targets":{"strength_sessions":3,"notes":"3 sessions (2 lower + 1 upper). Movement quality first. Establish daily routines — these are the most important habit to build this week."},"week_notes":"Week 1 — Foundation. You're starting strength work while simultaneously increasing run volume. The body needs time to absorb both stimuli. This week is about learning the movement patterns, establishing the daily corrective habit, and confirming the knee tolerates the eccentric work. All loads are bodyweight or light. If the knee flares on any exercise, note it and we'll adjust.","day_notes":"DOUBLE DAY — AM tempo run + PM lower strength. Run first. 4-6 hr separation minimum.","sessions":[{"type":"strength","subtype":"lower","title":"Lower A — Eccentric Quad Foundation","duration_min":50,"exercises":[{"name":"Goblet squat","category":"eccentric_quad","sets":3,"reps":10,"tempo":"3-1-2","load":"light","side":"both","cue":"Elbows inside knees at bottom. 3 sec down, 1 sec pause, 2 sec up. Light dumbbell — 15-25 lb.","progression_note":"Increase load by 5 lb per week if form is solid."},{"name":"Step-down from box (12 inch)","category":"eccentric_quad","sets":3,"reps":8,"tempo":"4-1-1","load":"bodyweight","side":"alternating","cue":"Stand on box, lower trailing foot to floor over 4 full seconds. Control the descent — this is the money exercise for your race. Tap the floor lightly, drive back up.","progression_note":"Hold 5 lb dumbbells from week 3. Progress to 18-inch box from week 5."},{"name":"Romanian deadlift (dumbbell)","category":"hip_stability","sets":3,"reps":10,"tempo":"3-1-2","load":"light","side":"both","cue":"Soft knees, hinge from hips, dumbbells trace down the thighs. Feel the hamstrings stretch on the way down. Squeeze glutes to stand up.","progression_note":"Move to barbell RDL from week 3 if form allows."},{"name":"Single-leg calf raise (straight knee)","category":"calf","sets":3,"reps":12,"tempo":"2-1-3","load":"bodyweight","side":"alternating","cue":"Rise to full height on 2 sec, pause 1 sec at top, lower over 3 sec. The slow lowering builds the eccentric capacity you'll need on the descent.","progression_note":"Hold a dumbbell from week 3."},{"name":"Pallof press (band)","category":"core","sets":3,"reps":10,"side":"alternating","cue":"Stand sideways to band anchor. Press hands straight out, resist the rotation. Pause 2 sec at full extension.","notes":"Anti-rotation core — directly supports trunk stability on uneven trail terrain."}],"notes":"Double-day with AM tempo run. Evening session — at least 4-6 hr after the run. Pre-strength warmup is mandatory (see protocols). Knee gate: if the box squat in warmup causes pain, replace step-downs with isometric wall sit 3x30 sec.","warmup_protocol":"pre_lower"}]},"nutrition":{"day_type_id":"tempo_lower_strength","day_type_label":"Tempo run + lower body strength (hard double-day)","phase_adjustment_applied":null,"daily_targets":{"calories_total":2900,"carbs_g":380,"protein_g":160,"fat_g":82,"fluid_ml_total":3200,"general_guidance":"Highest-demand weekday. Two hard sessions — quality run + heavy lower body. Front-load carbs at breakfast and lunch. Hit protein hard at both post-session windows. Hydrate aggressively.","notes":"This is the hardest weekday combination. Tempo depletes glycogen significantly, and lower body eccentric work on top demands maximum recovery nutrition. Sleep nutrition matters — casein or Greek yogurt before bed."},"session_fueling":[{"linked_session":{"type":"run","subtype":"tempo","position":"pre"},"timing":"90 min before run","calories":450,"carbs_g":70,"protein_g":15,"fat_g":8,"foods":["oatmeal with banana, honey, and berries","coffee"],"notes":"Larger pre-run meal for quality session. Low fiber, low fat — quick absorption."},{"linked_session":{"type":"run","subtype":"tempo","position":"post"},"timing":"Within 30 min of finishing","calories":350,"carbs_g":45,"protein_g":32,"foods":["whey protein shake with banana and oats"],"notes":"Aggressive recovery — strength session coming later."},{"linked_session":{"type":"strength","subtype":"lower","position":"pre"},"timing":"60 min before strength","calories":280,"carbs_g":42,"protein_g":14,"foods":["rice cakes with peanut butter and honey"],"notes":"Top up glycogen before heavy lower body work."},{"linked_session":{"type":"strength","subtype":"lower","position":"post"},"timing":"Within 30 min of finishing","calories":400,"carbs_g":48,"protein_g":40,"foods":["salmon or chicken with sweet potato and greens","or large protein shake + whole-food meal within 1hr"],"notes":"Maximum protein dose. This is the critical recovery window of the day."}],"notes":""}},"2026-04-28":{"date":"2026-04-28","day_of_week":"Tuesday","week_number":1,"flex":false,"rest_day":false,"run":{"phase":"Base","weekly_targets":{"mileage_mi":30,"vertical_ft":4400,"long_run_mi":15,"notes":"Base week. New default in effect: Mon tempo / Tue-Wed easy / Thu power-climb / Fri shakeout / Sat long / Sun rest."},"week_notes":"Welcome to the build. Goals this week: re-establish current volume, dial in the new weekly rhythm, and bank one calibration tempo for comparison after the LTHR TT next Tuesday. No poles on Thursday yet — we want a no-pole baseline of climb form before adding the new tool.","day_notes":"","sessions":[{"type":"run","subtype":"easy","title":"Easy Z2 trail","duration_min":55,"distance_mi":5.0,"elevation_gain_ft":400,"terrain":"trail","hr_cap_bpm":149,"hr_zone":"Z2","pace_target":{"min_per_mi_slow":"12:30","min_per_mi_fast":"11:00"},"poles":false,"key_cue":"If you can't hold a 5-word sentence, slow down.","fueling_required":false,"notes":"Intensity: Easy. HR governs, not pace. If 12:00/mi puts you above 143, slow to 12:30."}]},"strength":{"phase":"Foundation","weekly_targets":{"strength_sessions":3,"notes":"3 sessions (2 lower + 1 upper). Movement quality first. Establish daily routines — these are the most important habit to build this week."},"week_notes":"Week 1 — Foundation. You're starting strength work while simultaneously increasing run volume. The body needs time to absorb both stimuli. This week is about learning the movement patterns, establishing the daily corrective habit, and confirming the knee tolerates the eccentric work.  this mirrors the mi 6.51 race transition after a descent.\n\nALTERNATIVE: Phoenicia_1 — 1 loop (21.4 mi / 5,508 ft). Single-loop race-pattern simulation. The mi 9–12 sequence — 1.26-mi descent at -16.9% into an immediate 1.26-mi climb at +16.9% with a 0.37-mi pitch at +26.1% avg — mirrors the race descent-to-pole-deploy transition (mi 5.2–6.5). Wall segments: 0.37 mi at +26% avg (strongest single Wall-grade pitch in any of these courses), 0.31 mi at +17.8%. Choose this if W5 Hunter felt recovery-limiting, or if you want to prioritize the descent-then-Wall transition sequence over cumulative eccentric load. Save this course for W9 if possible — it is the ideal race-pattern simulation run."}]},"strength":{"phase":"Checkpoint","weekly_targets":{"strength_sessions":4,"notes":"4 sessions. MID-JUNE CHECKPOINT WEEK. Maintain loads — assess eccentric capacity. Coach check-in after Saturday's sustained-descent long run."},"week_notes":"Week 7 — Checkpoint. Mid-June re-calibration per the brief. Maintain current loads (don't push new PRs this week). Saturday's long run includes a sustained descent — strength plan needs to have legs ready but not wrecked. After the checkpoint, the final 6 weeks may adjust eccentric loading up or down. Also reassess: is the power climb feeling genuinely hard? If so, the Thursday double-day should carry a note about increased total load.","day_notes":"CHECKPOINT LONG RUN — sustained descent. No strength. Quads will be sore.","sessions":[]},"nutrition":{"day_type_id":"long_run","day_type_label":"Long run day","phase_adjustment_applied":{"phase":"Build","adjustment":"Long runs get longer — during-run calories scale with duration. Add real-food testing from week 4.","modified_targets":{"calories_total":3400,"carbs_g":470,"protein_g":150,"fat_g":82}},"daily_targets":{"calories_total":3400,"carbs_g":470,"protein_g":150,"fat_g":82,"fluid_ml_total":3500,"general_guidance":"Highest carb day. Front-load at breakfast — this meal becomes race-morning rehe <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; }
  body { 
    font-family: -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  #root { min-height: 100%; }
  ::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ── Design tokens ─────────────────────────────────────────────
const A = {
  bg: '#000000',
  surface: '#0e0e10',
  surface2: '#17171a',
  surface3: '#222227',
  border: 'rgba(255,255,255,0.08)',
  borderStrong: 'rgba(255,255,255,0.16)',
  text: '#ffffff',
  textDim: 'rgba(255,255,255,0.62)',
  textFaint: 'rgba(255,255,255,0.38)',
  accent: '#ff5a3c',
};
const SANS = '"Inter", -apple-system, system-ui, sans-serif';
const MONO = '"JetBrains Mono", ui-monospace, monospace';
const DISPLAY = '"Inter", system-ui, sans-serif';

// ── Color maps ────────────────────────────────────────────────
const RUN_COLORS = {
  tempo:       { hue: '#ff5a3c', name: 'TEMPO',       bg: 'rgba(255,90,60,0.12)',   ring: '#ff5a3c' },
  easy:        { hue: '#4ade80', name: 'EASY',        bg: 'rgba(74,222,128,0.12)',  ring: '#4ade80' },
  power_climb: { hue: '#ffb020', name: 'POWER CLIMB', bg: 'rgba(255,176,32,0.12)',  ring: '#ffb020' },
  shakeout:    { hue: '#60a5fa', name: 'SHAKEOUT',    bg: 'rgba(96,165,250,0.12)',  ring: '#60a5fa' },
  long:        { hue: '#c084fc', name: 'LONG',        bg: 'rgba(192,132,252,0.12)', ring: '#c084fc' },
  rest:        { hue: '#71717a', name: 'REST',        bg: 'rgba(113,113,122,0.12)', ring: '#71717a' },
  default:     { hue: '#a3a3a3', name: 'RUN',         bg: 'rgba(163,163,163,0.12)', ring: '#a3a3a3' },
};
const STRENGTH_COLORS = {
  lower:   { hue: '#a78bfa', name: 'LOWER',    bg: 'rgba(167,139,250,0.12)', ring: '#a78bfa' },
  upper:   { hue: '#22d3ee', name: 'UPPER',    bg: 'rgba(34,211,238,0.12)',  ring: '#22d3ee' },
  default: { hue: '#a78bfa', name: 'STRENGTH', bg: 'rgba(167,139,250,0.12)', ring: '#a78bfa' },
};
const runColor = (s) => RUN_COLORS[s] || RUN_COLORS.default;
const strColor = (s) => STRENGTH_COLORS[s] || STRENGTH_COLORS.default;

const PHASE_STYLE = {
  Base:      { label: 'BASE',    hue: '#4ade80' },
  Build:     { label: 'BUILD',   hue: '#ff5a3c' },
  Peak:      { label: 'PEAK',    hue: '#ffb020' },
  Taper_1:   { label: 'TAPER',   hue: '#60a5fa' },
  Taper_2:   { label: 'TAPER',   hue: '#60a5fa' },
  Race_week: { label: 'RACE WK', hue: '#c084fc' },
};
const phaseStyle = (p) => PHASE_STYLE[p] || { label: (p||'PHASE').toUpperCase(), hue: A.textDim };

// ── Helpers ───────────────────────────────────────────────────
const formatDayLong = (iso) => new Date(iso+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
const dayShort = (iso) => new Date(iso+'T00:00:00').toLocaleDateString('en-US',{weekday:'short'}).slice(0,3).toUpperCase();
const dayNum = (iso) => new Date(iso+'T00:00:00').getDate();
const weekActive = (rangeStr, week) => {
  if (!rangeStr) return true;
  const parts = rangeStr.split('-').map(Number);
  return week >= parts[0] && week <= (parts[1]||parts[0]);
};
const resolveToday = (plan) => {
  const dates = Object.keys(plan.days).sort();
  const today = new Date().toISOString().slice(0,10);
  if (plan.days[today]) return today;
  let best = dates[0], bestDiff = Infinity;
  for (const d of dates) {
    const diff = Math.abs(new Date(d) - new Date(today));
    if (diff < bestDiff) { bestDiff = diff; best = d; }
  }
  return best;
};

// ── SVG Icons ─────────────────────────────────────────────────
function Icon({name, size=16, color='currentColor', stroke=2}) {
  const s = {width:size,height:size,fill:'none',stroke:color,strokeWidth:stroke,strokeLinecap:'round',strokeLinejoin:'round',display:'block',flexShrink:0};
  switch(name) {
    case 'run': return <svg {...s} viewBox="0 0 24 24"><circle cx="13" cy="4" r="2"/><path d="M4 22l3-7 4-2-2-4 4-2 4 5h3"/><path d="M9 13l2 5"/></svg>;
    case 'mountain': return <svg {...s} viewBox="0 0 24 24"><path d="M2 20l6-12 4 7 3-5 7 10z"/></svg>;
    case 'dumbbell': return <svg {...s} viewBox="0 0 24 24"><path d="M2 9v6M5 7v10M19 7v10M22 9v6M5 12h14"/></svg>;
    case 'pill': return <svg {...s} viewBox="0 0 24 24"><rect x="2" y="9" width="20" height="6" rx="3"/><path d="M12 9v6"/></svg>;
    case 'stretch': return <svg {...s} viewBox="0 0 24 24"><path d="M3 12c4-6 14-6 18 0M3 12c4 6 14 6 18 0"/></svg>;
    case 'clock': return <svg {...s} viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>;
    case 'down': return <svg {...s} viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>;
    case 'flame': return <svg {...s} viewBox="0 0 24 24"><path d="M12 22c4 0 7-3 7-7 0-4-4-6-3-10-3 1-7 4-7 9 0-2-1-3-2-4-1 2-2 3-2 5 0 4 3 7 7 7z"/></svg>;
    case 'drop': return <svg {...s} viewBox="0 0 24 24"><path d="M12 3l5 7a6 6 0 11-10 0z"/></svg>;
    case 'route': return <svg {...s} viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h6a4 4 0 000-8h-4a4 4 0 010-8h6"/></svg>;
    case 'list': return <svg {...s} viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>;
    case 'back': return <svg {...s} viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>;
    case 'heart': return <svg {...s} viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0112 6a5.5 5.5 0 019.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>;
    case 'analyze': return <svg {...s} viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 5-7"/></svg>;
    default: return null;
  }
}

// ── Day strip ─────────────────────────────────────────────────
function DayStrip({dates, selected, onSelect, plan}) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    const el = ref.current.querySelector(`[data-day="${selected}"]`);
    if (el) el.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
  }, [selected]);
  return (
    <div ref={ref} style={{display:'flex',gap:8,overflowX:'auto',padding:'4px 16px 12px',scrollbarWidth:'none'}}>
      {dates.map(d => {
        const day = plan.days[d];
        const isSel = d === selected;
        const run = day.run?.sessions?.[0];
        const str = day.strength?.sessions?.[0];
        const dots = [];
        if (run) dots.push(runColor(run.subtype).hue);
        if (str) dots.push(strColor(str.subtype).hue);
        if (!dots.length) dots.push(A.textFaint);
        return (
          <button key={d} data-day={d} onClick={()=>onSelect(d)} style={{
            flex:'0 0 auto', minWidth:54, height:72, padding:'8px 6px',
            borderRadius:14, border:`1.5px solid ${isSel ? A.text : A.border}`,
            background: isSel ? A.surface2 : 'transparent',
            color: A.text, cursor:'pointer', fontFamily:SANS,
            display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'space-between',
            transition:'all .18s ease', WebkitTapHighlightColor:'transparent',
          }}>
            <span style={{fontSize:9,letterSpacing:1.2,fontWeight:600,color:isSel?A.text:A.textFaint,fontFamily:MONO}}>
              {dayShort(d)}
            </span>
            <span style={{fontSize:20,fontWeight:700,fontFamily:DISPLAY,lineHeight:1,color:isSel?A.text:A.textDim}}>
              {dayNum(d)}
            </span>
            <span style={{display:'flex',gap:3,alignItems:'center',height:6}}>
              {dots.map((c,i) => <span key={i} style={{width:6,height:6,borderRadius:3,background:c}}/>)}
            </span>
          </button>
        );
      })}
    </div>
  );
}

// ── Filter chips ──────────────────────────────────────────────
function FilterChips({filter, setFilter}) {
  const opts = [{id:'all',label:'Focus'},{id:'workouts',label:'Workouts'},{id:'nutrition',label:'Nutrition'},{id:'routines',label:'Routines'}];
  return (
    <div style={{display:'flex',gap:6,padding:'0 16px 14px',overflowX:'auto',scrollbarWidth:'none'}}>
      {opts.map(o => {
        const isSel = o.id === filter;
        return (
          <button key={o.id} onClick={()=>setFilter(o.id)} style={{
            padding:'7px 14px', borderRadius:100,
            border:`1px solid ${isSel ? A.text : A.border}`,
            background: isSel ? A.text : 'transparent',
            color: isSel ? A.bg : A.textDim,
            fontSize:12, fontWeight:600, fontFamily:SANS, letterSpacing:0.2,
            cursor:'pointer', whiteSpace:'nowrap', flexShrink:0,
            transition:'all .15s', WebkitTapHighlightColor:'transparent',
          }}>{o.label}</button>
        );
      })}
    </div>
  );
}

// ── Big stat ──────────────────────────────────────────────────
function BigStat({label, value, unit, color, mono}) {
  return (
    <div>
      <div style={{fontSize:9,color:A.textFaint,fontFamily:MONO,letterSpacing:1.2,fontWeight:700,marginBottom:4}}>{label}</div>
      <div style={{display:'flex',alignItems:'baseline',gap:3}}>
        <span style={{fontSize:22,fontWeight:800,color:color||A.text,fontFamily:mono?MONO:DISPLAY,letterSpacing:-0.4,lineHeight:1}}>{value}</span>
        {unit && <span style={{fontSize:11,color:A.textDim,fontFamily:MONO}}>{unit}</span>}
      </div>
    </div>
  );
}

// ── Hero Workout Card ─────────────────────────────────────────
// ── Workout fueling collapsible ───────────────────────────────
function WorkoutFueling({preFuel, postFuel, workoutLabel, color}) {
  const [open, setOpen] = useState(false);

  return (
    <div style={{background:A.surface2,borderRadius:14,overflow:'hidden',border:`1px solid ${A.border}`,marginBottom:8}}>
      <button onClick={()=>setOpen(o=>!o)} style={{
        width:'100%',padding:'12px 14px',background:'transparent',border:'none',
        display:'flex',alignItems:'center',gap:10,cursor:'pointer',
        WebkitTapHighlightColor:'transparent',
      }}>
        <div style={{width:28,height:28,borderRadius:7,background:'rgba(255,176,32,0.14)',border:'1px solid rgba(255,176,32,0.3)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          <Icon name="flame" size={13} color="#ffb020"/>

        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:9,color:'#ffb020',fontFamily:MONO,letterSpacing:1.2,fontWeight:700}}>{workoutLabel} FUELING</div>

}

function HeroWorkout({session, kind, isSecondary, fueling, prePost, workoutLabel}) {
  const [collapsed, setCollapsed] = useState(false);
  const color = kind === 'run' ? runColor(session.subtype) : strColor(session.subtype);
  const preFuel = (fueling||[]).find(f => {
    const ls = f.linked_session || {};
    if (ls.position !== 'pre') return false;
    if (ls.type && ls.type !== kind) return false;
    if (ls.subtype && ls.subtype !== session.subtype) return false;
    return true;
  }) || (fueling||[]).find(f => f.linked_session?.position==='pre' && f.linked_session?.type===kind && !f.linked_session?.subtype);
  const postFuel = (fueling||[]).find(f => {
    const ls = f.linked_session || {};
    if (ls.position !== 'post') return false;
    if (ls.type && ls.type !== kind) return false;
    if (ls.subtype && ls.subtype !== session.subtype) return false;
    return true;
  }) || (fueling||[]).find(f => f.linked_session?.position==='post' && f.linked_session?.type===kind && !f.linked_session?.subtype);
  const label = workoutLabel || (kind === 'run' ? color.name : color.name);

  // Shared collapsed/minimal header content
  const dist = kind==='run' ? session.distance_mi : null;
  const dur = session.duration_min;
  const elev = kind==='run' ? session.elevation_gain_ft : null;

  return (
    <div style={{background:`color-mix(in srgb, ${color.hue} 6%, ${A.surface})`,borderRadius:20,overflow:'hidden',border:`1px solid color-mix(in srgb, ${color.hue} 20%, ${A.border})`}}>
      <div style={{height:3,background:color.hue}}/>

      {/* Tappable header — always visible, toggles collapse */}
      <button onClick={()=>setCollapsed(c=>!c)} style={{
        width:'100%',padding:'18px 18px 0',background:'transparent',border:'none',
        textAlign:'left',cursor:'pointer',color:A.text,fontFamily:SANS,
        WebkitTapHighlightColor:'transparent',
      }}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
          <span style={{padding:'3px 8px',borderRadius:4,fontSize:10,fontWeight:700,letterSpacing:1.4,color:color.hue,background:color.bg,fontFamily:MONO}}>
            {color.name}
          </span>
          {kind==='run' && session.poles && <span style={{fontSize:10,color:A.textDim,fontFamily:MONO,letterSpacing:1}}>+ POLES</span>}
          <div style={{flex:1}}/>
          <span style={{transform:collapsed?'rotate(0)':'rotate(180deg)',transition:'transform .2s',display:'flex',alignItems:'center'}}>
            <Icon name="down" size={14} color={A.textFaint}/>
          </span>
        </div>
        <div style={{fontSize:22,fontWeight:700,color:A.text,fontFamily:DISPLAY,letterSpacing:-0.4,lineHeight:1.1,marginBottom:14}}>{session.title}</div>
      </button>

      {/* Stats — always visible */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',padding:'0 18px 18px',gap:12}}>
        {kind==='run' ? (
          <>
            {dist != null && <BigStat label="DISTANCE" value={dist} unit="mi"/>}
            <BigStat label="DURATION" value={dur} unit="min"/>
            {elev > 0 && <BigStat label="VERT" value={elev.toLocaleString()} unit="ft"/>}
            {!elev && session.terrain && <BigStat label="TERRAIN" value={session.terrain.toUpperCase()} mono/>}
          </>
        ) : (
          <>
            <BigStat label="DURATION" value={dur} unit="min"/>
            <BigStat label="EXERCISES" value={(session.exercises||[]).length} unit="moves"/>
          </>
        )}
      </div>

      {/* Expanded content */}
      {!collapsed && (
        <>
          {kind==='run' && (
            <>
              {session.hr_cap_bpm && (
                <div style={{margin:'0 18px 16px',background:A.surface2,borderRadius:10,padding:'10px 12px',border:`1px solid ${A.border}`}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
                    <span style={{fontSize:9,color:A.textFaint,fontFamily:MONO,letterSpacing:1.2,fontWeight:700}}>HR TARGET</span>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      <span style={{fontSize:16,fontWeight:700,color:color.hue,fontFamily:DISPLAY}}>≤{session.hr_cap_bpm}</span>
                      <span style={{fontSize:10,color:A.textDim,fontFamily:MONO}}>bpm</span>
                      {session.hr_zone && <span style={{fontSize:9,padding:'2px 6px',borderRadius:3,background:color.bg,color:color.hue,fontFamily:MONO,fontWeight:700,letterSpacing:1}}>{session.hr_zone}</span>}
                    </div>
                  </div>
                  <div style={{height:4,borderRadius:2,background:A.surface3,overflow:'hidden'}}>
                    <div style={{height:'100%',width:'70%',background:`linear-gradient(90deg,${color.hue}88,${color.hue})`,borderRadius:2}}/>
                  </div>
                </div>
              )}
              {session.pace_target && (
                <div style={{margin:'0 18px 16px',display:'flex',gap:12,alignItems:'center'}}>
                  <div style={{fontSize:9,color:A.textFaint,fontFamily:MONO,letterSpacing:1.2,fontWeight:700}}>PACE</div>
                  <div style={{fontSize:13,color:A.textDim,fontFamily:MONO}}>{session.pace_target.min_per_mi_fast}–{session.pace_target.min_per_mi_slow} /mi</div>
                </div>
              )}
              {session.key_cue && (
                <div style={{margin:'0 18px 14px',padding:'10px 12px',background:'rgba(255,255,255,0.03)',borderRadius:8,border:`1px solid ${A.border}`}}>
                  <div style={{fontSize:9,color:color.hue,fontFamily:MONO,letterSpacing:1.2,fontWeight:700,marginBottom:4}}>KEY CUE</div>
                  <div style={{fontSize:12,color:A.text,lineHeight:1.5,fontFamily:SANS,fontStyle:'italic'}}>{session.key_cue}</div>
                </div>
              )}
              {session.notes && (
                <div style={{margin:'0 18px 14px',padding:'10px 12px',background:'rgba(255,255,255,0.03)',borderRadius:8,border:`1px solid ${A.border}`}}>
                  <div style={{fontSize:9,color:A.textDim,fontFamily:MONO,letterSpacing:1.2,fontWeight:700,marginBottom:4}}>DETAILS</div>
                  <div style={{fontSize:12,color:A.textDim,lineHeight:1.6,fontFamily:SANS}}>{session.notes}</div>
                </div>
              )}
            </>
          )}

          {kind==='strength' && (
            <div style={{padding:'0 18px 4px'}}>
              {/* Exercises — PrePostCard style */}
              <ExercisesCollapsible exercises={session.exercises||[]} color={color}/>
            </div>
          )}

          {/* Warm-up / Cool-down (passed as prePost prop) */}
          {prePost && (
            <div style={{padding:'0 18px 4px'}}>
              {prePost}
            </div>
          )}

          {/* Workout fueling — last */}
          <div style={{padding:'0 18px 4px'}}>
            <WorkoutFueling preFuel={preFuel} postFuel={postFuel} workoutLabel={label} color={color}/>
          </div>
          <div style={{height:14}}/>
        </>
      )}
      {collapsed && <div style={{height:4}}/>}
    </div>
  );
}

// ── Exercises collapsible (PrePostCard style) ─────────────────
function ExercisesCollapsible({exercises, color}) {
  const [open, setOpen] = useState(false);
  if (!exercises.length) return null;
  return (
    <div style={{background:A.surface2,borderRadius:14,overflow:'hidden',border:`1px solid ${A.border}`,marginBottom:8}}>

        display:'flex',alignItems:'center',gap:10,cursor:'pointer',

      }}>
        <div style={{width:28,height:28,borderRadius:7,background:`${color.hue}18`,border:`1px solid ${color.hue}44`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          <Icon name="dumbbell" size={13} color={color.hue}/>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:9,color:color.hue,fontFamily:MONO,letterSpacing:1.2,fontWeight:700}}>EXERCISES</div>
          <div style={{fontSize:12,color:A.textDim}}>{exercises.length} movements</div>
        </div>
        <span style={{transform:open?'rotate(180deg)':'rotate(0)',transition:'transform .2s'}}>
          <Icon name="down" size={14} color={A.textFaint}/>

      </button>
      {open && exercises.map((ex,i) => (
        <div key={i} style={{padding:'10px 14px',borderTop:`1px solid ${A.border}`}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',gap:8}}>
            <div style={{fontSize:13,color:A.text,fontFamily:SANS,fontWeight:600}}>{ex.name}</div>
            <div style={{fontSize:9,color:A.textFaint,fontFamily:MONO,letterSpacing:0.5,flexShrink:0}}>

// ── Fuel Chip ─────────────────────────────────────────────────
function FuelChip({fuel, label, color}) {
  return (
    <div style={{display:'flex',gap:10,alignItems:'flex-start',padding:'8px 10px',borderRadius:8,background:`rgba(255,255,255,0.02)`,border:`1px solid ${A.border}`}}>
      <span style={{fontSize:9,padding:'2px 6px',borderRadius:3,background:`${color}22`,color,fontFamily:MONO,fontWeight:700,letterSpacing:1.2,flexShrink:0,marginTop:1}}>{label}</span>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:11,color:A.textDim,fontFamily:MONO,marginBottom:2}}>{fuel.timing}</div>
        <div style={{display:'flex',gap:8,alignItems:'baseline',marginBottom:4}}>
          <span style={{fontSize:16,fontWeight:700,color:A.text,fontFamily:DISPLAY,letterSpacing:-0.3}}>{fuel.calories}<span style={{fontSize:10,color:A.textDim,marginLeft:2}}>kcal</span></span>
          <span style={{fontSize:10,color:A.textDim,fontFamily:MONO}}>
            {fuel.carbs_g && `${fuel.carbs_g}c`}{fuel.protein_g && ` ${fuel.protein_g}p`}{fuel.fat_g && ` ${fuel.fat_g}f`}
          </span>
        </div>
        <div style={{fontSize:12,color:A.text,lineHeight:1.4}}>{(fuel.foods||[]).join(' · ')}</div>
        {fuel.notes && <div style={{fontSize:11,color:A.textFaint,fontStyle:'italic',marginTop:4}}>{fuel.notes}</div>}
      </div>

}

// ── Pre/Post Card ─────────────────────────────────────────────

        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:9,color:accent,fontFamily:MONO,letterSpacing:1.2,fontWeight:700}}>{label}</div>

// ── Nutrition Card ────────────────────────────────────────────

        <MacroCard label="PROTEIN" value={t.protein_g} color="#ff5a3c" pct={(t.protein_g*4)/(t.calories_total||1)}/>

function MacroCard({label, value, color, pct}) {

// ── Day Timeline ──────────────────────────────────────────────
function DayTimeline({day, plan}) {
  const items = [];
  const activeRoutines = plan.daily_routines.filter(r => weekActive(r.active_weeks, day.week_number));
  if (activeRoutines.length) {
    const totalMin = activeRoutines.reduce((s,r) => s + (r.duration_min||0), 0);
    items.push({time:'06:30',kind:'routine',label:'Daily routines',dur:totalMin,color:'#4ade80'});
  }
  const mornSups = plan.supplements.filter(s => s.timing_slot==='morning' && weekActive(s.active_weeks, day.week_number));
  if (mornSups.length) items.push({time:'07:00',kind:'supp',label:`Morning supplements (${mornSups.length})`,color:'#22d3ee'});
  const fueling = day.nutrition?.session_fueling || [];
  for (const s of (day.run?.sessions||[])) {
    const pre = fueling.find(f => f.linked_session?.position==='pre' && f.linked_session?.type==='run');
    const post = fueling.find(f => f.linked_session?.position==='post' && f.linked_session?.type==='run');
    if (pre) items.push({time:'06:30',kind:'fuel',label:'Pre-run fuel',sub:(pre.foods||[])[0],color:'#ffb020'});
    items.push({time:'08:00',kind:'session',label:s.title,dur:s.duration_min,color:runColor(s.subtype).hue,sub:runColor(s.subtype).name});
    if (post) items.push({time:'09:30',kind:'fuel',label:'Post-run recovery',sub:(post.foods||[])[0],color:'#ffb020'});
  }
  for (const s of (day.strength?.sessions||[])) {
    const pre = fueling.find(f => f.linked_session?.position==='pre' && f.linked_session?.type==='strength');
    const post = fueling.find(f => f.linked_session?.position==='post' && f.linked_session?.type==='strength');
    if (pre) items.push({time:'16:00',kind:'fuel',label:'Pre-strength fuel',sub:(pre.foods||[])[0],color:'#ffb020'});
    items.push({time:'17:00',kind:'session',label:s.title,dur:s.duration_min,color:strColor(s.subtype).hue,sub:strColor(s.subtype).name});
    if (post) items.push({time:'18:30',kind:'fuel',label:'Post-strength meal',sub:(post.foods||[])[0],color:'#ffb020'});
  }
  const eveSups = plan.supplements.filter(s => s.timing_slot==='evening' && weekActive(s.active_weeks, day.week_number));
  if (eveSups.length) items.push({time:'21:30',kind:'supp',label:`Evening: ${eveSups.map(s=>s.name).join(', ')}`,color:'#22d3ee'});
  items.sort((a,b) => a.time.localeCompare(b.time));
  return (
    <div style={{background:A.surface,borderRadius:20,padding:'16px 18px 18px',border:`1px solid ${A.border}`}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
        <span style={{padding:'3px 8px',borderRadius:4,fontSize:10,fontWeight:700,letterSpacing:1.4,color:A.text,background:'rgba(255,255,255,0.06)',fontFamily:MONO}}>DAY TIMELINE</span>
        <div style={{flex:1}}/>
        <Icon name="clock" size={14} color={A.textFaint}/>
      </div>
      <div style={{position:'relative'}}>
        <div style={{position:'absolute',left:38,top:6,bottom:6,width:1,background:A.border}}/>
        {items.map((it,i) => (
          <div key={i} style={{display:'flex',gap:12,alignItems:'flex-start',padding:'6px 0'}}>
            <div style={{width:32,fontSize:10,color:A.textFaint,fontFamily:MONO,letterSpacing:0.5,fontWeight:600,paddingTop:4,textAlign:'right'}}>{it.time}</div>
            <div style={{width:12,height:12,borderRadius:6,marginTop:4,flexShrink:0,background:A.bg,border:`2px solid ${it.color}`,boxShadow:`0 0 0 3px ${A.surface}`}}/>
            <div style={{flex:1,minWidth:0,paddingBottom:4}}>
              <div style={{fontSize:13,color:A.text,fontWeight:600,fontFamily:SANS,lineHeight:1.3}}>
                {it.label}
                {it.dur && <span style={{color:A.textFaint,fontWeight:400,fontFamily:MONO,fontSize:10,marginLeft:6}}>{it.dur}m</span>}
              </div>
              {it.sub && <div style={{fontSize:10,color:it.color,fontFamily:MONO,letterSpacing:0.6,fontWeight:600,marginTop:1}}>{it.sub}</div>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Plan View (Week list) ─────────────────────────────────────
function buildWeeks(plan) {
  const map = {};
  for (const [date, day] of Object.entries(plan.days)) {
    const w = day.week_number;
    if (!map[w]) map[w] = {n:w,phase:day.run?.phase||day.strength?.phase||'',start:date,end:date,targets:day.run?.weekly_targets||{},weekNotes:day.run?.week_notes||'',days:[]};
    const m = map[w];
    if (date < m.start) m.start = date;
    if (date > m.end) m.end = date;
    m.days.push(day);
  }
  return Object.values(map).sort((a,b) => a.n - b.n);
}

function formatRange(s, e) {
  const fmt = d => d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  return `${fmt(new Date(s+'T00:00:00'))} — ${fmt(new Date(e+'T00:00:00'))}`;
}

          ))}
        </div>
      )}
    </div>
  );
}

function PlanView({plan, currentDate, onJumpToDay}) {

        <div style={{fontSize:22,fontWeight:800,color:A.text,fontFamily:DISPLAY,letterSpacing:-0.6,lineHeight:1.1}}>The full plan</div>
        <div style={{fontSize:12,color:A.textDim,marginTop:4}}>Tap any week to expand. Tap a workout to jump into that day.</div>
      </div>

        {[['Base','#4ade80'],['Build','#ff5a3c'],['Peak','#ffb020'],['Taper_1','#60a5fa'],['Race_week','#c084fc']].map(([k,c]) => (
          <div key={k} style={{display:'flex',alignItems:'center',gap:6,fontSize:9,color:A.textFaint,fontFamily:MONO,letterSpacing:1,fontWeight:600}}>
            <span style={{width:8,height:8,borderRadius:2,background:c}}/>
            {phaseStyle(k).label}
          </div>
        ))}
